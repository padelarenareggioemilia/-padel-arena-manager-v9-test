<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICS Padel Championship Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{
 --blue:#164a95;--blue2:#082f68;--green:#009246;--red:#ce2b37;
 --bg:#f4f8fc;--panel:#fff;--soft:#edf4fb;--text:#0a2e5e;--muted:#637b96;
 --line:#b9cde3;--shadow:0 14px 34px rgba(8,47,104,.13)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(90deg,rgba(0,146,70,.05),transparent 22%,transparent 78%,rgba(206,43,55,.05)),radial-gradient(circle at 50% 0%,rgba(22,74,149,.12),transparent 35%),var(--bg)}
body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%);z-index:999}
.shell{max-width:1200px;margin:auto;padding:22px 14px 90px}.top,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px;border-radius:24px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:15px}.brand-logo{width:125px;height:74px;object-fit:contain;background:#fff;border-radius:15px;padding:7px}.muted{color:var(--muted)}.hero .muted{color:#d7e5f5}
.nav,.actions,.grid-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,#2e6fba,var(--blue))}.secondary{color:var(--blue2);background:#fff;border:1px solid #2e6fba}.danger{color:#fff;background:var(--red)}.success{color:#fff;background:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{margin:9px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit}
.notice{padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--soft);margin:10px 0}.ok{background:#eaf8f0;border-color:var(--green)}.err{background:#fdecef;border-color:var(--red)}.warn{background:#fff8e6;border-color:#e1b94a}
.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#e7f0fb;border:1px solid var(--line);font-weight:900;font-size:12px}.tricolore{height:5px;border-radius:999px;margin-top:10px;background:linear-gradient(90deg,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%);border:1px solid #d7e3ef}
.kpi{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.kpi strong{display:block;font-size:24px;color:var(--blue)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;margin:9px 0}.switch{width:auto;transform:scale(1.35)}
.match{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;margin:10px 0}.match-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.countdown{font-variant-numeric:tabular-nums;font-size:25px;font-weight:1000;color:var(--blue)}
.lineup-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;margin:8px 0;background:#f8fbff}
.score-row{display:grid;grid-template-columns:160px repeat(4,90px);gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.hidden{display:none!important}.small{font-size:12px}.right{text-align:right}
@media(max-width:850px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.lineup-row,.score-row{grid-template-columns:1fr}.hero{align-items:flex-start}.brand-logo{width:98px;height:62px}}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="assets/aics-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/aics-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/aics-icon-180.png">

<meta name="application-name" content="AICS Padel Championship Manager">
<meta name="apple-mobile-web-app-title" content="AICS Padel">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta property="og:title" content="AICS Padel Championship Manager">
<meta property="og:description" content="Gestionale ufficiale AICS Padel Championship">
<meta property="og:image" content="assets/aics-social-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:title" content="AICS Padel Championship Manager">

<link rel="stylesheet" href="app-theme.css?v=980stable">
</head><body><main class="shell">
<div class="top"><div class="nav"><button class="btn secondary" onclick="history.back()">← Indietro</button><button class="btn secondary" onclick="location.href='lineups.html?fixture='+new URLSearchParams(location.search).get('id')">Formazioni e distinta</button><button class="btn secondary" onclick="location.href='calendar.html'">Calendario</button></div></div>
<header class="hero"><div class="brand"><img class="brand-logo" src="assets/aics-logo.png"><div><h1 style="margin:0">Centro gara</h1><div class="muted">Formazioni, distinta, risultati e referto</div></div></div></header><div class="tricolore"></div>
<section id="summary" class="card">Caricamento...</section>
<section id="teamChooser" class="card hidden"></section>
<section id="lineupCard" class="card hidden"><div class="match-head"><div><h2 style="margin:0">Formazione</h2><div id="lineupHint" class="muted"></div></div><div id="timer" class="countdown"></div></div>
<div id="lineupRows"></div><div class="actions"><button id="saveLineupBtn" class="btn primary" onclick="saveLineup()">Salva formazione</button><button class="btn secondary" onclick="printDistinct()">Stampa distinta</button></div><div id="lineupMsg" class="notice hidden"></div></section>
<section id="resultCard" class="card hidden"><h2>Risultato e referto</h2><div id="scores"></div><div class="actions"><button class="btn primary" onclick="saveResult()">Salva risultato</button><button class="btn secondary" onclick="printReport()">Genera referto</button></div><div id="resultMsg" class="notice hidden"></div></section>
<script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=i=>document.getElementById(i),fixtureId=new URLSearchParams(location.search).get('id');
let fixture,workflow,teams={},myTeam=null,players=[],savedLineup=null,isAdmin=false,controls;
const labels=['Maschile 1','Maschile 2','Misto','Femminile'];
function msg(id,t,e=false){let x=$(id);x.textContent=t;x.className='notice '+(e?'err':'ok');x.classList.remove('hidden')}
function state(){let n=Date.now(),sel=new Date(workflow.selection_lock_at).getTime(),line=new Date(workflow.lineup_lock_at).getTime();if(!workflow.formation_open_at)return 'waiting';if(n<sel)return 'selection';if(n<line)return 'rearrange';return 'distinct'}
async function init(){let q=await sb.auth.getSession();if(!q.data.session)return location.href='login.html';let [pr,fr,wr,tr,cr,rr]=await Promise.all([sb.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle(),sb.from('fixtures').select('*').eq('id',fixtureId).single(),sb.from('match_workflows').select('*').eq('fixture_id',fixtureId).maybeSingle(),sb.from('teams').select('*'),sb.from('championship_controls').select('*').eq('id',1).single(),sb.from('team_user_roles').select('*').eq('user_id',q.data.session.user.id).eq('active',true)]);isAdmin=pr.data?.role==='admin';fixture=fr.data;workflow=wr.data;controls=cr.data;teams=Object.fromEntries((tr.data||[]).map(x=>[x.id,x]));if(!workflow)return $('summary').innerHTML='<div class="notice warn">Il calendario non è ancora stato pubblicato.</div>';let roles=rr.data||[],allowed=[fixture.home_team_id,fixture.away_team_id].filter(Boolean);let mine=roles.find(r=>allowed.includes(r.team_id)&&['captain','secretary'].includes(r.role));if(isAdmin)renderChooser(allowed);else if(mine)selectTeam(mine.team_id);else $('teamChooser').innerHTML='<div class="notice err">Non sei autorizzato a gestire questa gara.</div>';renderSummary();renderResult();tick();setInterval(tick,1000)}
function renderSummary(){$('summary').innerHTML=`<div class="match-head"><div><span class="badge">${fixture.competition_code}</span><h2>${teams[fixture.home_team_id]?.name||fixture.home_placeholder||'Da definire'} – ${teams[fixture.away_team_id]?.name||fixture.away_placeholder||'Da definire'}</h2><div class="muted">${new Date(fixture.scheduled_at).toLocaleString('it-IT')} · ${fixture.venue||''}</div></div><span class="badge">${workflow.homologated_at?'Omologata':'Aperta'}</span></div>`}
function renderChooser(ids){$('teamChooser').classList.remove('hidden');$('teamChooser').innerHTML='<h2>Scegli la squadra da gestire</h2><div class="actions">'+ids.map(id=>`<button class="btn secondary" onclick="selectTeam('${id}')">${teams[id]?.name}</button>`).join('')+'</div>'}
async function selectTeam(id){myTeam=teams[id];$('lineupCard').classList.remove('hidden');let r=await sb.from('roster_requests').select('*').eq('team_id',id).eq('status','approved').order('last_name');players=(r.data||[]).filter(p=>p.user_id);let l=await sb.from('match_lineups').select('*').eq('fixture_id',fixtureId).eq('team_id',id).maybeSingle();savedLineup=l.data;renderLineup()}
function options(selected,genderRule=''){let allowed=players.filter(p=>!genderRule||String(p.gender||'').toLowerCase().startsWith(genderRule));return '<option value="">Seleziona</option>'+allowed.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${p.last_name} ${p.first_name}</option>`).join('')}
function renderLineup(){let data=savedLineup?.lineup||{};$('lineupRows').innerHTML=labels.map((lab,i)=>{let key='m'+(i+1),rule=i===2?'':i===3?'f':'m';return `<div class="lineup-row"><b>${lab}</b><select data-key="${key}" data-pos="a">${options(data[key]?.[0],i===2?'m':rule)}</select><select data-key="${key}" data-pos="b">${options(data[key]?.[1],i===2?'f':rule)}</select></div>`}).join('');applyState()}
function applyState(){let st=state(),selectedLocked=st!=='selection';$('lineupHint').textContent=st==='waiting'?'La formazione si aprirà dopo l’omologazione della gara precedente.':st==='selection'?'Puoi scegliere, aggiungere, rimuovere e sostituire i giocatori.':st==='rearrange'?'Convocati bloccati: puoi solo cambiare coppie e ordine usando gli stessi giocatori.':'Distinta ufficiale: nessuna modifica consentita.';document.querySelectorAll('#lineupRows select').forEach(x=>x.disabled=st==='waiting'||st==='distinct'||!controls.formations_enabled);$('saveLineupBtn').disabled=st==='waiting'||st==='distinct'||!controls.formations_enabled;if(selectedLocked&&savedLineup){let allowed=new Set(savedLineup.selected_player_ids||[]);document.querySelectorAll('#lineupRows select option').forEach(o=>{if(o.value&&!allowed.has(o.value))o.disabled=true})}}
function tick(){if(!workflow)return;let st=state(),target=st==='selection'?workflow.selection_lock_at:st==='rearrange'?workflow.lineup_lock_at:null;if(!target)return $('timer').textContent=st==='distinct'?'DISTINTA':st==='waiting'?'IN ATTESA':'';let d=new Date(target).getTime()-Date.now(),h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000),s=Math.floor(d%60000/1000);$('timer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;applyState()}
async function saveLineup(){let lineup={},selected=[];document.querySelectorAll('#lineupRows select').forEach(x=>{let k=x.dataset.key;lineup[k]=lineup[k]||['',''];lineup[k][x.dataset.pos==='a'?0:1]=x.value;if(x.value)selected.push(x.value)});if(selected.length!==8||new Set(selected).size!==8)return msg('lineupMsg','Devi inserire 8 giocatori diversi.',true);let r=await sb.rpc('save_match_lineup',{p_fixture_id:fixtureId,p_team_id:myTeam.id,p_selected:[...new Set(selected)],p_lineup:lineup});if(r.error)return msg('lineupMsg',r.error.message,true);msg('lineupMsg','Formazione salvata.');savedLineup={selected_player_ids:[...new Set(selected)],lineup};renderLineup()}
function renderResult(){$('resultCard').classList.remove('hidden');$('scores').innerHTML=labels.map((x,i)=>`<div class="score-row"><b>${x}</b><input type="number" min="0" max="7" data-r="${i}" data-k="h1" placeholder="Casa S1"><input type="number" min="0" max="7" data-r="${i}" data-k="a1" placeholder="Osp. S1"><input type="number" min="0" max="7" data-r="${i}" data-k="h2" placeholder="Casa S2"><input type="number" min="0" max="7" data-r="${i}" data-k="a2" placeholder="Osp. S2"></div>`).join('')}
async function saveResult(){let data={matches:labels.map((l,i)=>{let o={label:l};document.querySelectorAll(`[data-r="${i}"]`).forEach(x=>o[x.dataset.k]=x.value===''?null:+x.value);return o})};let r=await sb.rpc('save_match_result',{p_fixture_id:fixtureId,p_result:data});if(r.error)return msg('resultMsg',r.error.message,true);msg('resultMsg','Risultato salvato. Modificabile fino a 26 ore dall’inizio della gara, salvo omologazione.')}
function printDistinct(){window.print()}function printReport(){window.print()}
init();
</script><section class='card'><button class='btn primary' onclick="location.href='verify-player.html?fixture='+new URLSearchParams(location.search).get('id')">Scansiona tessera giocatore</button></section></main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
