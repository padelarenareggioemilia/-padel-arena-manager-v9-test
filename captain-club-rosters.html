<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club e rose · AICS Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--bg:#f4f8fc;--line:#b9cde3;--txt:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--txt)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.3%,#fff 33.3% 66.6%,#ce2b37 66.6%);z-index:9}.shell{max-width:1100px;margin:auto;padding:22px 14px 80px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 13px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.success{background:var(--g);color:#fff}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;margin:10px 0}.muted{color:var(--muted)}.hidden{display:none!important}.filters{display:grid;grid-template-columns:1fr 220px;gap:10px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.club{display:grid;grid-template-columns:82px 1fr;gap:14px}.logo{width:80px;height:80px;object-fit:contain;border:1px solid var(--line);border-radius:14px;padding:5px;background:#fff}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.player{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fafcff}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf2fb;font-size:12px;font-weight:900}.contact{padding:11px;border:1px solid #8bbda0;border-radius:12px;background:#eef9f2;margin-top:9px}.contact .actions{margin-top:7px}.contact .btn{padding:8px 10px;font-size:13px}@media(max-width:700px){.filters,.club,.players{grid-template-columns:1fr}.actions{display:grid}.actions .btn{width:100%;text-align:center}}
</style></head><body><main class="shell">
<div class="actions"><button class="btn secondary" onclick="history.back()">← Indietro</button><button class="btn secondary" onclick="location.href='captain-home.html?v=9970'">🏠 Area Capitano</button></div>
<header class="hero"><h1 style="margin:0">Club e rose tesserati</h1><div>Consultazione riservata a capitani e segretari.</div></header>
<section id="status" class="card">Caricamento club e rose…</section>
<section id="app" class="hidden"><section class="card"><div class="filters"><input id="search" type="search" placeholder="Cerca club, squadra o giocatore" oninput="clearFocus();render()"><select id="series" onchange="clearFocus();render()"><option value="">Tutte le serie</option></select></div><div id="focusActions" class="actions hidden" style="margin-top:9px"><button class="btn secondary" onclick="showAll()">Mostra tutti i club</button></div><div class="muted" style="margin-top:9px">Sono mostrati soltanto i giocatori approvati nella rosa. I dati personali restano riservati.</div></section><div id="clubs"></div></section>
</main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let teams=[],focusTeamId=new URLSearchParams(location.search).get('team');
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function phoneValue(v){let x=String(v||'').trim().replace(/[^0-9+]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);return x}
function whatsappValue(v){let x=phoneValue(v).replace(/\D/g,'');if(x.length===10&&x.startsWith('3'))x='39'+x;return x}
function contacts(t){const email=String(t.captain_email||'').trim(),phone=phoneValue(t.captain_phone),wa=whatsappValue(t.captain_phone);return `<div class="contact"><b>Capitano: ${esc(t.captain_name||'Non indicato')}</b><div class="actions">${email?`<a class="btn secondary" href="mailto:${encodeURIComponent(email)}">✉️ Email</a>`:''}${phone?`<a class="btn secondary" href="tel:${phone}">📞 Chiama</a>`:''}${wa?`<a class="btn success" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}${!email&&!phone?'<span class="muted">Recapiti non ancora inseriti.</span>':''}</div></div>`}
function player(p){const info=[p.gender==='F'?'Femminile':p.gender==='M'?'Maschile':'',p.fitp_ranking||'FITP non indicata'].filter(Boolean).join(' · ');return `<div class="player"><b>${esc(p.last_name||'')} ${esc(p.first_name||'')}</b><div class="muted">${esc(info)}</div></div>`}
function clearFocus(){focusTeamId=null;$('focusActions').classList.add('hidden')}
function showAll(){focusTeamId=null;$('search').value='';$('series').value='';$('focusActions').classList.add('hidden');render()}
function render(){const q=$('search').value.trim().toLowerCase(),s=$('series').value;const list=teams.filter(t=>!focusTeamId||String(t.id)===String(focusTeamId)).filter(t=>!s||String(t.series||'')===s).filter(t=>{const names=(t.players||[]).map(p=>`${p.first_name||''} ${p.last_name||''}`).join(' ');return !q||`${t.name||''} ${t.club_name||''} ${t.club_city||''} ${names}`.toLowerCase().includes(q)});$('clubs').innerHTML=list.map(t=>`<section class="card"><div class="club"><img class="logo" src="${esc(t.logo_url||'assets/aics-logo.png')}" alt=""><div><h2 style="margin:0">${esc(t.name||'Squadra')}</h2><div class="muted">${esc([t.series,t.club_name,t.club_city].filter(Boolean).join(' · '))}</div><span class="badge">${(t.players||[]).length} giocatori</span>${contacts(t)}</div></div><div class="players">${(t.players||[]).map(player).join('')||'<div class="notice">Nessun giocatore approvato nella rosa.</div>'}</div></section>`).join('')||'<section class="card"><div class="notice">Nessun risultato.</div></section>'}
async function load(){const session=(await sb.auth.getSession()).data.session;if(!session){location.replace('login.html');return}const modes=await sb.rpc('get_my_portal_modes');const md=Array.isArray(modes.data)?modes.data[0]:modes.data||{};if(modes.error||(!md.is_captain&&!md.is_secretary)){location.replace('account-home.html');return}const r=await sb.rpc('captain_get_club_rosters');if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data||{};teams=d.teams||[];const ss=[...new Set(teams.map(t=>t.series).filter(Boolean))].sort();$('series').innerHTML='<option value="">Tutte le serie</option>'+ss.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(focusTeamId&&!teams.some(t=>String(t.id)===String(focusTeamId)))focusTeamId=null;$('focusActions').classList.toggle('hidden',!focusTeamId);$('status').innerHTML=focusTeamId?'<b>Squadra avversaria aperta.</b> Qui trovi il capitano e la rosa completa.':`<b>${teams.length} club disponibili.</b> Accesso verificato per capitano/segretario.`;$('app').classList.remove('hidden');render()}
window.render=render;window.clearFocus=clearFocus;window.showAll=showAll;load().catch(e=>{$('status').textContent='Errore: '+(e.message||String(e))});
</script><script src="captain-print-share.js?v=9970"></script><div style="margin:12px auto 24px;width:max-content;max-width:calc(100% - 24px);padding:5px 8px;border-radius:999px;background:#082f68;color:white;font:700 10px system-ui">V9.9.70 CONTATTI NEL CAMPIONATO</div></body></html>
