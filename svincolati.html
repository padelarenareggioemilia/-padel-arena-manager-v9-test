<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS · Svincolati</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--txt:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--txt)}body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--g) 0 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%)}main{max-width:1100px;margin:auto;padding:18px 12px 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;margin:10px 0}.err{background:#fdecef;border-color:#dd7a85}.filters{display:grid;grid-template-columns:1fr 220px;gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}.muted{color:var(--muted)}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#e8f1fb;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{background:#f3f7fc;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:20px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.details>div{padding:9px;background:#f8fbff;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions a{display:inline-block;text-decoration:none}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:720px){.filters,.players,.details{grid-template-columns:1fr}.actions{display:grid}.actions .btn{width:100%}}
</style></head><body><main>
<div class="actions"><button class="btn secondary" onclick="history.back()">← Indietro</button><button class="btn secondary" onclick="location.href='index.html'">Centro di controllo</button></div>
<header class="hero"><h1 style="margin:0">SVINCOLATI</h1><p style="margin-bottom:0">Mercato condiviso dei giocatori disponibili · AICS Padel</p></header>
<section class="card"><div id="status" class="notice">Caricamento elenco…</div><div class="filters"><input id="search" type="search" placeholder="Cerca giocatore, squadra o classifica FITP"><select id="gender"><option value="">Tutti</option><option value="M">Maschile</option><option value="F">Femminile</option></select></div></section>
<section id="players" class="players"></section></main>
<script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let all=[],teams=[],isAdmin=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function fmtDate(v){if(!v)return'Non indicata';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('it-IT')}
function cert(v){if(!v)return'Non indicato';const d=new Date(v+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);return d<today?'Scaduto · '+fmtDate(v):fmtDate(v)}
function render(){const q=$('search').value.trim().toLowerCase(),g=$('gender').value;const rows=all.filter(p=>(!g||String(p.gender||'').toUpperCase()===g)&&(!q||[p.first_name,p.last_name,p.source_team_name,p.fitp_ranking].some(v=>String(v||'').toLowerCase().includes(q))));$('players').innerHTML=rows.map(p=>{const name=[p.first_name,p.last_name].filter(Boolean).join(' '),phone=String(p.phone||'').replace(/[^0-9+]/g,''),email=String(p.email||'').trim();return `<article class="player"><div class="badge">SVINCOLATO</div><h2>${esc(name)}</h2><div class="muted">Messo sul mercato da: <b>${esc(p.source_team_name||'Squadra non indicata')}</b></div><div class="details"><div><span class="muted">Classifica FITP</span><br><b>${esc(p.fitp_ranking||'Non indicata')}</b></div><div><span class="muted">Scadenza certificato</span><br><b>${esc(cert(p.medical_certificate_expiry))}</b></div><div><span class="muted">Motivo trasferimento</span><br><b>${esc(p.reason||'Non specificato')}</b></div><div><span class="muted">Inserito il</span><br><b>${esc(new Date(p.released_at).toLocaleDateString('it-IT'))}</b></div></div><div class="stats"><div class="stat"><span class="muted">Partite giocate</span><b>${Number(p.matches_played)||0}</b></div><div class="stat"><span class="muted">Vinte</span><b>${Number(p.matches_won)||0}</b></div><div class="stat"><span class="muted">Perse</span><b>${Number(p.matches_lost)||0}</b></div></div>${isAdmin?`<div class="field"><select id="marketTeam-${p.market_entry_id}"><option value="">Squadra che ha acquisito il giocatore</option>${teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="btn primary" onclick="markRecruited(\'${p.market_entry_id}\')">Registra acquisizione</button></div>`:'' }<div class="actions">${phone?`<a class="btn secondary" href="tel:${esc(phone)}">📞 ${esc(p.phone)}</a>`:''}${email?`<a class="btn secondary" href="mailto:${esc(email)}">✉️ ${esc(email)}</a>`:''}</div></article>`}).join('')||'<div class="card empty">Nessun giocatore disponibile tra gli svincolati.</div>'}
async function markRecruited(entryId){const teamId=$('marketTeam-'+entryId)?.value;if(!teamId)return alert('Seleziona la squadra che ha acquisito il giocatore.');if(!confirm('Confermi che il giocatore è stato inserito nella squadra selezionata tramite la procedura ordinaria V9?'))return;const r=await sb.rpc('admin_market_mark_recruited',{p_market_entry_id:entryId,p_recruited_team_id:teamId});if(r.error)return alert(r.error.message);alert('Acquisizione registrata. Il giocatore non è più visibile tra gli svincolati.');await start()}
async function start(){const s=await sb.auth.getSession();if(!s.data.session){location.replace('login.html');return}const profile=await sb.from('profiles').select('role').eq('id',s.data.session.user.id).maybeSingle();isAdmin=String(profile.data?.role||'').toLowerCase()==='admin';if(isAdmin){const tr=await sb.from('teams').select('id,name').order('name');teams=tr.data||[]}const r=await sb.rpc('market_list_svincolati');if(r.error){$('status').textContent=r.error.message;$('status').className='notice err';return}all=(r.data?.players||[]);$('status').textContent=all.length+' giocatori disponibili';render()}
$('search').oninput=render;$('gender').onchange=render;start().catch(e=>{$('status').textContent=e.message||String(e);$('status').className='notice err'});
</script></body></html>
