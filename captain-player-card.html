<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tessera giocatore</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}.shell{width:min(900px,calc(100% - 24px));margin:auto;padding:22px 0}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.pass{border:2px solid var(--b);border-radius:24px;padding:20px;background:linear-gradient(135deg,#fff,#edf4fb);overflow:hidden}.top{display:grid;grid-template-columns:95px minmax(0,1fr) 95px;gap:14px;align-items:center;border-bottom:2px solid var(--line);padding-bottom:15px}.logo{width:92px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:13px;padding:6px}.comp-logos{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}.comp-logo{display:block;width:78px;height:62px;max-width:100%;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px}.body{display:grid;grid-template-columns:170px minmax(0,1fr) 125px;gap:18px;padding-top:18px}.photo{width:160px;height:205px;object-fit:cover;border-radius:16px;border:1px solid var(--line)}.name{font-size:29px;font-weight:1000;color:var(--bd);overflow-wrap:anywhere}.row{padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.row b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}.qr{width:120px;height:120px;background:#fff;padding:5px;border:1px solid var(--line);border-radius:12px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb}.err{background:#fdecef}.hidden{display:none!important}@media(max-width:700px){.shell{width:min(100% - 12px,900px);padding:10px 0}.card{padding:8px;border-radius:16px}.pass{padding:12px;border-radius:18px}.top{grid-template-columns:56px minmax(0,1fr) 56px;gap:7px}.top h2{font-size:16px;line-height:1.1}.logo{width:56px;height:50px;padding:4px}.comp-logos{gap:6px;margin-top:7px}.comp-logo{width:60px;height:48px;padding:3px}.body{grid-template-columns:1fr;gap:13px}.photo{width:135px;height:170px;margin:auto}.qr{margin:auto}.name{text-align:center;font-size:24px}}
</style></head><body><main class="shell"><button class="btn secondary" onclick="history.back()">← Area Capitano</button><section class="card"><div id="status" class="notice">Caricamento tessera…</div><div id="card" class="pass hidden"></div></section></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),id=new URLSearchParams(location.search).get('player'),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
async function init(){try{const r=await s.rpc('captain_get_player_card',{p_player_id:id});if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data;if(!d)throw new Error('Tessera non disponibile');if(d.ok===false)throw new Error(d.message||'Tessera non disponibile');const p=d.player||{},t=d.team||{};const raw=String(t.series||'').toUpperCase().replace(/\s+/g,'_');const code=raw==='A'?'SERIE_A':raw==='B'?'SERIE_B':raw==='C'?'SERIE_C':raw;const logos={SERIE_A:'assets/serie-a.png',SERIE_B:'assets/serie-b.png',SERIE_C:'assets/serie-c.png'};const sLogo=logos[code]||'assets/aics-logo.png';card.innerHTML=`<div class="top"><img class="logo" src="assets/aics-logo.png"><div style="text-align:center"><h2 style="margin:0">AICS PADEL CHAMPIONSHIP</h2><strong>${esc(t.name||'')}</strong><div class="comp-logos"><img class="comp-logo" src="${sLogo}" onerror="this.src='assets/aics-logo.png'"><img class="comp-logo" src="assets/coppa-italia.png" onerror="this.src='assets/aics-logo.png'"></div></div>${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:''}</div><div class="body"><div>${p.photo_url?`<img class="photo" src="${esc(p.photo_url)}">`:'<div class="photo"></div>'}</div><div><div class="name">${esc(p.last_name||'')} ${esc(p.first_name||'')}</div><div class="row"><b>Squadra</b>${esc(t.name||'')}</div><div class="row"><b>Serie</b>${esc(t.series||'')}</div><div class="row"><b>Classifica FITP</b>${esc(p.fitp_ranking||'')}</div><div class="row"><b>Data di nascita</b>${esc(p.birth_date||'')}</div><div class="row"><b>Luogo di nascita</b>${esc(p.birth_place||'')}</div><div class="row"><b>Residenza</b>${esc([p.residence_town,p.residence_province,p.residence_postal_code].filter(Boolean).join(' · '))}</div><div class="row"><b>Telefono</b>${esc(p.phone||'')}</div><div class="row"><b>Email</b>${esc(p.email||'')}</div><div class="row"><b>Scadenza certificato</b>${esc(p.medical_certificate_expiry||'')}</div></div><div><div id="qr" class="qr"></div></div></div>`;card.classList.remove('hidden');new QRCode($('qr'),{text:`AICSPLAYER:${p.id}:${t.id}`,width:108,height:108});status.textContent='Tessera generata correttamente.'}catch(e){status.textContent='Errore: '+(e.message||e);status.className='notice err'}}init();
</script><div style="position:fixed;right:8px;bottom:8px;padding:5px 8px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui">V9.9.16 ASSISTENTE REGOLAMENTO</div></body></html>
