<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V9 · Situazione Tesseramenti</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--a:#d6a52d;--bg:#f4f8fc;--soft:#edf4fb;--text:#0a2e5e;--muted:#637b96;--line:#b9cde3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.33%,#fff 33.33% 66.66%,var(--r) 66.66%);z-index:30}
main{max-width:1450px;margin:auto;padding:18px 12px 90px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 13px 28px rgba(8,47,104,.1)}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.hero h1{margin:0}.muted{color:var(--muted)}.hero .muted{color:#dce9f7}
.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.actions{display:flex;gap:8px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.kpi{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--soft)}.kpi strong{display:block;font-size:25px;color:var(--b)}.kpi span{font-size:11px;color:var(--muted);font-weight:800}.good{background:#eaf8f0}.warn{background:#fff7dd}.bad{background:#fdecef}
.filters{display:grid;grid-template-columns:2fr repeat(2,1fr);gap:8px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:1200px}th,td{padding:9px;border-bottom:1px solid #dce6f0;text-align:left}th{background:var(--b);color:#fff;position:sticky;top:0}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid var(--line)}.p-green{background:#eaf8f0;color:#17683c}.p-yellow{background:#fff7dd;color:#7b5b08}.p-red{background:#fdecef;color:#982333}.p-blue{background:#e8f1fb;color:#164a95}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);margin:9px 0}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:1fr}}@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<div class="actions"><button class="btn secondary" onclick="location.href='index.html'">← Home</button><button class="btn secondary" onclick="location.href='diagnostics.html'">Centro diagnostico</button><button class="btn primary" onclick="location.href='admin-tesseramenti.html?v=9946'">Gestisci tesseramenti</button></div>
<header class="hero"><h1>Situazione Tesseramenti</h1><div class="muted">Tutte le squadre, tutti gli stati, una sola schermata Admin.</div></header>
<section class="card"><div id="msg" class="notice">Caricamento…</div><div id="kpis" class="kpis"></div></section>
<section class="card"><div class="filters"><input id="q" placeholder="Cerca squadra, club o capitano" oninput="render()"><select id="state" onchange="render()"><option value="">Tutti gli stati</option><option value="ricevuta_da_verificare">Ricevuta da verificare</option><option value="pronta_da_inviare">Pronta da inviare</option><option value="in_attesa_pagamento">In attesa pagamento</option><option value="da_gestire">Da gestire</option><option value="completa">Completa</option><option value="nessun_dato">Nessun dato</option></select><select id="series" onchange="render()"><option value="">Tutte le serie</option><option>Serie A</option><option>Serie B</option><option>Serie C</option></select></div></section>
<section class="card"><div class="table-wrap"><table><thead><tr><th>Squadra</th><th>Serie</th><th>Club</th><th>Rosa</th><th>Tesserati</th><th>Da tesserare</th><th>Non schierabili</th><th>Pagamento</th><th>Ricevute</th><th>Pronte invio</th><th>Inviate</th><th>Stato</th><th>Azioni</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=x=>document.getElementById(x);let data={summary:{},teams:[]};
function k(n,l,c=''){return `<div class="kpi ${c}"><strong>${Number(n||0)}</strong><span>${l}</span></div>`}
function stateLabel(s){return {ricevuta_da_verificare:['Ricevuta da verificare','p-red'],pronta_da_inviare:['Pronta da inviare','p-red'],in_attesa_pagamento:['In attesa pagamento','p-yellow'],da_gestire:['Da gestire','p-yellow'],completa:['Completa','p-green'],nessun_dato:['Nessun dato','p-blue']}[s]||[s,'p-blue']}
async function start(){const ses=(await sb.auth.getSession()).data.session;if(!ses){location='login.html';return}const p=await sb.from('profiles').select('role').eq('id',ses.user.id).maybeSingle();if(p.data?.role!=='admin'){location='public.html';return}const r=await sb.rpc('admin_tesseramenti_overview');if(r.error)throw r.error;data=r.data||data;const s=data.summary||{};$('kpis').innerHTML=k(s.squadre_totali,'Squadre')+k(s.roster_totale,'Giocatori rosa')+k(s.tesserati,'Tesserati','good')+k(s.da_tesserare,'Da tesserare',s.da_tesserare?'warn':'')+k(s.non_schierabili,'Non schierabili')+k(s.richieste_pagamento,'In attesa pagamento',s.richieste_pagamento?'warn':'')+k(s.ricevute_da_verificare,'Ricevute da verificare',s.ricevute_da_verificare?'bad':'')+k(s.pronte_da_inviare,'Pronte da inviare',s.pronte_da_inviare?'bad':'');$('msg').textContent=`Richieste inviate al Comitato: ${s.richieste_inviate||0} · Totale pratiche inviate: € ${Number(s.totale_inviato_euro||0).toFixed(2)}`;render()}
function render(){const q=($('q').value||'').toLowerCase(),st=$('state').value,se=$('series').value;const arr=(data.teams||[]).filter(t=>(!st||t.stato_operativo===st)&&(!se||t.series===se)&&(!q||[t.name,t.club_name,t.captain_name,t.captain_email].join(' ').toLowerCase().includes(q)));$('rows').innerHTML=arr.map(t=>{const sl=stateLabel(t.stato_operativo);return `<tr><td><b>${t.name||''}</b><br><small>${t.captain_name||''}</small></td><td>${t.series||'—'}</td><td>${t.club_name||'—'}</td><td>${t.roster_totale||0}</td><td><b>${t.tesserati||0}</b></td><td>${t.da_tesserare||0}</td><td>${t.non_schierabili||0}</td><td>${t.richieste_pagamento||0}</td><td>${t.ricevute_da_verificare||0}</td><td>${t.pronte_da_inviare||0}</td><td>${t.richieste_inviate||0}</td><td><span class="pill ${sl[1]}">${sl[0]}</span></td><td><button class="btn secondary" onclick="location.href='admin-tesseramenti.html?team=${t.id}&v=9946'">Apri</button></td></tr>`}).join('')||'<tr><td colspan="13">Nessuna squadra corrisponde ai filtri.</td></tr>'}
start().catch(e=>$('msg').textContent='Errore: '+e.message);
</script></body></html>
