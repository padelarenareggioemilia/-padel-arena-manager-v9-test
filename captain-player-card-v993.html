<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Tessera giocatore</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{font-family:system-ui;background:#f4f8fc;color:#0a2e5e}.shell{width:min(900px,95%);margin:auto}.card{background:#fff;border:1px solid #b9cde3;border-radius:22px;padding:18px}.pass{border:2px solid #164a95;border-radius:22px;padding:18px}.top{display:grid;grid-template-columns:90px 1fr 90px;gap:12px;align-items:center}.logo{width:88px;height:70px;object-fit:contain}.body{display:grid;grid-template-columns:160px 1fr 120px;gap:18px;margin-top:18px}.photo{width:155px;height:200px;object-fit:cover;border-radius:15px}.name{font-size:28px;font-weight:1000}.row{padding:7px;border-bottom:1px solid #b9cde3}.hidden{display:none}@media(max-width:700px){.body{grid-template-columns:1fr}.photo,#qr{margin:auto}}</style></head><body><main class="shell"><section class="card"><div id="status">Caricamento…</div><div id="card" class="pass hidden"></div></section></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),id=new URLSearchParams(location.search).get('player');(async()=>{try{const r=await s.rpc('captain_get_player_card',{p_player_id:id});if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data,p=d.player||{},t=d.team||{};card.innerHTML=`<div class="top"><img class="logo" src="assets/aics-logo.png"><div style="text-align:center"><h2>AICS PADEL CHAMPIONSHIP</h2><b>${t.name||''}</b></div>${t.logo_url?`<img class="logo" src="${t.logo_url}">`:''}</div><div class="body">${p.photo_url?`<img class="photo" src="${p.photo_url}">`:''}<div><div class="name">${p.last_name||''} ${p.first_name||''}</div><div class="row">Squadra: ${t.name||''}</div><div class="row">Serie: ${t.series||''}</div><div class="row">FITP: ${p.fitp_ranking||''}</div><div class="row">Certificato: ${p.medical_certificate_expiry||''}</div></div><div id="qr"></div></div>`;card.classList.remove('hidden');new QRCode(qr,{text:`AICSPLAYER:${p.id}:${t.id}`,width:108,height:108});status.textContent='Tessera generata.'}catch(e){status.textContent='Errore: '+(e.message||e)}})();</script></body></html>
