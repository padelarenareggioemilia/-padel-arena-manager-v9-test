<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contatore trasferimenti</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{font-family:system-ui;margin:0;background:#f4f8fc;color:#0a2e5e}main{max-width:850px;margin:24px auto;padding:12px}.card{background:white;border:1px solid #b9cde3;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #d7e3f0}.muted{color:#627b97}button{padding:10px 14px;border-radius:10px;border:1px solid #164a95;background:white;color:#164a95;font-weight:800}</style></head><body><main><button onclick="history.back()">← Indietro</button><section class="card"><h1>Trasferimenti per squadra</h1><p class="muted">Contatore informativo dei trasferimenti in uscita. Nessun limite automatico.</p><div id="status">Caricamento…</div><div id="rows"></div></section></main><script>const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]));async function start(){const s=await sb.auth.getSession();if(!s.data.session){location.replace('login.html');return}const p=await sb.from('profiles').select('role').eq('id',s.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin'){$('status').textContent='Accesso riservato all’amministratore.';return}const r=await sb.rpc('admin_get_transfer_counters');if(r.error){$('status').textContent='Errore: '+r.error.message;return}const rows=r.data?.teams||[];$('status').textContent=rows.length+' squadre';$('rows').innerHTML=rows.map(t=>'<div class="row"><b>'+esc(t.team_name)+'</b><span><b>'+Number(t.transfers_out||0)+'</b> trasferimenti</span></div>').join('')||'Nessuna squadra.'}start().catch(e=>$('status').textContent=e.message||String(e));</script></body></html>
