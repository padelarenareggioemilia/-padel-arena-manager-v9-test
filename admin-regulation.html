<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin · Domande regolamento</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#06111f;--card:#10233b;--line:#315676;--text:#f8fafc;--muted:#a9bacd;--lime:#9dff25;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}.shell{width:min(1050px,calc(100% - 20px));margin:auto;padding:18px 0 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.q{border:1px solid var(--line);border-left:6px solid #f5b82e;border-radius:14px;padding:13px;margin:10px 0}.closed{border-left-color:#4ade80}.muted{color:var(--muted)}textarea{width:100%;min-height:100px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#071523;color:#fff;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 13px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--lime);color:#07111f}.secondary{background:#17304e;color:#fff;border:1px solid var(--line)}.danger{background:#7f1d1d;color:#fff}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#17304e;font-size:12px;font-weight:900}@media(max-width:650px){.actions{display:grid}.btn{width:100%}}
</style></head><body><main class="shell"><section class="card"><h1>Domande sul regolamento</h1><p class="muted">Richieste che l’assistente non ha potuto risolvere con certezza.</p><div class="actions"><button class="btn secondary" onclick="location.href='index.html?v=9916'">Torna all’amministrazione</button><button class="btn primary" onclick="loadAll()">Aggiorna</button></div></section><section class="card"><div id="status">Caricamento…</div><div id="list"></div></section></main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
async function loadAll(){const session=(await sb.auth.getSession()).data.session;if(!session){location.replace('login.html');return}const p=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(p.data?.role!=='admin'){location.replace('account-home.html');return}const {data,error}=await sb.from('regulation_questions').select('*').order('created_at',{ascending:false});if(error){$('status').textContent='Errore: '+error.message;return}$('status').textContent=`${(data||[]).filter(x=>x.status==='pending_admin').length} richieste da esaminare`;$('list').innerHTML=(data||[]).map(card).join('')||'<div class="muted">Nessuna domanda ricevuta.</div>'}
function card(x){return `<article class="q ${x.status==='closed'?'closed':''}"><span class="badge">${esc(x.status)}</span><h3>${esc(x.question)}</h3><div class="muted">${new Date(x.created_at).toLocaleString('it-IT')} · Squadra: ${esc(x.team_name||x.team_id||'non disponibile')}</div>${x.automatic_answer?`<p><b>Valutazione automatica:</b> ${esc(x.automatic_answer)}</p>`:''}<textarea id="a-${x.id}" placeholder="Scrivi la risposta ufficiale…">${esc(x.admin_answer||'')}</textarea><label style="display:block;margin:10px 0"><input id="c-${x.id}" type="checkbox" ${x.added_as_clarification?'checked':''}> Usa questa risposta anche come chiarimento futuro</label><div class="actions"><button class="btn primary" onclick="answer('${x.id}')">Salva e invia risposta</button></div></article>`}
async function answer(id){const answer=$('a-'+id).value.trim(),clarification=$('c-'+id).checked;if(!answer)return alert('Inserisci la risposta.');const {error}=await sb.rpc('admin_answer_regulation_question',{p_question_id:id,p_answer:answer,p_add_as_clarification:clarification});if(error)return alert(error.message);await loadAll()}
loadAll();
</script><div style="margin:12px auto;width:max-content;padding:5px 8px;border-radius:999px;background:#17304e;font:700 10px system-ui">V9.9.16 ASSISTENTE REGOLAMENTO</div></body></html>
