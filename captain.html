<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Accesso Capitano</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:system-ui;color:var(--text)}.shell{width:min(760px,calc(100% - 24px));margin:auto;padding:24px 0}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0}.hero{background:linear-gradient(135deg,#164a95,#082f68);color:#fff}.logo{width:90px}.field{margin:10px 0}label{display:block;font-weight:900}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}.notice{padding:11px;border:1px solid var(--line);border-radius:11px;background:#edf4fb;margin:10px 0}.err{background:#fdecef}.actions{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><main class="shell"><section class="card hero"><h1>Portale Capitano</h1></section><section id="box" class="card">Verifica link…</section></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),t=new URLSearchParams(location.search).get('invite'),b=document.getElementById('box');let team;
const e=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function msg(x,z=false){const m=document.getElementById('m');m.textContent=x;m.className='notice '+(z?'err':'')}
async function init(){if(!t){b.innerHTML='<div class="notice err">Link capitano incompleto.</div>';return}const r=await s.rpc('public_team_by_captain_invite',{p_token:t});if(r.error||!r.data){b.innerHTML='<div class="notice err">Link non valido.</div>';return}team=Array.isArray(r.data)?r.data[0]:r.data;b.innerHTML=`${team.logo_url?`<img class="logo" src="${e(team.logo_url)}">`:''}<h2>${e(team.name)}</h2><div class="notice">Usa l’email capitano: <b>${e(team.captain_email)}</b></div><div class="field"><label>Email</label><input id="em" value="${e(team.captain_email)}"></div><div class="field"><label>Password</label><input id="pw" type="password"></div><div class="actions"><button class="btn primary" onclick="login()">Accedi</button><button class="btn secondary" onclick="signup()">Crea account</button><button class="btn danger" onclick="change()">Cambia account</button></div><div id="m" class="notice">Pronto.</div>`;const q=await s.auth.getSession();if(q.data.session)claim()}
async function login(){const r=await s.auth.signInWithPassword({email:em.value.trim().toLowerCase(),password:pw.value});if(r.error)return msg(r.error.message,true);claim()}
async function signup(){const r=await s.auth.signUp({email:em.value.trim().toLowerCase(),password:pw.value,options:{emailRedirectTo:new URL(`captain.html?invite=${encodeURIComponent(t)}&claim=1&v=987`,location.href).href}});if(r.error)return msg(r.error.message,true);if(!r.data.session)return msg('Conferma l’email e riapri questo link.');claim()}
async function claim(){const r=await s.rpc('claim_team_as_captain',{p_token:t});if(r.error)return msg(r.error.message,true);const d=Array.isArray(r.data)?r.data[0]:r.data;if(d?.success===false)return msg(d.message,true);msg('Squadra collegata. Apertura Area Capitano…');setTimeout(()=>location.replace('captain-home.html?v=987'),500)}
async function change(){try{await s.auth.signOut({scope:'local'})}catch(e){}location.replace(`captain.html?invite=${encodeURIComponent(t)}&v=987`)}
window.login=login;window.signup=signup;window.change=change;init();
</script></body></html>
