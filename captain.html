<!doctype html><html lang="it"><head><title>Portale Capitano V9</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#07111f;--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25;--blue:#16a8ff;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
main{max-width:1000px;margin:auto;padding:16px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.card{background:#10233bf5;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}label{display:block;font-size:13px;font-weight:800;margin-bottom:5px;color:#c8d7e6}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:#fff}button,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border:0;border-radius:12px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#07111f}.secondary{background:#17304e;color:#fff;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.success{border-color:#4ade80;background:#0b2a20}.error{border-color:#ef4444;background:#351316}.hidden{display:none!important}.team{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border:1px solid #315271;border-radius:15px;background:#09182a;margin:9px 0}.pill{padding:5px 9px;border-radius:999px;background:#203754;font-size:12px;font-weight:900}.nav{display:flex;gap:8px;margin-bottom:12px}.nav>*{flex:1}.request{padding:13px;border:1px solid #315271;border-radius:14px;background:#09182a;margin:8px 0}.request h3{margin:0 0 6px}.small{font-size:12px}
@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.team{grid-template-columns:1fr}.actions button,.actions a{flex:1}}
</style></head><body><main>
<div class="top"><div class="brand"><div class="logo">C</div><div><h1 style="margin:0">Portale Capitano</h1><div class="muted">Account obbligatorio</div></div></div></div>
<div class="nav"><button class="secondary" onclick="history.back()">← Indietro</button><button class="secondary" onclick="location.href='index.html'">⌂ Home</button></div>
<div id="box" class="card">Verifica invito...</div>
<script>
const cfg=window.PAM_V9_CONFIG||{},sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),token=new URLSearchParams(location.search).get('invite'),box=document.getElementById('box');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let team=null;
async function init(){if(!token){box.innerHTML='<h2>Invito non valido</h2>';return}const r=await sb.rpc('public_team_by_captain_invite',{p_token:token});if(r.error||!r.data){box.innerHTML='<h2>Invito non valido</h2><p class="muted">Chiedi un nuovo link all’organizzatore.</p>';return}team=r.data;renderAuth()}
function renderAuth(){box.innerHTML=`<h2>${esc(team.name)}</h2><p class="muted">${esc(team.series||'')} · ${esc(team.club_name||'')}</p><div class="notice">Accedi o crea l’account usando <b>${esc(team.captain_email)}</b>.</div><div class="field"><label>Email</label><input id="e" type="email" value="${esc(team.captain_email)}"></div><div class="field"><label>Password</label><input id="p" type="password"></div><div class="actions"><button class="primary" id="login">Accedi</button><button class="secondary" id="signup">Crea account</button></div><div id="m" class="notice hidden"></div>`;document.getElementById('login').onclick=login;document.getElementById('signup').onclick=signup;sb.auth.getSession().then(r=>{if(r.data.session)claim()})}
function msg(t,e=false){const m=document.getElementById('m');m.textContent=t;m.className='notice '+(e?'error':'success');m.classList.remove('hidden')}
async function login(){const r=await sb.auth.signInWithPassword({email:document.getElementById('e').value.trim(),password:document.getElementById('p').value});if(r.error)return msg(r.error.message,true);claim()}
async function signup(){const r=await sb.auth.signUp({email:document.getElementById('e').value.trim(),password:document.getElementById('p').value,options:{data:{first_name:team.captain_name}}});if(r.error)return msg(r.error.message,true);if(!r.data.session)return msg('Account creato. Conferma l’email e poi riapri questo link.');claim()}
async function claim(){const r=await sb.rpc('claim_team_as_captain',{p_token:token});if(r.error)return msg(r.error.message,true);team=r.data;renderPortal()}
async function renderPortal(){const rr=await sb.from('roster_requests').select('*').eq('team_id',team.id).order('created_at',{ascending:false});box.innerHTML=`<h2>${esc(team.name)}</h2><p class="muted">${esc(team.series||'')} · ${esc(team.club_name||'')}</p><div class="actions"><button class="secondary" onclick="copyPlayers()">Copia link giocatori</button><button class="secondary" onclick="logout()">Esci</button></div><h3>Richieste rosa</h3><div id="requests">${(rr.data||[]).map(x=>`<div class="request"><h3>${esc(x.first_name)} ${esc(x.last_name)}</h3><div class="muted">${esc(x.email)} · ${esc(x.phone)}</div><div class="pill">${esc(x.status)}</div>${x.status==='pending'?`<div class="actions" style="margin-top:8px"><button class="primary" onclick="decide('${x.id}','approved')">Approva</button><button class="danger" onclick="decide('${x.id}','rejected')">Rifiuta</button></div>`:''}</div>`).join('')||'<p class="muted">Nessuna richiesta.</p>'}</div>`}
function copyPlayers(){const u=new URL('player.html?team='+encodeURIComponent(team.player_invite_token),location.href).href;navigator.clipboard?.writeText(u).then(()=>alert('Link copiato')).catch(()=>prompt('Copia il link:',u))}
async function decide(id,status){const r=await sb.from('roster_requests').update({status,decided_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else renderPortal()}
async function logout(){await sb.auth.signOut();location.reload()}
init();
</script></main></body></html>
