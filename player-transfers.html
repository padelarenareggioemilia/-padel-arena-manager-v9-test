<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AICS · Trasferimenti giocatori</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--g) 0 33.33%,#fff 33.33% 66.66%,var(--r) 66.66%)}main{width:min(850px,calc(100% - 24px));margin:22px auto 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}label{display:block;font-weight:900;margin-bottom:6px}select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}textarea{min-height:80px}.btn{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;line-height:1.45}.ok{background:#eaf8f0;border-color:#77bd90}.err{background:#fdecef;border-color:#dd7a85}.actions{display:flex;gap:8px;flex-wrap:wrap}.history{padding:10px;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.actions{display:grid}.btn{width:100%}}
</style></head><body><main><section class="hero"><h1 style="margin:0">Trasferimenti giocatori</h1><div>Funzione riservata all’amministratore</div></section><section class="card"><div id="status" class="notice">Caricamento squadre…</div></section><section id="app" class="card" hidden><div class="grid"><div class="field"><label>1. Squadra di provenienza</label><select id="fromTeam"><option value="">Seleziona squadra</option></select></div><div class="field"><label>2. Giocatore</label><select id="player" disabled><option value="">Seleziona prima la squadra</option></select></div></div><div class="field"><label>3. Squadra di destinazione</label><select id="toTeam"><option value="">Seleziona nuova squadra</option></select></div><div class="field"><label>Nota facoltativa</label><textarea id="note" placeholder="Motivo o riferimento del trasferimento"></textarea></div><div id="summary" class="notice">Seleziona provenienza, giocatore e destinazione.</div><div class="actions" style="margin-top:14px"><button id="transferBtn" class="btn danger" disabled>Conferma trasferimento</button><button class="btn secondary" onclick="location.href='index.html'">Torna al centro di controllo</button></div></section><section class="card"><h2>Ultimi trasferimenti</h2><div id="history" class="muted">Caricamento…</div></section></main><script>
const cfg=window.PAM_V9_CONFIG,$=id=>document.getElementById(id),sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let teams=[],players=[];const E=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function option(t){return `<option value="${t.id}">${E(t.name)} · ${E(t.series||'Senza serie')}</option>`}function selected(id,list){return list.find(x=>x.id===id)}
function updateSummary(){const f=selected($('fromTeam').value,teams),p=selected($('player').value,players),t=selected($('toTeam').value,teams),valid=f&&p&&t&&f.id!==t.id;$('transferBtn').disabled=!valid;$('summary').innerHTML=valid?`Stai per trasferire <b>${E((p.first_name||'')+' '+(p.last_name||''))}</b><br>da <b>${E(f.name)}</b> a <b>${E(t.name)}</b>.`:'Seleziona una squadra di destinazione diversa da quella di provenienza.'}
async function loadPlayers(){const id=$('fromTeam').value;$('player').disabled=true;$('player').innerHTML='<option>Caricamento…</option>';if(!id){players=[];$('player').innerHTML='<option value="">Seleziona prima la squadra</option>';updateSummary();return}const r=await sb.from('roster_requests').select('id,first_name,last_name,email,status,team_id').eq('team_id',id).order('last_name');if(r.error)return show(r.error.message,true);players=r.data||[];$('player').innerHTML='<option value="">Seleziona giocatore</option>'+players.map(p=>`<option value="${p.id}">${E(p.last_name||'')} ${E(p.first_name||'')} · ${E(p.email||'senza email')}</option>`).join('');$('player').disabled=false;updateSummary()}
function show(t,err=false,ok=false){$('status').textContent=t;$('status').className='notice '+(err?'err':ok?'ok':'')}
async function loadHistory(){const r=await sb.from('player_transfer_history').select('*,from_team:from_team_id(name),to_team:to_team_id(name)').order('transferred_at',{ascending:false}).limit(20);if(r.error){$('history').textContent='Storico non disponibile: '+r.error.message;return}$('history').innerHTML=(r.data||[]).map(x=>`<div class="history"><b>${E(x.player_name||'Giocatore')}</b><div>${E(x.from_team?.name||'Squadra')} → ${E(x.to_team?.name||'Squadra')}</div><div class="muted">${E(new Date(x.transferred_at).toLocaleString('it-IT'))}${x.note?' · '+E(x.note):''}</div></div>`).join('')||'Nessun trasferimento registrato.'}
async function transfer(){const p=selected($('player').value,players),f=selected($('fromTeam').value,teams),t=selected($('toTeam').value,teams);if(!p||!f||!t||f.id===t.id)return;if(!confirm(`Confermi il trasferimento di ${p.first_name||''} ${p.last_name||''}\nda ${f.name}\na ${t.name}?`))return;$('transferBtn').disabled=true;$('transferBtn').textContent='Trasferimento in corso…';const r=await sb.rpc('admin_transfer_player',{p_player_id:p.id,p_to_team_id:t.id,p_note:$('note').value.trim()});$('transferBtn').textContent='Conferma trasferimento';if(r.error){show('Trasferimento non riuscito: '+r.error.message,true);updateSummary();return}const out=Array.isArray(r.data)?r.data[0]:r.data;show(`${out.player_name} trasferito da ${out.from_team} a ${out.to_team}.`,false,true);$('note').value='';await loadPlayers();await loadHistory()}
async function start(){const q=await sb.auth.getSession();if(!q.data.session){location.replace('login.html');return}const p=await sb.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin'){show('Accesso riservato all’amministratore.',true);return}const r=await sb.from('teams').select('id,name,series').order('name');if(r.error)return show(r.error.message,true);teams=r.data||[];const opts=teams.map(option).join('');$('fromTeam').insertAdjacentHTML('beforeend',opts);$('toTeam').insertAdjacentHTML('beforeend',opts);$('app').hidden=false;show('Seleziona il giocatore da trasferire.',false,true);await loadHistory()}
$('fromTeam').onchange=loadPlayers;$('player').onchange=updateSummary;$('toTeam').onchange=updateSummary;$('transferBtn').onclick=transfer;start().catch(e=>show(e.message||String(e),true));
</script></body></html>
