<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICS Padel · Ricorsi risultati</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--y:#d79b00;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}.shell{max-width:1000px;margin:auto;padding:20px 12px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.appeal{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.success{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.warning{background:var(--y);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;background:#edf4fb;border:1px solid var(--line);border-radius:12px}.muted{color:#637b96}.field{margin:9px 0}textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}</style></head><body><main class="shell"><div class="actions"><button class="btn secondary" onclick="location.href='admin-control.html?v=9987'">← Controllo Admin</button></div><header class="hero"><h1 style="margin:0">Ricorsi sui risultati</h1><div>Valutazione e autorizzazione delle rettifiche dopo la chiusura</div></header><section id="status" class="card">Caricamento…</section><section id="list" class="card"></section></main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function resolveAppeal(id,state){const notes=document.getElementById('notes-'+id).value.trim();if(!confirm(`Confermi lo stato ${state}?`))return;const r=await sb.rpc('admin_resolve_result_appeal',{p_appeal_id:id,p_status:state,p_notes:notes||null});if(r.error)return alert(r.error.message);await load()}
async function load(){const session=await sb.auth.getSession();if(!session.data.session)return location.href='login.html';const p=await sb.from('profiles').select('role').eq('id',session.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin')return location.href='account-home.html';const r=await sb.rpc('admin_get_result_appeals');if(r.error){$('status').textContent='Errore: '+r.error.message;return}const rows=Array.isArray(r.data)?r.data:[];$('status').textContent=`${rows.length} ricorsi presenti.`;$('list').innerHTML=rows.map(a=>`<article class="appeal"><b>${esc(a.home_team_name)} – ${esc(a.away_team_name)}</b><div class="muted">${new Date(a.scheduled_at).toLocaleString('it-IT')} · Presentato da ${esc(a.team_name)} il ${new Date(a.submitted_at).toLocaleString('it-IT')}</div><h3>Stato: ${esc(a.status)}</h3><p>${esc(a.reason)}</p><div class="field"><label>Note del Comitato</label><textarea id="notes-${a.id}">${esc(a.resolution_notes||'')}</textarea></div><div class="actions"><button class="btn warning" onclick="resolveAppeal('${a.id}','reviewing')">In esame</button><button class="btn success" onclick="resolveAppeal('${a.id}','accepted')">Accetta e autorizza modifica</button><button class="btn danger" onclick="resolveAppeal('${a.id}','rejected')">Respingi</button><button class="btn primary" onclick="resolveAppeal('${a.id}','resolved')">Chiudi</button><button class="btn secondary" onclick="location.href='match-center.html?id=${a.fixture_id}&v=9987'">Apri risultato</button></div></article>`).join('')||'<div class="notice">Nessun ricorso presente.</div>'}
window.resolveAppeal=resolveAppeal;load();
</script></body></html>
