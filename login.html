<!doctype html><html lang="it"><head><title>AICS Padel Championship Manager</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111f"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#06111f;--panel:#102842;--line:#315a7d;--text:#f7fafc;--muted:#a9bbce;--lime:#9dff1f;--blue:#1cb5ff;--red:#ff4d5e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06111f,#040b13);color:var(--text);font-family:system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:14px 14px 80px}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 16px}.brand{display:flex;align-items:center;gap:14px}.mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--lime),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.muted{color:var(--muted)}h1{font-size:clamp(30px,5vw,46px);margin:0}.card{background:linear-gradient(180deg,#102842,#091b2d);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0}.top{position:sticky;top:0;z-index:10;background:#06111fed;backdrop-filter:blur(10px);padding:10px;border:1px solid var(--line);border-radius:18px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--lime);color:#07111f}.secondary{background:#193957;color:#fff;border:1px solid #416b91}.danger{background:#7c1f2a;color:#fff;border:1px solid var(--red)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{margin:9px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #416b91;background:#071522;color:#fff}textarea{min-height:85px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:12px;border-radius:13px;background:#071522;border:1px solid var(--line);margin:10px 0}.ok{border-color:#42e58a}.err{border-color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{padding:14px;border-radius:16px;background:#0a1d31;border:1px solid var(--line)}.kpi strong{display:block;font-size:25px;color:var(--lime)}.team{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:17px;background:#091a2b;margin:9px 0}.logo{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:15px;padding:4px}.placeholder{width:76px;height:76px;border-radius:15px;display:grid;place-items:center;background:#173653;font-size:28px}.meta{font-size:13px;color:var(--muted);line-height:1.5}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#1b3b59;font-size:11px;font-weight:900}.preview{width:120px;height:120px;border:1px dashed #5b82a5;border-radius:17px;display:grid;place-items:center;overflow:hidden;background:#071522}.preview img{width:100%;height:100%;object-fit:contain;background:white}@media(max-width:800px){.grid2,.kpis{grid-template-columns:1fr}.team{grid-template-columns:64px 1fr}.team>.actions{grid-column:1/-1}.logo,.placeholder{width:60px;height:60px}.actions .btn{flex:1}}
</style><style>
:root{
  --aics-blue:#164a95;
  --aics-blue-dark:#082f68;
  --aics-blue-soft:#2e6fba;
  --italy-green:#009246;
  --italy-red:#ce2b37;
  --bg:#f4f8fc;
  --panel:#ffffff;
  --panel-soft:#edf4fb;
  --text:#0a2e5e;
  --muted:#627b97;
  --line:#b9cde3;
  --shadow:0 14px 34px rgba(8,47,104,.13);
}
html{background:var(--bg)}
body{
  color:var(--text)!important;
  background:
    linear-gradient(90deg,rgba(0,146,70,.05),transparent 23%,transparent 77%,rgba(206,43,55,.05)),
    radial-gradient(circle at 50% 0%,rgba(22,74,149,.12),transparent 34%),
    var(--bg)!important;
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto 0;
  height:6px;
  z-index:9999;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
}
.hero{
  background:linear-gradient(135deg,var(--aics-blue),var(--aics-blue-dark))!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.25)!important;
  border-radius:24px!important;
  padding:18px!important;
  box-shadow:var(--shadow)!important;
}
.hero .muted{color:#d9e6f5!important}
.brand-logo{
  width:132px;
  height:78px;
  object-fit:contain;
  padding:8px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}
.mark{display:none!important}
.top,.card,.comp,.group,.comp-card{
  background:rgba(255,255,255,.98)!important;
  color:var(--text)!important;
  border:1px solid var(--line)!important;
  box-shadow:var(--shadow)!important;
}
.primary{background:linear-gradient(135deg,var(--aics-blue-soft),var(--aics-blue))!important;color:#fff!important}
.secondary{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--aics-blue-soft)!important}
.blue{background:var(--aics-blue)!important;color:#fff!important}
.danger{background:var(--italy-red)!important;color:#fff!important}
.ghost{background:#fff!important;color:var(--aics-blue)!important;border:1px solid var(--line)!important}
input,select,textarea{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
label{color:var(--aics-blue-dark)!important}
.notice{background:var(--panel-soft)!important;color:var(--text)!important;border-color:var(--line)!important}
.ok{background:#eaf8f0!important;border-color:var(--italy-green)!important}
.err{background:#fdecef!important;border-color:var(--italy-red)!important}
.kpi,.team,.fixture,.team-pill,.mini-team,.request{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
  box-shadow:0 8px 20px rgba(8,47,104,.07)!important;
}
.kpi strong{color:var(--aics-blue)!important}
.filter{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--line)!important}
.filter.active{
  color:#fff!important;
  border-color:var(--aics-blue)!important;
  background:linear-gradient(90deg,var(--italy-green),var(--aics-blue),var(--italy-red))!important;
}
.badge{background:#e8f1fb!important;color:var(--aics-blue-dark)!important;border-color:var(--line)!important}
.logo,.big-logo,.mini-logo,.comp-logo,.comp img{background:#fff!important;border-color:#dce6f2!important}
.placeholder{background:linear-gradient(135deg,#e8f1fb,#fff)!important;color:var(--aics-blue)!important}
.more-menu,.dialog-card{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
.more-menu .delete-item{background:#fff4f5!important;color:var(--italy-red)!important}
.tricolore{
  height:5px;
  border-radius:999px;
  margin:10px 0 0;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
  border:1px solid #d7e3ef;
}
.section-ribbon{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  font-weight:900;
  color:var(--aics-blue-dark);
  border:1px solid #d7e3ef;
  background:linear-gradient(90deg,rgba(0,146,70,.12),rgba(255,255,255,.95),rgba(206,43,55,.12));
}
@media(max-width:800px){
  .brand-logo{width:100px;height:62px}
}
</style>

</head><body><main class="shell" style="max-width:840px">
<header class="hero"><div class="brand"><img class="brand-logo" src="assets/aics-logo.png" alt="AICS"><div><h1 style="margin:0">AICS PADEL CHAMPIONSHIP</h1><div class="muted">Portale ufficiale · Accesso facoltativo</div></div></div></header>
<div class="tricolore"></div>
<section class="card">
  <div class="notice">
    Senza account puoi consultare struttura, gironi, calendari, risultati e classifiche.
    Accedendo vengono abilitate automaticamente le funzioni previste dal tuo ruolo.
  </div>
  <div class="actions"><button class="btn secondary" style="width:100%" onclick="location.href='public.html'">Continua senza account</button></div>
</section>
<section class="card">
  <h2>Accedi al tuo account</h2>
  <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
  <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
  <div class="actions"><button class="btn primary" id="login">Accedi</button></div>
  <div id="msg" class="notice hidden"></div>
<script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=i=>document.getElementById(i);
function m(t,e=false){$('msg').textContent=t;$('msg').className='notice '+(e?'err':'ok');$('msg').classList.remove('hidden')}
async function destinationForUser(userId){
  const p=await s.from('profiles').select('role').eq('id',userId).maybeSingle();
  if(p.data?.role==='admin')return 'index.html';
  const r=await s.from('team_user_roles').select('role,team_id,active').eq('user_id',userId).eq('active',true);
  if(r.error)throw r.error;
  const roles=r.data||[];
  const operational=roles.find(x=>['captain','secretary'].includes(x.role));
  if(operational)return `captain.html?team=${encodeURIComponent(operational.team_id)}`;
  const player=roles.find(x=>x.role==='player');
  if(player)return `player.html?team=${encodeURIComponent(player.team_id)}`;
  return 'public.html';
}
$('login').onclick=async()=>{
  const r=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(r.error)return m(r.error.message,true);
  try{location.href=await destinationForUser(r.data.user.id)}catch(e){m(e.message||String(e),true)}
};
s.auth.getSession().then(async r=>{if(r.data.session)location.href=await destinationForUser(r.data.session.user.id)});</script></main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
