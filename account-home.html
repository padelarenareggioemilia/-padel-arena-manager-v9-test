<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICS Padel Championship · Area account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7fb;font-family:system-ui;color:#092d5d}.card{width:min(560px,calc(100% - 28px));background:#fff;border:1px solid #bfd0e2;border-radius:20px;padding:20px;text-align:center}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer;margin:4px}.primary{background:#164a95;color:#fff}.secondary{background:#fff;color:#164a95;border:1px solid #164a95}.danger{background:#ce2b37;color:#fff}.notice{padding:11px;border:1px solid #bfd0e2;border-radius:11px;background:#eaf2fb;margin:12px 0}</style>
</head><body><main class="card"><h1>AICS PADEL CHAMPIONSHIP</h1><div id="msg" class="notice">Riconoscimento account in corso…</div><button class="btn secondary" onclick="location.href='public.html?v=player10'">Naviga come Free</button><button class="btn danger" onclick="changeAccount()">Logout / Cambia account</button></main>
<script>
const cfg=window.PAM_V9_CONFIG;
const msg=document.getElementById('msg');
if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey){msg.textContent='Configurazione Supabase non disponibile.';throw new Error('PAM_V9_CONFIG mancante');}
const client=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
async function destinationForUser(user){
  const uid=user.id;
  const profile=await client.from('profiles').select('role').eq('id',uid).maybeSingle();
  if(!profile.error&&profile.data?.role==='admin')return 'index.html';

  const resolved=await client.rpc('resolve_my_portal');
  if(resolved.error)throw resolved.error;
  if(resolved.data?.destination)return resolved.data.destination;

  return 'public.html?v=player10';
}
async function init(){
  const current=await client.auth.getSession();
  if(!current.data.session){location.replace('login.html?v=player10');return;}
  try{location.replace(await destinationForUser(current.data.session.user));}
  catch(error){msg.textContent='Errore nel riconoscimento account: '+(error.message||String(error));}
}
async function changeAccount(){await client.auth.signOut({scope:'local'});location.replace('login.html?change=1&v=player10');}
window.changeAccount=changeAccount;init();
</script></body></html>
