<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AICS Padel Championship · Area account</title>
  <meta name="theme-color" content="#164a95">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(90deg,rgba(0,146,70,.05),transparent 24%,transparent 76%,rgba(206,43,55,.05)),var(--bg);font-family:system-ui;color:var(--text)}
    body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.333%,#fff 33.333% 66.666%,var(--r) 66.666%)}
    .card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center;box-shadow:0 18px 46px rgba(8,47,104,.14)}
    .logo{width:120px;height:72px;object-fit:contain;padding:7px;border:1px solid #dce6f2;border-radius:15px;background:#fff}
    h1{margin:14px 0 5px;color:var(--bd);font-size:clamp(25px,6vw,37px)}.muted{color:var(--muted)}
    .notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;margin:14px 0;text-align:left;line-height:1.5}.ok{background:#ebf8f0;border-color:#79bf90}.err{background:#fdecef;border-color:#dd7a85}
    .loader{width:34px;height:34px;margin:16px auto;border:4px solid #dce7f2;border-top-color:var(--b);border-radius:50%;animation:spin .8s linear infinite}.hidden{display:none!important}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}
    @keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.actions{display:grid}.btn{width:100%}}
  </style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/aics-logo.png" alt="AICS">
  <h1>AICS PADEL CHAMPIONSHIP</h1>
  <div class="muted">Accesso automatico all’area corretta</div>
  <div id="loader" class="loader"></div>
  <div id="msg" class="notice">Riconoscimento account in corso…</div>
  <div class="actions">
    <button id="retry" class="btn primary hidden" onclick="init()">Riprova</button>
    <button class="btn secondary" onclick="location.href='public.html?v=984'">Portale pubblico</button>
    <button class="btn danger" onclick="changeAccount()">Logout / Cambia account</button>
  </div>
</main>
<div style="position:fixed;right:8px;bottom:8px;padding:4px 7px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui;opacity:.75">V9.8.2 PLAYER ROLE FIX</div>
<script>
const cfg=window.PAM_V9_CONFIG,$=id=>document.getElementById(id);
let s=null,moving=false;
function message(t,e=false){$('msg').textContent=t;$('msg').className='notice '+(e?'err':'ok')}
async function init(){
 if(moving)return;
 $('retry').classList.add('hidden');$('loader').classList.remove('hidden');message('Riconoscimento account in corso…');
 if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey){$('loader').classList.add('hidden');$('retry').classList.remove('hidden');return message('Configurazione Supabase non disponibile.',true)}
 if(!s)s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
 try{
   const q=await s.auth.getSession();
   if(q.error)throw q.error;
   const session=q.data.session;
   if(!session){location.replace('login.html?v=984');return}
   const p=await s.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
   if(p.error)throw p.error;
   const role=String(p.data?.role||'').trim().toLowerCase();
   moving=true;
   if(role==='admin'){
     message('Account amministratore riconosciuto. Apertura gestionale…');
     return setTimeout(()=>location.replace('index.html?v=984'),250);
   }
   if(role==='player'||role==='giocatore'){
     message('Account giocatore riconosciuto. Apertura area giocatore…');
     return setTimeout(()=>location.replace('player-home.html?v=984'),250);
   }
   if(role==='captain'||role==='capitano'){
     message('Account capitano riconosciuto. Apertura portale…');
     return setTimeout(()=>location.replace('public.html?v=984&captain=1'),250);
   }
   message('Account non ancora collegato a un ruolo. Apertura recupero iscrizione…');
   return setTimeout(()=>location.replace('player-account.html?v=984'),350);
 }catch(err){
   moving=false;$('loader').classList.add('hidden');$('retry').classList.remove('hidden');
   message('Errore nel riconoscimento account: '+(err.message||String(err)),true);
 }
}
async function changeAccount(){
 try{if(s)await s.auth.signOut({scope:'local'})}catch(e){}
 location.replace('login.html?change=1&v=984');
}
window.init=init;window.changeAccount=changeAccount;init();
</script>
</body>
</html>
