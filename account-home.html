<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AICS Padel · Area account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%)}.card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}.logo{width:120px}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;margin:14px 0}.ok{background:#ebf8f0}.err{background:#fdecef}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.danger{background:var(--r);color:#fff}
</style></head><body><main class="card"><img class="logo" src="assets/aics-logo.png"><h1>AICS PADEL CHAMPIONSHIP</h1><div id="msg" class="notice">Riconoscimento account…</div><button class="btn danger" onclick="changeAccount()">Logout / Cambia account</button></main><div style="position:fixed;right:8px;bottom:8px;background:#082f68;color:#fff;padding:4px 7px;border-radius:999px;font:700 10px system-ui">V9.8.6 CAPTAIN FIX</div><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),m=document.getElementById('msg');
async function init(){try{const q=await s.auth.getSession();if(!q.data.session){location.replace('login.html?v=987');return}const p=await s.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle();if(p.error)throw p.error;const r=String(p.data?.role||'').toLowerCase();if(r==='admin')return location.replace('index.html?v=987');if(['captain','capitano','secretary','segretario'].includes(r))return location.replace('captain-home.html?v=987');if(['player','giocatore'].includes(r))return location.replace('player-home.html?v=987');const x=await s.rpc('get_my_captain_portal'),d=Array.isArray(x.data)?x.data[0]:x.data;if(!x.error&&d?.ok)return location.replace('captain-home.html?v=987');location.replace('public.html?v=987')}catch(e){m.textContent='Errore: '+(e.message||e);m.className='notice err'}}
async function changeAccount(){try{await s.auth.signOut({scope:'local'})}catch(e){}location.replace('login.html?change=1&v=987')}window.changeAccount=changeAccount;init();
</script></body></html>
