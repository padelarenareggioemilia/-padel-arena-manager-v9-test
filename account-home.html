<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8fc;font-family:system-ui;color:#0a2e5e}.card{width:min(580px,calc(100% - 28px));background:#fff;border:1px solid #b9cde3;border-radius:20px;padding:20px;text-align:center}.notice{padding:12px;background:#edf4fb;border-radius:12px}</style></head><body><main class="card"><img src="assets/aics-logo.png" style="width:110px"><h1>AICS PADEL CHAMPIONSHIP</h1><div id="msg" class="notice">Riconoscimento account…</div></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),m=document.getElementById('msg');
(async()=>{try{const q=await s.auth.getSession();if(!q.data.session){location.replace('login.html?v=991');return}const p=await s.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle();const r=String(p.data?.role||'').toLowerCase();if(r==='admin')return location.replace('index.html?v=991');if(['captain','capitano','secretary','segretario'].includes(r))return location.replace('captain-dashboard-v991.html');if(['player','giocatore'].includes(r))return location.replace('player-home.html?v=991');const x=await s.rpc('get_my_captain_portal'),d=Array.isArray(x.data)?x.data[0]:x.data;if(!x.error&&d?.ok)return location.replace('captain-dashboard-v991.html');location.replace('public.html?v=991')}catch(e){m.textContent='Errore: '+(e.message||e)}})();
</script></body></html>
