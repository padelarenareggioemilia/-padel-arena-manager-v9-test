<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div id="m">Riconoscimento account…</div><script>const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);(async()=>{const q=await s.auth.getSession();if(!q.data.session)return location.replace('login.html?v=993');const p=await s.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle(),r=String(p.data?.role||'').toLowerCase();if(r==='admin')return location.replace('index.html?v=993');if(['captain','capitano','secretary','segretario'].includes(r))return location.replace('captain-dashboard-v993.html');if(['player','giocatore'].includes(r))return location.replace('player-home.html?v=993');location.replace('public.html?v=993')})();</script></body></html>
