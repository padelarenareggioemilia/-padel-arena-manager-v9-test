<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS Padel · Il mio account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--g) 33%,#fff 33% 66%,var(--r) 66%)}
main{width:min(780px,calc(100% - 24px));margin:22px auto 80px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}
.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.hero img{width:100px;background:#fff;border-radius:12px;padding:6px}.choice{display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:12px;margin:9px 0}
.logo{width:70px;height:70px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}.muted{color:#627b97}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb}
@media(max-width:620px){.choice{grid-template-columns:64px 1fr}.choice .btn{grid-column:1/-1;width:100%}.logo{width:60px;height:60px}}
</style></head><body><main>
<section class="hero"><img src="assets/aics-logo.png"><h1>Il mio account</h1><div>Un solo accesso per tutti i tuoi ruoli</div></section>
<section class="card"><div id="status" class="notice">Caricamento delle tue modalità…</div></section>
<section id="content"></section>
<section class="card"><button class="btn danger" onclick="logout()">Logout / Cambia account</button></section>
</main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
async function start(){
 const sess=(await sb.auth.getSession()).data.session;if(!sess){location.replace('login.html?change=1');return}
 const p=await sb.from('profiles').select('role').eq('id',sess.user.id).maybeSingle();
 if(String(p.data?.role||'').toLowerCase()==='admin'){location.replace('index.html');return}
 const r=await sb.rpc('get_my_account_accesses');if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data;
 let h='';
 if(d.is_player){
   h+=`<section class="card"><h2>🎾 Modalità Giocatore</h2><p class="muted">Tessera, convocazioni, comunicazioni e dati personali.</p><button class="btn primary" onclick="location.href='player-home.html?v=9933'">Entra come Giocatore</button></section>`;
 }
 if((d.staff_teams||[]).length){
   h+=`<section class="card"><h2>🧭 Squadre che puoi gestire</h2><p class="muted">Scegli la squadra. Non serve uscire o cambiare account.</p>`;
   h+=(d.staff_teams||[]).map(t=>`<div class="choice"><img class="logo" src="${esc(t.logo_url||'assets/aics-logo.png')}"><div><b>${esc(t.team_name)}</b><div class="muted">${esc(t.series||'')} · ${t.role==='captain'?'Capitano':'Segretario'}</div></div><button class="btn secondary" onclick="openTeam('${t.team_id}')">Gestisci</button></div>`).join('');
   h+='</section>';
 }
 if(!h)h='<section class="card"><h2>Nessuna area collegata</h2><p>Questo account non risulta ancora associato a un giocatore, capitano o segretario.</p></section>';
 $('content').innerHTML=h;$('status').textContent='Account riconosciuto: '+(d.email||sess.user.email);
}
function openTeam(id){location.href='captain-home.html?team='+encodeURIComponent(id)+'&v=9933'}
async function logout(){await sb.auth.signOut({scope:'local'});location.replace('login.html?change=1')}
start().catch(e=>$('status').textContent='Errore: '+(e.message||e));
</script></body></html>
