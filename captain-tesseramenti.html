<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V9 · Capitano Tesseramenti</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--t:#0a2e5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--t)}
body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--g) 33%,#fff 33% 66%,var(--r) 66%)}
main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.btn{padding:11px 13px;border-radius:10px;border:0;font-weight:900;cursor:pointer}
.primary{background:var(--b);color:white}.success{background:var(--g);color:white}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}
.notice{padding:11px;border:1px solid var(--line);border-radius:11px;background:#edf4fb;margin:10px 0}.warn{background:#fff7dc}.ok{background:#eaf8f0}
.req{border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}.players{font-size:14px;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4fb;font-size:12px;font-weight:900}
input[type=file]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
@media(max-width:650px){.actions{display:grid}.btn{width:100%}}
</style></head>
<body><main>
<section class="card hero"><h1>Capitano · Tesseramenti</h1><b>MODALITÀ TEST — nessun invio ad AICS</b></section>
<section class="card"><button class="btn secondary" onclick="back()">← Area Capitano</button></section>
<section class="card"><div id="status" class="notice">Caricamento…</div></section>
<section id="work" class="hidden">
  <section class="card"><h2 id="teamName"></h2><div id="payment"></div></section>
  <section class="card"><h2>Richieste ricevute dall'Admin</h2><div id="requests"></div></section>
</section>
</main>
<script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=x=>document.getElementById(x);
const teamId=new URLSearchParams(location.search).get('team')||'';
let data=null;

function back(){location.href='captain-home.html'+(teamId?'?team='+encodeURIComponent(teamId)+'&v=9943':'?v=9943')}

async function start(){
 const s=(await sb.auth.getSession()).data.session;
 if(!s){location='login.html';return}
 if(!teamId)throw Error('Squadra non specificata. Entra dall’area account/capitano.');
 const p=await sb.rpc('get_my_captain_portal_for_team',{p_team_id:teamId});
 if(p.error)throw p.error;
 const r=await sb.rpc('captain_get_tesseramento_payment_requests',{p_team_id:teamId});
 if(r.error)throw r.error;
 data=r.data;render();
 $('status').textContent='Richieste caricate correttamente.';
 $('status').className='notice ok';$('work').classList.remove('hidden');
}

function render(){
 $('teamName').textContent=data.team.name;
 $('payment').innerHTML=`<div class="notice"><b>Pagamento in unica soluzione</b><br>Intestatario: ${data.settings.account_holder}<br>IBAN: <b>${data.settings.iban}</b><br>Quota: € ${Number(data.settings.fee_per_player).toFixed(2)} per giocatore</div>`;
 const qs=data.requests||[];
 $('requests').innerHTML=qs.map(q=>{
   const names=(q.players||[]).map(p=>`${p.first_name} ${p.last_name}`).join('<br>');
   const receipt=q.receipt_url?`<div class="notice ok">Ricevuta già caricata: <a href="${q.receipt_url}" target="_blank">${q.receipt_file_name||'Apri ricevuta'}</a><br>Ora è in attesa della verifica Admin.</div>`:'';
   const uploader=q.status==='payment_requested'?`<div class="notice warn"><b>Da pagare: € ${Number(q.amount).toFixed(2)}</b><br>Esegui un solo bonifico per l’intero importo e carica qui una sola ricevuta.</div><input id="f_${q.id}" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"><br><br><button class="btn success" onclick="uploadReceipt('${q.id}')">Carica ricevuta unica</button>`:'';
   return `<div class="req"><div><b>${q.request_number}</b> <span class="pill">${q.status}</span> ${q.test_mode?'<span class="pill">TEST</span>':''}</div><p><b>${(q.players||[]).length} giocatori · € ${Number(q.amount).toFixed(2)}</b></p><div class="players">${names}</div>${q.notes?`<div class="notice">Nota Admin: ${q.notes}</div>`:''}${uploader}${receipt}</div>`;
 }).join('')||'<div class="notice">Nessuna richiesta di pagamento ricevuta.</div>';
}

async function uploadReceipt(id){
 const input=$('f_'+id),file=input?.files?.[0];
 if(!file)return alert('Seleziona la ricevuta.');
 if(file.size>8*1024*1024)return alert('Il file non può superare 8 MB.');
 if(!confirm('Caricare questa ricevuta unica? In modalità TEST non verrà inviata ad AICS.'))return;
 const ext=(file.name.split('.').pop()||'pdf').toLowerCase();
 const path=`tesseramenti/${teamId}/${id}.${ext}`;
 const up=await sb.storage.from('team-documents').upload(path,file,{contentType:file.type,upsert:true});
 if(up.error)return alert('Errore caricamento: '+up.error.message);
 const url=sb.storage.from('team-documents').getPublicUrl(path).data.publicUrl;
 const r=await sb.rpc('captain_attach_admin_tesseramento_receipt',{p_request_id:id,p_receipt_url:url,p_storage_path:path,p_file_name:file.name});
 if(r.error)return alert(r.error.message);
 alert('Ricevuta caricata. Ora la richiesta è in attesa di verifica Admin.');
 await start();
}
window.uploadReceipt=uploadReceipt;window.back=back;
start().catch(e=>{$('status').textContent='Errore: '+e.message;$('status').className='notice'});
</script>
</body></html>
