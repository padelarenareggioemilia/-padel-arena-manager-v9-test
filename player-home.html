<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS Padel Championship · Area Giocatore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}.shell{width:min(1000px,calc(100% - 24px));margin:auto;padding:22px 0 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.notice,.message,.callup{padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0;background:#edf4fb}.message.mine{background:#eaf8f0}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary,.tab.active{background:var(--b);color:#fff}.secondary,.tab{background:#fff;color:var(--b);border:1px solid var(--b)}.success{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.hidden{display:none!important}textarea{width:100%;min-height:85px;padding:10px;border:1px solid var(--line);border-radius:10px}.muted{color:var(--muted)}
@media(max-width:700px){.actions,.tabs{display:grid}.btn,.tab{width:100%}}
</style></head>
<body><main class="shell">
<section class="hero"><h1>Area Giocatore</h1><div id="teamName"></div></section>
<section class="card"><div id="status" class="notice">Caricamento…</div></section>
<section id="app" class="hidden">
<section class="card"><div class="tabs"><button class="tab active" data-v="home" onclick="setView('home')">Profilo</button><button class="tab" data-v="messages" onclick="setView('messages')">Comunicazioni</button><button class="tab" data-v="callups" onclick="setView('callups')">Convocazioni</button></div></section>
<section class="card"><div id="content"></div></section>
<section class="card"><div class="actions"><button class="btn secondary" onclick="location.href='digital-card.html?v=9912'">Tessera digitale</button><button class="btn secondary" onclick="location.href='account-home.html?v=9912'">Menu account</button><button class="btn danger" onclick="logout()">Logout / Cambia account</button></div></section>
</section></main>
<script>
const c=window.PAM_V9_CONFIG,$=id=>document.getElementById(id);let s,portal,hub,view='home';const A=x=>Array.isArray(x)?x:[],E=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?String(v||''):d.toLocaleString('it-IT')}
function setView(v){view=v;render()}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));if(view==='messages')content.innerHTML=`<textarea id="newMessage" placeholder="Scrivi al capitano e alla squadra"></textarea><button class="btn primary" onclick="sendMessage()">Invia</button>${A(hub.messages).map(m=>`<div class="message ${m.sender_user_id===hub.current_user_id?'mine':''}"><b>${E(m.sender_name||m.sender_role)}</b><div class="muted">${E(date(m.created_at))}</div><div>${E(m.body)}</div></div>`).join('')||'<div class="notice">Nessun messaggio.</div>'}`;else if(view==='callups')content.innerHTML=A(hub.callups).map(c=>`<div class="callup"><b>${E(c.title||'Convocazione')}</b><div class="muted">${E(date(c.created_at))}</div><p>${E(c.message||'')}</p><div class="notice">Risposta attuale: <b>${E(c.response||'pending')}</b></div><div class="actions"><button class="btn success" onclick="respond('${c.id}','confirmed')">Confermo</button><button class="btn danger" onclick="respond('${c.id}','unavailable')">Non disponibile</button></div></div>`).join('')||'<div class="notice">Nessuna convocazione.</div>';else content.innerHTML=`<h2>${E(portal.player?.first_name||'')} ${E(portal.player?.last_name||'')}</h2><div class="notice"><b>Squadra:</b> ${E(portal.team?.name||'')}<br><b>Serie:</b> ${E(portal.team?.series||'')}<br><b>Classifica FITP:</b> ${E(portal.player?.fitp_ranking||'')}<br><b>Certificato medico:</b> ${E(portal.player?.medical_certificate_expiry||'')}</div>`}
async function sendMessage(){const body=$('newMessage').value.trim();if(!body)return;const r=await s.rpc('player_send_team_message',{p_body:body});if(r.error)return alert(r.error.message);await load();view='messages';render()}
async function respond(id,response){const note=response==='unavailable'?prompt('Motivo indisponibilità (facoltativo):','')||'':'';const r=await s.rpc('player_respond_callup',{p_callup_id:id,p_response:response,p_note:note});if(r.error)return alert(r.error.message);await load();view='callups';render()}
async function load(){try{if(!s)s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);const p=await s.rpc('get_my_player_portal');if(p.error)throw p.error;portal=Array.isArray(p.data)?p.data[0]:p.data;const h=await s.rpc('player_get_team_hub');if(h.error)throw h.error;hub=Array.isArray(h.data)?h.data[0]:h.data;teamName.textContent=portal.team?.name||'';status.textContent='Area giocatore aggiornata.';app.classList.remove('hidden');render()}catch(e){status.textContent='Errore: '+(e.message||e)}}
async function logout(){try{await s.auth.signOut({scope:'local'})}catch(e){}location.replace('login.html?change=1&v=998')}
Object.assign(window,{setView,sendMessage,respond,logout});load();
</script><div style="position:fixed;right:8px;bottom:8px;padding:5px 8px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui">V9.9.12 FIX TEST COMPLETO</div></body></html>
