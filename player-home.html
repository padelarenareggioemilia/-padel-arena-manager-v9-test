<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS Padel Championship · Area Giocatore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.333%,#fff 33.333% 66.666%,var(--r) 66.666%);z-index:50}
.shell{width:min(1050px,calc(100% - 24px));margin:auto;padding:22px 0 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 13px 30px rgba(8,47,104,.11)}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.aics{width:105px;height:68px;object-fit:contain;background:#fff;padding:7px;border-radius:14px}.team-logo{width:82px;height:82px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:15px;padding:5px}.photo{width:110px;height:140px;object-fit:cover;border-radius:15px;border:1px solid var(--line)}
.identity{display:grid;grid-template-columns:110px 1fr 82px 110px;gap:15px;align-items:center}.identity h2{margin:0;color:var(--bd)}.qr{width:108px;height:108px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb}.err{background:#fdecef;border-color:#dd7a85}.ok{background:#ebf8f0;border-color:#79bf90}.muted{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.kpi{padding:14px;border:1px solid var(--line);border-radius:15px;text-align:center}.kpi strong{display:block;font-size:25px;color:var(--b)}
.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.primary,.tab.active{background:var(--b);color:#fff}.secondary,.tab{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}.hidden{display:none!important}
.comp,.fixture{border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0}.fixture{display:grid;grid-template-columns:130px 1fr auto;gap:12px}.score{font-size:20px;font-weight:1000}.stage{padding:11px;border-radius:12px;background:#edf4fb;font-weight:900}
@media(max-width:760px){.identity{grid-template-columns:90px 1fr}.photo{width:90px;height:116px}.team-logo,.qr{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}.fixture{grid-template-columns:1fr}.tabs,.actions{display:grid}.btn,.tab{width:100%}}
</style></head>
<body><main class="shell">
<section class="hero"><img class="aics" src="assets/aics-logo.png"><div><h1 style="margin:0">Area Giocatore</h1><div id="heroSub">AICS Padel Championship</div></div></section>
<section class="card"><div id="status" class="notice">Caricamento dati…</div></section>
<section id="app" class="hidden">
<section class="card"><div class="identity">
<img id="playerPhoto" class="photo" alt="Foto tessera">
<div><h2 id="playerName">Giocatore</h2><div id="teamName" style="font-size:21px;font-weight:900;color:#164a95"></div><div id="teamMeta" class="muted"></div></div>
<img id="teamLogo" class="team-logo" alt="Logo squadra">
<div id="qrHome" class="qr"></div>
</div></section>
<section class="card"><h2>Riepilogo partite della mia squadra</h2><div class="kpis">
<div class="kpi"><strong id="played">0</strong>Giocate</div><div class="kpi"><strong id="wins">0</strong>Vinte</div><div class="kpi"><strong id="draws">0</strong>Pareggiate</div><div class="kpi"><strong id="losses">0</strong>Perse</div><div class="kpi"><strong id="upcoming">0</strong>Da giocare</div>
</div></section>
<section class="card"><div class="tabs"><button class="tab active" data-v="overview" onclick="setView('overview')">Situazione competizioni</button><button class="tab" data-v="calendar" onclick="setView('calendar')">Calendario completo</button><button class="tab" data-v="results" onclick="setView('results')">Risultati</button></div></section>
<section class="card"><div id="content"></div></section>
<section class="card"><div class="actions"><button class="btn primary" onclick="location.href='digital-card.html?v=986'">Tessera digitale</button><button class="btn secondary" onclick="location.href='public.html?v=986'">Portale pubblico</button><button class="btn danger" onclick="logout()">Logout / Cambia account</button></div></section>
</section></main>
<div style="position:fixed;right:8px;bottom:8px;padding:4px 7px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui;opacity:.75">V9.8.5 IDENTITY FIX</div>
<script>
const cfg=window.PAM_V9_CONFIG,$=id=>document.getElementById(id),sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
let data=null,view='overview';const arr=x=>Array.isArray(x)?x:[],esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function tn(id){const t=arr(data.teams).find(x=>x.id===id);return t?.name||t?.team_name||'Squadra'}
function wd(id){return arr(data.statuses).find(x=>x.fixture_id===id)?.workflow_data||{}}
function sc(f){const r=wd(f.id).result_data||wd(f.id).result||null;if(!r)return null;const h=Number(r.home_score??r.home_matches??r.home),a=Number(r.away_score??r.away_matches??r.away);return Number.isFinite(h)&&Number.isFinite(a)?{h,a}:null}
function done(f){return !!sc(f)}function myr(f){const s=sc(f);if(!s)return'future';const m=f.home_team_id===data.team_id?s.h:s.a,o=f.home_team_id===data.team_id?s.a:s.h;return m>o?'won':m<o?'lost':'draw'}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?'Data da definire':d.toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function comp(f){return f.competition_code||f.competition||'Competizione'}function stage(f){return f.stage_name||f.phase_name||f.round_name||(f.round_number?`Turno ${f.round_number}`:'Fase da definire')}
function fx(f){const s=sc(f);return `<div class="fixture"><div><b>${esc(date(f.scheduled_at))}</b><div class="muted">${esc(comp(f))} · ${esc(stage(f))}</div></div><div><b>${esc(tn(f.home_team_id))}</b><br><b>${esc(tn(f.away_team_id))}</b><div class="muted">${esc(f.venue||'Impianto da definire')}</div></div><div class="score">${s?`${s.h} – ${s.a}`:'Da giocare'}</div></div>`}
function stats(){let p=0,w=0,d=0,l=0,u=0;arr(data.fixtures).forEach(f=>{if(!done(f)){u++;return}p++;const r=myr(f);if(r==='won')w++;else if(r==='lost')l++;else d++});played.textContent=p;wins.textContent=w;draws.textContent=d;losses.textContent=l;upcoming.textContent=u}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===view));let fs=arr(data.fixtures).slice().sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));if(view==='results')fs=fs.filter(done).reverse();if(view!=='overview'){content.innerHTML=fs.length?fs.map(fx).join(''):'<div class="notice">Nessuna partita disponibile.</div>';return}
const codes=[...new Set(fs.map(comp))];content.innerHTML=codes.map(c=>{const a=fs.filter(f=>comp(f)===c),played=a.filter(done).length,next=a.find(f=>!done(f));return `<div class="comp"><h3>${esc(c)}</h3><div class="stage">${played}/${a.length} partite giocate</div>${next?`<p><b>Prossima:</b> ${esc(date(next.scheduled_at))} · ${esc(tn(next.home_team_id))} - ${esc(tn(next.away_team_id))}</p>`:'<p class="muted">Nessuna prossima partita programmata.</p>'}</div>`}).join('')}
function setView(v){view=v;render()}
async function init(){try{const q=await sb.auth.getSession();if(!q.data.session){location.replace('login.html?v=986');return}const p=await sb.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()==='admin'){location.replace('index.html?v=986');return}
const r=await sb.rpc('get_my_player_portal');if(r.error)throw r.error;data=Array.isArray(r.data)?r.data[0]:r.data;if(!data?.ok)throw new Error(data?.message||'Dati non disponibili');
const pl=data.player||{},t=data.team||{};playerName.textContent=[pl.first_name,pl.last_name].filter(Boolean).join(' ')||'Giocatore';teamName.textContent=t.name||t.team_name||'Squadra';teamMeta.textContent=[t.series,t.club_name,t.club_city].filter(Boolean).join(' · ');heroSub.textContent=teamName.textContent;
playerPhoto.src=pl.photo_url||pl.profile_photo_url||'';if(!playerPhoto.src)playerPhoto.style.display='none';teamLogo.src=t.logo_url||'';if(!teamLogo.src)teamLogo.style.display='none';
new QRCode(qrHome,{text:new URL(`digital-card.html?v=986`,location.href).href,width:96,height:96});
status.textContent='Profilo e squadra caricati correttamente.';status.className='notice ok';app.classList.remove('hidden');stats();render()}catch(e){status.textContent='Errore: '+(e.message||String(e));status.className='notice err'}}
async function logout(){try{await sb.auth.signOut({scope:'local'})}catch(e){}location.replace('login.html?change=1&v=986')}
window.setView=setView;window.logout=logout;init();
</script></body></html>
