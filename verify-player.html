<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifica tessera giocatore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>body{margin:0;background:#f3f7fb;font-family:system-ui;color:#092d5d;display:grid;place-items:center;min-height:100vh}.card{width:min(560px,calc(100% - 28px));background:#fff;border:1px solid #bfd0e2;border-radius:20px;padding:20px}.logos{display:flex;justify-content:space-between;gap:8px}.logos img{width:90px;height:58px;object-fit:contain}.photo{width:120px;height:145px;object-fit:cover;border-radius:14px;display:block;margin:15px auto}.row{display:flex;justify-content:space-between;border-bottom:1px solid #e0e8f0;padding:10px 0}.ok{color:#17683c}.bad{color:#9d2430}</style></head>
<body><main class="card"><div class="logos"><img src="assets/aics-logo.png"><img src="assets/padel-arena-manager.png" onerror="this.src='assets/aics-logo.png'"><img id="teamLogo"></div><div id="body">Verifica in corso…</div></main>
<script>
const cfg=window.PAM_V9_CONFIG,s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),token=new URLSearchParams(location.search).get('token');
(async()=>{
 const r=await s.rpc('verify_player_card',{p_token:token});
 if(r.error||!r.data){document.getElementById('body').innerHTML='<h2 class="bad">Tessera non valida</h2>';return}
 const d=r.data;document.getElementById('teamLogo').src=d.team_logo_url||'assets/aics-logo.png';
 document.getElementById('body').innerHTML=`${d.photo_url?`<img class="photo" src="${d.photo_url}">`:''}<h1 style="text-align:center">${d.first_name} ${d.last_name}</h1><div class="row"><span>Squadra</span><b>${d.team_name}</b></div><div class="row"><span>Competizione</span><b>${d.series||'—'}</b></div><div class="row"><span>Numero tessera</span><b>${d.card_number}</b></div><div class="row"><span>Certificato</span><b class="${d.medical_valid?'ok':'bad'}">${d.medical_valid?'VALIDO':'SCADUTO'}</b></div><div class="row"><span>Stato tessera</span><b class="${d.card_status==='active'?'ok':'bad'}">${d.card_status==='active'?'ATTIVA':'NON ATTIVA'}</b></div>`;
})();
</script></body></html>
