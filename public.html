<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS PADEL CHAMPIONSHIP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--blue:#164a95;--blue2:#082f68;--green:#009246;--red:#ce2b37;--bg:#f3f7fb;--panel:#fff;--soft:#eaf2fb;--text:#092d5d;--muted:#647c98;--line:#bfd0e2;--gold:#d9a72e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(90deg,rgba(0,146,70,.045),transparent 22%,transparent 78%,rgba(206,43,55,.045)),var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%);z-index:50}
.shell{max-width:1250px;margin:auto;padding:18px 13px 80px}.hero,.card{border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 32px rgba(8,47,104,.11)}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:15px}.logo{width:126px;height:76px;object-fit:contain;background:#fff;padding:7px;border-radius:15px}.hero h1{margin:0;font-size:clamp(24px,4vw,42px);letter-spacing:.03em}.hero p{margin:4px 0 0;color:#dce9f7}.card{background:#fff;padding:16px;margin:13px 0}
.nav,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;color:var(--blue2);border:1px solid var(--blue)}.tab{background:#edf4fb;color:var(--blue2);border:1px solid var(--line)}.tab.active{background:var(--blue);color:#fff}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#e6eff9;border:1px solid var(--line);font-size:12px;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.comp{padding:12px;border:1px solid var(--line);border-radius:17px;background:#fff;text-align:center;cursor:pointer;transition:.18s;min-height:150px}.comp:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(8,47,104,.13)}.comp.active{outline:3px solid var(--green);background:#f4fff8}.comp img{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 6px}.comp strong{font-size:18px;display:block;margin-top:5px}.tricolore{height:5px;border-radius:999px;background:linear-gradient(90deg,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%);border:1px solid #dbe5ef;margin:10px 0}
.fixture{display:grid;grid-template-columns:115px 1fr auto;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #dce6f0}.fixture:last-child{border-bottom:0}.score{font-size:19px;font-weight:1000;color:var(--blue2)}.round{font-weight:900}.status-live{background:#fff3cd;border-color:#e5c04d}.status-done{background:#e9f8ef;border-color:#67bd85}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:10px;border-bottom:1px solid #dde7f1;text-align:center}th{background:var(--blue);color:#fff;position:sticky;top:0}td:nth-child(2),th:nth-child(2){text-align:left}.leader td{font-weight:900;background:#fff9e7}
.group-title{margin:18px 0 8px;padding:10px 13px;border-left:5px solid var(--green);background:var(--soft);border-radius:0 12px 12px 0}
.notice{padding:12px;border-radius:13px;background:var(--soft);border:1px solid var(--line);margin:10px 0}.err{background:#fdecef;border-color:var(--red)}
@media(max-width:850px){.grid5{grid-template-columns:1fr 1fr}.hero{align-items:flex-start}.logo{width:98px;height:62px}.fixture{grid-template-columns:1fr}.fixture .score{text-align:left}}
</style>
</head>
<body>
<main class="shell">
<header class="hero">
  <div class="brand">
    <img class="logo" src="assets/aics-logo.png" alt="AICS">
    <div><h1>AICS PADEL CHAMPIONSHIP</h1><p>Seleziona la competizione che desideri consultare</p></div>
  </div>
  <button class="btn secondary" onclick="location.href='login.html'">Accedi al tuo account</button>
</header>
<div class="tricolore"></div>

<section class="card">
  <div class="notice">Clicca sullo stemma della competizione per aprire calendario, risultati e classifica dedicati.</div>
  <div class="grid5" id="competitionCards"></div>
</section>
<div id="errorBox" class="notice err hidden"></div>
</main><script>
const cfg=window.PAM_V9_CONFIG;
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const $=id=>document.getElementById(id);
const labels={SERIE_A:'Serie A',SERIE_B:'Serie B',SERIE_C:'Serie C',COPPA_ITALIA:'Coppa Italia',SUPERCOPPA:'Supercoppa'};
const logos={
  SERIE_A:'assets/aics-serie-a-2027.png',
  SERIE_B:'assets/aics-serie-b-2027.png',
  SERIE_C:'assets/aics-serie-c-2027.png',
  COPPA_ITALIA:'assets/aics-coppa-italia-2027.png',
  SUPERCOPPA:'assets/aics-supercoppa-2027.png'
};
async function init(){
  try{
    const r=await sb.from('public_championship_publication').select('*');
    const publication=r.error?[]:(r.data||[]);
    const isPublished=code=>{
      const row=publication.find(x=>x.competition_code===code);
      return row?row.is_published!==false:true;
    };
    const codes=['SERIE_A','SERIE_B','SERIE_C','COPPA_ITALIA','SUPERCOPPA'];
    $('competitionCards').innerHTML=codes.map(code=>`
      <button class="comp" ${isPublished(code)?`onclick="location.href='competition-public.html?code=${code}'"`:'disabled'}>
        <img src="${logos[code]}" alt="${labels[code]}">
        <strong>${labels[code]}</strong>
        <div class="muted small">${isPublished(code)?'Apri competizione':'Non pubblicata'}</div>
      </button>
    `).join('');
  }catch(e){
    $('errorBox').textContent=e.message||String(e);
    $('errorBox').classList.remove('hidden');
  }
}
init();
</script>
</body></html>
