<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164a95"><title>AICS · Attiva Area Segretario</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--soft:#edf4fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(90deg,rgba(0,146,70,.06),transparent 25%,transparent 75%,rgba(206,43,55,.06)),var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--g) 0 33.333%,#fff 33.333% 66.666%,var(--r) 66.666%)}main{width:min(620px,calc(100% - 24px));margin:24px auto 70px}.hero,.card{border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0;background:#fff;box-shadow:0 14px 34px rgba(8,47,104,.12)}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.field{margin:13px 0}label{display:block;font-weight:900;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit}.btn{width:100%;border-radius:11px;padding:13px;font:inherit;font-weight:900;cursor:pointer;margin:5px 0}.primary{border:0;background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);line-height:1.45}.ok{background:#eaf8f0;border-color:#77bd90}.err{background:#fdecef;border-color:#dd7a85}.hidden{display:none!important}.small{font-size:13px;color:#627b97}
</style></head><body><main><section class="hero"><h1 style="margin:0">Attiva Area Segretario</h1><div>AICS Padel Championship 2027</div></section><section class="card"><div id="status" class="notice">Verifica dell’invito…</div></section><section id="panel" class="card hidden"><h2 id="teamName"></h2><div class="field"><label>Email del segretario</label><input id="email" type="email" readonly></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" placeholder="Almeno 8 caratteri"></div><button id="createBtn" class="btn primary">Crea il mio account Segretario</button><button id="loginBtn" class="btn secondary">Ho già un account: accedi</button><p class="small">Il collegamento è personale e può essere utilizzato esclusivamente con l’email indicata dal capitano.</p></section></main><script>
const cfg=window.PAM_V9_CONFIG,$=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('invite')||'';let invite=null;
if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey)throw new Error('Configurazione mancante');const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
function show(t,err=false,ok=false){$('status').textContent=t;$('status').className='notice '+(err?'err':ok?'ok':'')}function busy(v){$('createBtn').disabled=v;$('loginBtn').disabled=v}
async function claim(){const r=await sb.rpc('secretary_claim_invite',{p_token:token});if(r.error)throw r.error;show('Account collegato. Apertura del portale…',false,true);setTimeout(()=>location.replace('captain-home.html?v=9931'),500)}
async function start(){if(!token)return show('Invito incompleto: codice mancante.',true);const r=await sb.rpc('secretary_invite_details',{p_token:token});if(r.error)throw r.error;invite=Array.isArray(r.data)?r.data[0]:r.data;if(!invite)return show('Invito non valido o già utilizzato.',true);$('teamName').textContent=invite.team_name||'Squadra';$('email').value=invite.email||'';$('panel').classList.remove('hidden');const s=(await sb.auth.getSession()).data.session;if(s&&String(s.user.email||'').toLowerCase()===String(invite.email||'').toLowerCase())await claim();else show('Invito verificato. Crea la password oppure accedi se possiedi già un account.',false,true)}
$('createBtn').onclick=async()=>{const p=$('password').value;if(p.length<8)return show('La password deve contenere almeno 8 caratteri.',true);busy(true);try{await sb.auth.signOut({scope:'local'});const redirect=new URL('secretary-activate.html',location.href);redirect.searchParams.set('invite',token);const r=await sb.auth.signUp({email:invite.email,password:p,options:{emailRedirectTo:redirect.href}});if(r.error)throw r.error;if(r.data.session)await claim();else show('Account creato. Conferma l’email ricevuta e poi riapri questo collegamento.',false,true)}catch(e){const m=e.message||String(e);show(/already registered/i.test(m)?'Questa email ha già un account. Usa “Ho già un account: accedi”.':m,true);busy(false)}};
$('loginBtn').onclick=async()=>{const p=$('password').value;if(!p)return show('Inserisci la password.',true);busy(true);try{await sb.auth.signOut({scope:'local'});const r=await sb.auth.signInWithPassword({email:invite.email,password:p});if(r.error)throw r.error;await claim()}catch(e){show(e.message||String(e),true);busy(false)}};start().catch(e=>show(e.message||String(e),true));
</script></body></html>
