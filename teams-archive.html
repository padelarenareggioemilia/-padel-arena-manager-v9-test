<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivio Squadre</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}main{max-width:1400px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
.table{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:9px;border-bottom:1px solid #dce6f0;text-align:left}th{background:var(--b);color:#fff}.logo{width:48px;height:48px;object-fit:contain;border-radius:9px;background:#fff;border:1px solid #ddd}.initials{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:1000}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{text-align:center;border:1px solid var(--line);border-radius:13px;padding:11px}.kpi strong{display:block;font-size:26px}
@media(max-width:700px){.filters,.kpis{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="actions"><button class="btn secondary" onclick="location.href='index.html'">← Home</button><button class="btn primary" onclick="location.href='index.html?new=1'">Nuova squadra</button></div>
<section class="card"><h1>Archivio completo squadre</h1><div class="kpis"><div class="kpi"><strong id="tot">0</strong>Totale</div><div class="kpi"><strong id="a">0</strong>Serie A</div><div class="kpi"><strong id="b">0</strong>Serie B</div><div class="kpi"><strong id="c">0</strong>Serie C</div></div></section>
<section class="card"><div class="filters"><input id="q" placeholder="Cerca squadra, club, città o capitano" oninput="render()"><select id="serie" onchange="render()"><option value="">Tutte le serie</option><option>Serie A</option><option>Serie B</option><option>Serie C</option><option value="NULL">Senza serie</option></select></div></section>
<section class="card"><div id="msg"></div><div class="table"><table><thead><tr><th>Logo</th><th>Squadra</th><th>Serie</th><th>Club</th><th>Città</th><th>Capitano</th><th>Giocatori</th><th>Azioni</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const cfg=window.PAM_V9_CONFIG,s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let teams=[],counts={};
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function render(){const term=$('q').value.toLowerCase(),ser=$('serie').value;const list=teams.filter(t=>(!ser||(ser==='NULL'?!t.series:t.series===ser))&&[t.name,t.club_name,t.club_city,t.captain_name].join(' ').toLowerCase().includes(term));$('rows').innerHTML=list.map(t=>`<tr><td>${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:`<span class="initials">${esc((t.name||'??').slice(0,2).toUpperCase())}</span>`}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.series||'—')}</td><td>${esc(t.club_name||'')}</td><td>${esc(t.club_city||'')}</td><td>${esc(t.captain_name||'—')}</td><td>${counts[t.id]||0}</td><td><div class="actions"><button class="btn primary" onclick="location.href='team.html?id=${t.id}'">Apri</button><button class="btn secondary" onclick="location.href='team.html?id=${t.id}&edit=1'">Modifica</button></div></td></tr>`).join('');}
async function init(){const se=await s.auth.getSession();if(!se.data.session)return location.href='login.html';const p=await s.from('profiles').select('role').eq('id',se.data.session.user.id).maybeSingle();if(p.data?.role!=='admin')return location.href='account-home.html';const [tr,rr]=await Promise.all([s.from('teams').select('*').order('series').order('name'),s.from('roster_requests').select('team_id')]);if(tr.error){$('msg').textContent=tr.error.message;return}teams=tr.data||[];(rr.data||[]).forEach(x=>counts[x.team_id]=(counts[x.team_id]||0)+1);$('tot').textContent=teams.length;$('a').textContent=teams.filter(x=>x.series==='Serie A').length;$('b').textContent=teams.filter(x=>x.series==='Serie B').length;$('c').textContent=teams.filter(x=>x.series==='Serie C').length;render()}init();
</script></body></html>
