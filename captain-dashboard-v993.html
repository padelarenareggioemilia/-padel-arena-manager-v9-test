<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS Padel Championship · Area Capitano</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--y:#d69a00;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.333%,#fff 33.333% 66.666%,var(--r) 66.666%);z-index:99}
.shell{width:min(1160px,calc(100% - 24px));margin:auto;padding:22px 0 75px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 13px 30px rgba(8,47,104,.1)}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.aics{width:105px;height:68px;object-fit:contain;background:#fff;padding:7px;border-radius:14px}
.identity{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}.team-logo{width:90px;height:90px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:15px}
.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;margin:10px 0}.ok{background:#eaf8f0}.err{background:#fdecef}.muted{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.kpi{padding:14px;border:1px solid var(--line);border-radius:15px;text-align:center}.kpi strong{display:block;font-size:24px;color:var(--b)}
.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:11px;padding:10px 12px;font:inherit;font-weight:900;cursor:pointer}.tab{background:#fff;color:var(--b);border:1px solid var(--b)}.tab.active,.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.success{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.warning{background:var(--y);color:#fff}.tiny{padding:7px 8px;font-size:12px}.hidden{display:none!important}
.player{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0}.photo{width:66px;height:85px;object-fit:cover;border-radius:11px;border:1px solid var(--line)}
.fixture{display:grid;grid-template-columns:90px 135px 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.comp-logo{width:84px;height:66px;object-fit:contain;border:1px solid var(--line);border-radius:10px}.team-mini{display:flex;align-items:center;gap:8px;margin:4px}.team-mini img{width:38px;height:38px;object-fit:contain;border:1px solid var(--line);border-radius:8px}
.field{margin:9px 0}label{display:block;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:90px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:100}.modal-card{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.lineup{display:grid;grid-template-columns:auto 1fr 150px;gap:10px;padding:9px;border-bottom:1px solid var(--line)}video{width:100%;background:#000;border-radius:12px}
.message{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.message.mine{background:#eaf2fb}.callup{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f1fb;font-size:11px;font-weight:900;margin:2px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.player,.fixture{grid-template-columns:1fr}.tabs,.actions{display:grid}.btn,.tab{width:100%}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><img class="aics" src="assets/aics-logo.png"><div><h1 style="margin:0">Area Capitano</h1><div id="heroSub">AICS Padel Championship</div></div></section>
<section class="card"><div id="status" class="notice">Caricamento…</div></section>

<section id="app" class="hidden">
<section class="card"><div class="identity"><img id="teamLogo" class="team-logo"><div><h2 id="teamName" style="margin:0"></h2><div id="teamMeta" class="muted"></div></div><button class="btn secondary" onclick="loadAll()">Aggiorna</button></div></section>
<section class="card"><div class="kpis"><div class="kpi"><strong id="playersN">0</strong>Giocatori</div><div class="kpi"><strong id="pendingN">0</strong>Da approvare</div><div class="kpi"><strong id="playedN">0</strong>Giocate</div><div class="kpi"><strong id="futureN">0</strong>Da giocare</div><div class="kpi"><strong id="lineupsN">0</strong>Distinte</div><div class="kpi"><strong id="secretariesN">0</strong>Segretari</div></div></section>
<section class="card"><div class="tabs">
<button class="tab active" data-v="players" onclick="setView('players')">Rosa</button>
<button class="tab" data-v="calendar" onclick="setView('calendar')">Calendario</button>
<button class="tab" data-v="lineups" onclick="setView('lineups')">Distinte e QR</button>
<button class="tab" data-v="secretaries" onclick="setView('secretaries')">Segretari</button>
<button class="tab" data-v="communications" onclick="setView('communications')">Comunicazioni</button>
<button class="tab" data-v="callups" onclick="setView('callups')">Convocazioni</button>
<button class="tab" data-v="management" onclick="setView('management')">Gestione</button>
</div></section>
<section class="card"><div id="content"></div></section>
<section class="card"><div class="actions"><button class="btn primary" onclick="copyPlayers()">Copia link giocatori</button><button class="btn danger" onclick="logout()">Logout / Cambia account</button></div></section>
</section>
</main>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="actions"><h2 id="modalTitle"></h2><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div id="modalBody"></div></div></div>


<script>
const cfg=window.PAM_V9_CONFIG,$=id=>document.getElementById(id);
let sb=null,data=null,hub=null,view='players',stream=null,timer=null;
const A=x=>Array.isArray(x)?x:[],E=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const labels={SERIE_A:'Serie A',SERIE_B:'Serie B',SERIE_C:'Serie C',COPPA_ITALIA:'Coppa Italia',SUPERCOPPA:'Supercoppa'};
const logos={SERIE_A:'assets/serie-a.png',SERIE_B:'assets/serie-b.png',SERIE_C:'assets/serie-c.png',COPPA_ITALIA:'assets/coppa-italia.png',SUPERCOPPA:'assets/supercoppa.png'};

function wf(id){return A(data.statuses).find(x=>x.fixture_id===id)?.workflow_data||{}}
function sc(f){const r=wf(f.id).result_data||wf(f.id).result;if(!r)return null;const h=Number(r.home_score??r.home_matches??r.home),a=Number(r.away_score??r.away_matches??r.away);return Number.isFinite(h)&&Number.isFinite(a)?{h,a}:null}
function team(id){return A(data.teams).find(x=>x.id===id)||{name:'Squadra'}}
function code(f){return f.competition_code||f.competition||'COMPETIZIONE'}
function date(v){if(!v)return'Da definire';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('it-IT')}
function fixture(f){const h=team(f.home_team_id),a=team(f.away_team_id),r=sc(f);return `<div class="fixture"><img class="comp-logo" src="${logos[code(f)]||'assets/aics-logo.png'}" onerror="this.src='assets/aics-logo.png'"><div><b>${labels[code(f)]||code(f)}</b><div class="muted">${E(f.stage_name||f.round_name||'Fase')}<br>${E(date(f.scheduled_at))}</div></div><div><div class="team-mini">${h.logo_url?`<img src="${E(h.logo_url)}">`:''}<b>${E(h.name)}</b></div><div class="team-mini">${a.logo_url?`<img src="${E(a.logo_url)}">`:''}<b>${E(a.name)}</b></div></div><b>${r?r.h+' – '+r.a:'Da giocare'}</b></div>`}
function player(p){return `<div class="player">${p.photo_url?`<img class="photo" src="${E(p.photo_url)}" alt="Foto giocatore">`:'<div class="photo"></div>'}<div><b>${E(p.first_name)} ${E(p.last_name)}</b><div class="muted">${E(p.email)} · ${E(p.fitp_ranking||'FITP non indicata')}</div><div class="muted">Certificato: ${E(p.medical_certificate_expiry||'non indicato')}</div><span class="badge">${E(p.status||'pending')}</span></div><div class="actions"><button class="btn secondary tiny" onclick="editPlayer('${p.id}')">Modifica FITP / certificato</button><button class="btn primary tiny" onclick="openCard('${p.id}')">Genera tessera digitale</button>${p.status==='pending'?`<button class="btn success tiny" onclick="statusPlayer('${p.id}','approved')">Approva</button><button class="btn danger tiny" onclick="statusPlayer('${p.id}','rejected')">Rifiuta</button>`:''}</div></div>`}

function render(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));
 if(view==='players')$('content').innerHTML=`<button class="btn primary" onclick="addPlayer()">Inserisci giocatore</button>${A(data.players).map(player).join('')||'<div class="notice">Nessun giocatore.</div>'}`;
 else if(view==='calendar')$('content').innerHTML=A(data.fixtures).map(fixture).join('')||'<div class="notice">Nessuna partita.</div>';
 else if(view==='lineups')$('content').innerHTML=A(data.fixtures).map(f=>`<div class="card">${fixture(f)}<div class="actions">${!sc(f)?`<button class="btn primary" onclick="openLineup('${f.id}')">Crea / modifica formazione</button><button class="btn secondary" onclick="openScan('${f.id}')">Scanner QR avversari</button>`:''}<button class="btn success" onclick="location.href='match-center.html?id=${encodeURIComponent(f.id)}&v=9904'">${sc(f)?'Apri referto e risultato':'Centro gara / Referto finale'}</button></div></div>`).join('')||'<div class="notice">Nessuna partita disponibile.</div>';
 else if(view==='secretaries')renderSecretaries();
 else if(view==='communications')renderCommunications();
 else if(view==='callups')renderCallups();
 else $('content').innerHTML=`<div class="field"><label>Note squadra</label><textarea id="notes">${E(data.team?.notes||'')}</textarea></div><button class="btn primary" onclick="saveNotes()">Salva note</button>`;
}
function setView(v){view=v;render()}
function openModal(t,h){$('modalTitle').textContent=t;$('modalBody').innerHTML=h;$('modal').classList.remove('hidden')}
function closeModal(){stopScan();$('modal').classList.add('hidden')}

function editPlayer(id){
 const p=A(data.players).find(x=>x.id===id);
 if(!p)return alert('Giocatore non trovato.');
 openModal('Modifica dati consentiti',`
  <div class="notice"><b>Dati anagrafici protetti.</b><br>Il capitano può modificare esclusivamente la classifica FITP e la data di scadenza del certificato medico.</div>
  <div class="field"><label>Classifica FITP</label><input id="er" value="${E(p.fitp_ranking||'')}"></div>
  <div class="field"><label>Scadenza certificato medico</label><input id="em" type="date" value="${E(p.medical_certificate_expiry||'')}"></div>
  <button class="btn primary" onclick="savePlayer('${id}')">Salva FITP e certificato</button>`);
}
async function savePlayer(id){
 const r=await sb.rpc('captain_update_player_sport_data',{
  p_team_id:data.team_id,
  p_player_id:id,
  p_fitp:$('er').value.trim(),
  p_medical_expiry:$('em').value||null
 });
 if(r.error)return alert(r.error.message);
 closeModal();
 await loadAll();
}

async function statusPlayer(id,status){const r=await sb.rpc('captain_set_player_status',{p_team_id:data.team_id,p_player_id:id,p_status:status});if(r.error)return alert(r.error.message);loadAll()}
function openCard(id){location.href=`captain-player-card.html?player=${encodeURIComponent(id)}&v=9905`}&v=998`}
function addPlayer(){alert('Per inserire un nuovo giocatore usa il link giocatori oppure la funzione amministratore.')}
function openLineup(fid){const l=A(data.lineups).find(x=>x.fixture_id===fid),sel=A(data.lineup_players).filter(x=>x.lineup_id===l?.id);openModal('Distinta e formazione',A(data.players).filter(p=>p.status==='approved').map(p=>{const x=sel.find(y=>y.player_id===p.id);return `<div class="lineup"><input type="checkbox" class="chk" data-id="${p.id}" ${x?'checked':''}><b>${E(p.first_name)} ${E(p.last_name)}</b><select class="pos" data-id="${p.id}"><option></option>${['M1','M2','Misto','Femminile','Riserva'].map(v=>`<option ${x?.position===v?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')+`<textarea id="lnote" placeholder="Note"></textarea><div class="actions"><button class="btn primary" onclick="saveLineup('${fid}',false)">Salva bozza</button><button class="btn success" onclick="saveLineup('${fid}',true)">Conferma distinta</button></div>`)}
async function saveLineup(fid,ok){const players=[...document.querySelectorAll('.chk:checked')].map(c=>({player_id:c.dataset.id,position:document.querySelector(`.pos[data-id="${c.dataset.id}"]`).value})),r=await sb.rpc('captain_save_lineup',{p_fixture_id:fid,p_team_id:data.team_id,p_players:players,p_notes:$('lnote').value,p_confirm:ok});if(r.error)return alert(r.error.message);closeModal();loadAll()}

function openScan(fid){const f=A(data.fixtures).find(x=>x.id===fid),opp=f.home_team_id===data.team_id?f.away_team_id:f.home_team_id;openModal('Scanner QR avversari',`<div class="notice">Squadra avversaria: <b>${E(team(opp).name)}</b></div><video id="vid" playsinline></video><canvas id="can" class="hidden"></canvas><div class="actions"><button class="btn primary" onclick="startScan('${fid}','${opp}')">Avvia fotocamera</button><button class="btn danger" onclick="stopScan()">Ferma</button></div><input id="manual" placeholder="Codice QR manuale"><button class="btn secondary" onclick="verifyQr('${fid}','${opp}',$('manual').value)">Conferma codice</button><div id="scanOut"></div>`)}
async function loadQr(){if(window.jsQR)return;await new Promise((res,rej)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';x.onload=res;x.onerror=()=>rej(new Error('Scanner non disponibile'));document.head.appendChild(x)})}
async function startScan(fid,opp){try{await loadQr();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('vid').srcObject=stream;await $('vid').play();const ctx=$('can').getContext('2d');timer=setInterval(()=>{if($('vid').readyState<2)return;$('can').width=$('vid').videoWidth;$('can').height=$('vid').videoHeight;ctx.drawImage($('vid'),0,0);const im=ctx.getImageData(0,0,$('can').width,$('can').height),q=jsQR(im.data,im.width,im.height);if(q){stopScan();verifyQr(fid,opp,q.data)}},500)}catch(e){alert(e.message)}}
function stopScan(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function pid(raw){const m=String(raw).match(/AICSPLAYER:([0-9a-f-]{36})/i);return m?m[1]:String(raw).trim()}
async function verifyQr(fid,opp,raw){const r=await sb.rpc('captain_verify_opponent_player',{p_fixture_id:fid,p_verifying_team_id:data.team_id,p_opponent_team_id:opp,p_player_id:pid(raw),p_qr_value:String(raw)});if(r.error)return alert(r.error.message);$('scanOut').innerHTML=`<div class="notice ok">Confermato: ${E(r.data?.player_name||'giocatore')}</div>`}

function renderSecretaries(){$('content').innerHTML=`<div class="notice">Puoi nominare fino a 3 segretari usando l’email di un account già registrato.</div><div class="field"><label>Email account</label><input id="secEmail" type="email"></div><button class="btn primary" onclick="appointSec()">Nomina segretario</button>${A(data.secretaries).map(x=>`<div class="card"><b>${E(x.email||x.user_id)}</b><button class="btn danger tiny" onclick="revokeSec('${x.user_id||x.id}')">Revoca</button></div>`).join('')||'<div class="notice">Nessun segretario.</div>'}`}
async function appointSec(){const r=await sb.rpc('captain_appoint_secretary_v2',{p_team_id:data.team_id,p_email:$('secEmail').value.trim().toLowerCase()});if(r.error)return alert(r.error.message);alert('Segretario nominato.');loadAll()}
async function revokeSec(id){const r=await sb.rpc('captain_revoke_secretary',{p_team_id:data.team_id,p_role_id:id});if(r.error)return alert(r.error.message);loadAll()}

function renderCommunications(){$('content').innerHTML=`<div class="field"><label>Nuovo messaggio alla squadra</label><textarea id="newMessage" placeholder="Scrivi un messaggio a giocatori e segretari"></textarea></div><button class="btn primary" onclick="sendMessage()">Invia messaggio</button><h3>Conversazione squadra</h3>${A(hub?.messages).map(m=>`<div class="message ${m.sender_user_id===hub.current_user_id?'mine':''}"><b>${E(m.sender_name||m.sender_role||'Utente')}</b><div class="muted">${E(date(m.created_at))}</div><div>${E(m.body)}</div></div>`).join('')||'<div class="notice">Nessun messaggio.</div>'}`}
async function sendMessage(){const body=$('newMessage').value.trim();if(!body)return;const r=await sb.rpc('captain_send_team_message',{p_team_id:data.team_id,p_body:body});if(r.error)return alert(r.error.message);await loadHub();renderCommunications()}

function renderCallups(){const future=A(data.fixtures).filter(f=>!sc(f));$('content').innerHTML=`<button class="btn primary" onclick="newCallup()">Crea convocazione</button><h3>Convocazioni inviate</h3>${A(hub?.callups).map(c=>`<div class="callup"><b>${E(c.title||'Convocazione')}</b><div class="muted">${E(date(c.created_at))}</div><p>${E(c.message||'')}</p><div>${A(c.players).map(p=>`<span class="badge">${E(p.player_name)}: ${E(p.response||'pending')}</span>`).join('')}</div></div>`).join('')||'<div class="notice">Nessuna convocazione.</div>'}`}
function newCallup(){const future=A(data.fixtures).filter(f=>!sc(f));openModal('Crea convocazione',`<div class="field"><label>Partita</label><select id="callFixture">${future.map(f=>`<option value="${f.id}">${E(date(f.scheduled_at))} · ${E(team(f.home_team_id).name)} - ${E(team(f.away_team_id).name)}</option>`).join('')}</select></div><div class="field"><label>Messaggio</label><textarea id="callMessage">Sei convocato per la prossima partita. Conferma la tua disponibilità.</textarea></div><div class="field"><label>Termine risposta</label><input id="callDeadline" type="datetime-local"></div><h3>Giocatori convocati</h3>${A(data.players).filter(p=>p.status==='approved').map(p=>`<label class="notice"><input type="checkbox" class="callPlayer" value="${p.id}" style="width:auto"> ${E(p.first_name)} ${E(p.last_name)}</label>`).join('')}<button class="btn success" onclick="saveCallup()">Invia convocazione</button>`)}
async function saveCallup(){const ids=[...document.querySelectorAll('.callPlayer:checked')].map(x=>x.value);if(!ids.length)return alert('Seleziona almeno un giocatore.');const r=await sb.rpc('captain_create_callup',{p_team_id:data.team_id,p_fixture_id:$('callFixture').value,p_player_ids:ids,p_message:$('callMessage').value.trim(),p_deadline:$('callDeadline').value||null});if(r.error)return alert(r.error.message);closeModal();await loadHub();renderCallups()}

async function saveNotes(){const r=await sb.rpc('captain_update_team_notes',{p_team_id:data.team_id,p_notes:$('notes').value});if(r.error)return alert(r.error.message);loadAll()}
async function copyPlayers(){const u=new URL(`player.html?invite=${encodeURIComponent(data.team.player_invite_token)}`,location.href).href;try{await navigator.clipboard.writeText(u);alert('Link copiato')}catch(e){prompt('Copia',u)}}
async function loadHub(){const r=await sb.rpc('captain_get_team_hub',{p_team_id:data.team_id});if(r.error)throw r.error;hub=Array.isArray(r.data)?r.data[0]:r.data}
async function loadAll(){try{if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey)throw new Error('Configurazione Supabase mancante.');if(!sb)sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const session=await sb.auth.getSession();if(!session.data.session){location.replace('login.html?change=1&v=998');return}const r=await sb.rpc('get_my_captain_portal');if(r.error)throw r.error;data=Array.isArray(r.data)?r.data[0]:r.data;if(!data?.ok)throw new Error(data?.message||'Squadra non collegata.');await loadHub();$('teamName').textContent=data.team.name;$('teamMeta').textContent=[data.team.series,data.team.club_name].filter(Boolean).join(' · ');$('heroSub').textContent=data.team.name;if(data.team.logo_url)$('teamLogo').src=data.team.logo_url;else $('teamLogo').style.display='none';$('playersN').textContent=A(data.players).filter(x=>x.status==='approved').length;$('pendingN').textContent=A(data.players).filter(x=>x.status==='pending').length;$('playedN').textContent=A(data.fixtures).filter(sc).length;$('futureN').textContent=A(data.fixtures).filter(x=>!sc(x)).length;$('lineupsN').textContent=A(data.lineups).length;$('secretariesN').textContent=A(data.secretaries).length;$('status').textContent='Accesso capitano attivo.';$('status').className='notice ok';$('app').classList.remove('hidden');render()}catch(e){$('status').textContent='Errore Area Capitano: '+(e.message||e);$('status').className='notice err'}}
async function logout(){try{await sb.auth.signOut({scope:'local'})}catch(e){}location.replace('login.html?change=1&v=998')}
Object.assign(window,{setView,closeModal,editPlayer,savePlayer,statusPlayer,openCard,addPlayer,openLineup,saveLineup,openScan,startScan,stopScan,verifyQr,appointSec,revokeSec,sendMessage,newCallup,saveCallup,saveNotes,copyPlayers,loadAll,logout});
loadAll();
</script>

<div style="position:fixed;right:8px;bottom:8px;z-index:9999;padding:5px 8px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui;opacity:.84">V9.9.5 ROSA PROTETTA</div>
</body>
</html>
