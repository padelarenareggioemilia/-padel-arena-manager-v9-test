<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Area Capitano</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--y:#d69a00;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%)}.shell{width:min(1150px,calc(100% - 24px));margin:auto;padding:22px 0 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff;display:flex;gap:14px;align-items:center}.aics{width:105px;height:68px;object-fit:contain;background:#fff;padding:7px;border-radius:14px}.identity{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}.team-logo{width:90px;height:90px;object-fit:contain;border:1px solid var(--line);border-radius:15px;background:#fff}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb}.ok{background:#eaf8f0}.err{background:#fdecef}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.kpi{padding:14px;border:1px solid var(--line);border-radius:15px;text-align:center}.kpi strong{display:block;font-size:24px;color:var(--b)}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:11px;padding:10px 12px;font-weight:900;cursor:pointer}.tab{background:#fff;color:var(--b);border:1px solid var(--b)}.tab.active,.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.success{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.warning{background:var(--y);color:#fff}.tiny{padding:7px 8px;font-size:12px}.hidden{display:none!important}.player{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0}.photo{width:66px;height:85px;object-fit:cover;border-radius:11px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f1fb;font-size:11px;font-weight:900;margin:2px}.fixture{display:grid;grid-template-columns:90px 135px 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.comp-logo{width:84px;height:66px;object-fit:contain;border:1px solid var(--line);border-radius:10px}.team-mini{display:flex;align-items:center;gap:8px;margin:4px}.team-mini img{width:38px;height:38px;object-fit:contain;border:1px solid var(--line);border-radius:8px}.field{margin:9px 0}label{display:block;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:100}.modal-card{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.lineup{display:grid;grid-template-columns:auto 1fr 150px;gap:10px;padding:9px;border-bottom:1px solid var(--line)}video{width:100%;background:#000;border-radius:12px}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.player,.fixture{grid-template-columns:1fr}.tabs,.actions{display:grid}.btn,.tab{width:100%}.grid2{grid-template-columns:1fr}}</style></head><body>
<main class="shell"><section class="hero"><img class="aics" src="assets/aics-logo.png"><div><h1 style="margin:0">Area Capitano</h1><div id="heroSub">AICS Padel Championship</div></div></section><section class="card"><div id="status" class="notice">Caricamento…</div></section><section id="app" class="hidden"><section class="card"><div class="identity"><img id="teamLogo" class="team-logo"><div><h2 id="teamName"></h2><div id="teamMeta" class="muted"></div></div><button class="btn secondary" onclick="loadAll()">Aggiorna</button></div></section><section class="card"><div class="kpis"><div class="kpi"><strong id="playersN">0</strong>Giocatori</div><div class="kpi"><strong id="pendingN">0</strong>Da approvare</div><div class="kpi"><strong id="playedN">0</strong>Giocate</div><div class="kpi"><strong id="futureN">0</strong>Da giocare</div><div class="kpi"><strong id="lineupsN">0</strong>Distinte</div><div class="kpi"><strong id="secretariesN">0</strong>Segretari</div></div></section><section class="card"><div class="tabs"><button class="tab active" data-v="players" onclick="setView('players')">Rosa</button><button class="tab" data-v="calendar" onclick="setView('calendar')">Calendario</button><button class="tab" data-v="lineups" onclick="setView('lineups')">Distinte e QR</button><button class="tab" data-v="secretaries" onclick="setView('secretaries')">Segretari</button><button class="tab" data-v="management" onclick="setView('management')">Gestione</button></div></section><section class="card"><div id="content"></div></section><section class="card"><div class="actions"><button class="btn primary" onclick="copyPlayers()">Copia link giocatori</button><button class="btn secondary" onclick="location.href='captain-matches-v993.html'">Partite complete</button><button class="btn danger" onclick="logout()">Logout</button></div></section></section></main>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="actions"><h2 id="modalTitle"></h2><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div id="modalBody"></div></div></div><div style="position:fixed;right:8px;bottom:8px;background:#082f68;color:#fff;padding:4px 7px;border-radius:999px;font:700 10px system-ui">V9.8.8.1 GITHUB STABLE</div>
<script>
const c=window.PAM_V9_CONFIG,$=id=>document.getElementById(id);
window.addEventListener('error',event=>{
  const box=$('status');
  if(box){box.textContent='Errore JavaScript: '+(event.message||'errore sconosciuto');box.className='notice err';}
});
window.addEventListener('unhandledrejection',event=>{
  const box=$('status');
  const reason=event.reason?.message||String(event.reason||'errore sconosciuto');
  if(box){box.textContent='Errore applicazione: '+reason;box.className='notice err';}
});let s,data,view='players',stream,timer;const A=x=>Array.isArray(x)?x:[],E=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const labels={SERIE_A:'Serie A',SERIE_B:'Serie B',SERIE_C:'Serie C',COPPA_ITALIA:'Coppa Italia',SUPERCOPPA:'Supercoppa'},logos={SERIE_A:'assets/serie-a.png',SERIE_B:'assets/serie-b.png',SERIE_C:'assets/serie-c.png',COPPA_ITALIA:'assets/coppa-italia.png',SUPERCOPPA:'assets/supercoppa.png'};
function wf(id){return A(data.statuses).find(x=>x.fixture_id===id)?.workflow_data||{}}function sc(f){const r=wf(f.id).result_data||wf(f.id).result;if(!r)return null;const h=Number(r.home_score??r.home_matches??r.home),a=Number(r.away_score??r.away_matches??r.away);return Number.isFinite(h)&&Number.isFinite(a)?{h,a}:null}function team(id){return A(data.teams).find(x=>x.id===id)||{name:'Squadra'}}function code(f){return f.competition_code||f.competition||'COMPETIZIONE'}function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?'Da definire':d.toLocaleString('it-IT')}function fixture(f){const h=team(f.home_team_id),a=team(f.away_team_id),r=sc(f);return `<div class="fixture"><img class="comp-logo" src="${logos[code(f)]||'assets/aics-logo.png'}" onerror="this.src='assets/aics-logo.png'"><div><b>${labels[code(f)]||code(f)}</b><div class="muted">${E(f.stage_name||f.round_name||'Fase')}<br>${E(date(f.scheduled_at))}</div></div><div><div class="team-mini">${h.logo_url?`<img src="${E(h.logo_url)}">`:''}<b>${E(h.name)}</b></div><div class="team-mini">${a.logo_url?`<img src="${E(a.logo_url)}">`:''}<b>${E(a.name)}</b></div></div><b>${r?r.h+' – '+r.a:'Da giocare'}</b></div>`}
function player(p){return `<div class="player">${p.photo_url?`<img class="photo" src="${E(p.photo_url)}">`:''}<div><b>${E(p.first_name)} ${E(p.last_name)}</b><div class="muted">${E(p.email)} · ${E(p.fitp_ranking||'')}</div><span class="badge">${E(p.status||'pending')}</span></div><div class="actions"><button class="btn secondary tiny" onclick="editPlayer('${p.id}')">Modifica</button><button class="btn primary tiny" onclick="location.href='captain-player-card-v993.html?player=${p.id}'">Genera tessera</button>${p.status==='pending'?`<button class="btn warning tiny" onclick="editPlayer('${p.id}')">Modifica richiesta</button><button class="btn success tiny" onclick="statusPlayer('${p.id}','approved')">Accetta</button><button class="btn danger tiny" onclick="statusPlayer('${p.id}','rejected')">Rifiuta</button>`:''}</div></div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));if(view==='players')$('content').innerHTML=`<button class="btn primary" onclick="addPlayer()">Inserisci giocatore</button>${A(data.players).map(player).join('')||'<div class="notice">Nessun giocatore.</div>'}`;else if(view==='calendar')$('content').innerHTML=A(data.fixtures).map(fixture).join('')||'<div class="notice">Nessuna partita.</div>';else if(view==='lineups')$('content').innerHTML=A(data.fixtures).filter(f=>!sc(f)).map(f=>`<div class="card">${fixture(f)}<div class="actions"><button class="btn primary" onclick="openLineup('${f.id}')">Distinta / Formazione</button><button class="btn secondary" onclick="openScan('${f.id}')">Scanner QR avversari</button></div></div>`).join('')||'<div class="notice">Nessuna gara futura.</div>';else if(view==='secretaries')$('content').innerHTML=`<div class="field"><label>Email account</label><input id="secEmail"></div><button class="btn primary" onclick="appointSec()">Nomina segretario</button>${A(data.secretaries).map(x=>`<div class="card"><b>${E(x.email||x.user_id)}</b><button class="btn danger tiny" onclick="revokeSec('${x.user_id||x.id}')">Revoca</button></div>`).join('')}`;else $('content').innerHTML=`<div class="field"><label>Note squadra</label><textarea id="notes">${E(data.team?.notes||'')}</textarea></div><button class="btn primary" onclick="saveNotes()">Salva note</button>`}
function setView(v){view=v;render()}function openModal(t,h){$('modalTitle').textContent=t;$('modalBody').innerHTML=h;$('modal').classList.remove('hidden')}function closeModal(){stopScan();$('modal').classList.add('hidden')}
function editPlayer(id){const p=A(data.players).find(x=>x.id===id);openModal('Modifica giocatore',`<div class="grid2"><div class="field"><label>Nome</label><input id="ef" value="${E(p.first_name)}"></div><div class="field"><label>Cognome</label><input id="el" value="${E(p.last_name)}"></div><div class="field"><label>Email</label><input id="ee" value="${E(p.email)}"></div><div class="field"><label>Telefono</label><input id="ep" value="${E(p.phone)}"></div><div class="field"><label>FITP</label><input id="er" value="${E(p.fitp_ranking)}"></div><div class="field"><label>Scadenza certificato</label><input id="em" type="date" value="${E(p.medical_certificate_expiry)}"></div></div><button class="btn primary" onclick="savePlayer('${id}')">Salva</button>`)}async function savePlayer(id){const p={first_name:$('ef').value,last_name:$('el').value,email:$('ee').value,phone:$('ep').value,fitp_ranking:$('er').value,medical_certificate_expiry:$('em').value},r=await s.rpc('captain_update_player_complete',{p_team_id:data.team_id,p_player_id:id,p_player:p});if(r.error)return alert(r.error.message);closeModal();loadAll()}async function statusPlayer(id,status){const r=await s.rpc('captain_set_player_status',{p_team_id:data.team_id,p_player_id:id,p_status:status});if(r.error)return alert(r.error.message);loadAll()}
function addPlayer(){openModal('Inserisci giocatore',`<div class="grid2"><input id="nf" placeholder="Nome"><input id="nl" placeholder="Cognome"><input id="ne" placeholder="Email"><input id="np" placeholder="Telefono"><input id="nbd" type="date"><input id="nbp" placeholder="Luogo nascita"><input id="nr" placeholder="FITP"><input id="nm" type="date"></div><button class="btn success" onclick="saveNew()">Inserisci</button>`)}async function saveNew(){const p={first_name:$('nf').value,last_name:$('nl').value,email:$('ne').value,phone:$('np').value,birth_date:$('nbd').value,birth_place:$('nbp').value,fitp_ranking:$('nr').value,medical_certificate_expiry:$('nm').value},r=await s.rpc('captain_add_player_basic',{p_team_id:data.team_id,p_player:p});if(r.error)return alert(r.error.message);closeModal();loadAll()}
function openLineup(fid){const l=A(data.lineups).find(x=>x.fixture_id===fid),sel=A(data.lineup_players).filter(x=>x.lineup_id===l?.id);openModal('Distinta e formazione',A(data.players).filter(p=>p.status==='approved').map(p=>{const x=sel.find(y=>y.player_id===p.id);return `<div class="lineup"><input type="checkbox" class="chk" data-id="${p.id}" ${x?'checked':''}><b>${E(p.first_name)} ${E(p.last_name)}</b><select class="pos" data-id="${p.id}"><option></option>${['M1','M2','Misto','Femminile','Riserva'].map(v=>`<option ${x?.position===v?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')+`<textarea id="lnote" placeholder="Note"></textarea><div class="actions"><button class="btn primary" onclick="saveLineup('${fid}',false)">Salva bozza</button><button class="btn success" onclick="saveLineup('${fid}',true)">Conferma distinta</button></div>`)}async function saveLineup(fid,ok){const players=[...document.querySelectorAll('.chk:checked')].map(c=>({player_id:c.dataset.id,position:document.querySelector(`.pos[data-id="${c.dataset.id}"]`).value})),r=await s.rpc('captain_save_lineup',{p_fixture_id:fid,p_team_id:data.team_id,p_players:players,p_notes:$('lnote').value,p_confirm:ok});if(r.error)return alert(r.error.message);closeModal();loadAll()}
function openScan(fid){const f=A(data.fixtures).find(x=>x.id===fid),opp=f.home_team_id===data.team_id?f.away_team_id:f.home_team_id;openModal('Scanner QR avversari',`<div class="notice">Squadra avversaria: <b>${E(team(opp).name)}</b></div><video id="vid" playsinline></video><canvas id="can" class="hidden"></canvas><div class="actions"><button class="btn primary" onclick="startScan('${fid}','${opp}')">Avvia fotocamera</button><button class="btn danger" onclick="stopScan()">Ferma</button></div><input id="manual" placeholder="Codice QR manuale"><button class="btn secondary" onclick="verifyQr('${fid}','${opp}',$('manual').value)">Conferma codice</button><div id="scanOut"></div>`)}
async function loadQr(){if(window.jsQR)return;await new Promise((res,rej)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';x.onload=res;x.onerror=()=>rej(new Error('Scanner non disponibile'));document.head.appendChild(x)})}async function startScan(fid,opp){try{await loadQr();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('vid').srcObject=stream;await $('vid').play();const ctx=$('can').getContext('2d');timer=setInterval(()=>{if($('vid').readyState<2)return;$('can').width=$('vid').videoWidth;$('can').height=$('vid').videoHeight;ctx.drawImage($('vid'),0,0);const im=ctx.getImageData(0,0,$('can').width,$('can').height),q=jsQR(im.data,im.width,im.height);if(q){stopScan();verifyQr(fid,opp,q.data)}},500)}catch(e){alert(e.message)}}function stopScan(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}function pid(raw){const m=String(raw).match(/AICSPLAYER:([0-9a-f-]{36})/i);return m?m[1]:String(raw).trim()}async function verifyQr(fid,opp,raw){const r=await s.rpc('captain_verify_opponent_player',{p_fixture_id:fid,p_verifying_team_id:data.team_id,p_opponent_team_id:opp,p_player_id:pid(raw),p_qr_value:String(raw)});if(r.error)return alert(r.error.message);$('scanOut').innerHTML=`<div class="notice ok">Confermato: ${E(r.data?.player_name||'giocatore')}</div>`}
async function appointSec(){const r=await s.rpc('captain_appoint_secretary',{p_team_id:data.team_id,p_email:$('secEmail').value});if(r.error)return alert(r.error.message);loadAll()}async function revokeSec(id){const r=await s.rpc('captain_revoke_secretary',{p_team_id:data.team_id,p_role_id:id});if(r.error)return alert(r.error.message);loadAll()}async function saveNotes(){const r=await s.rpc('captain_update_team_notes',{p_team_id:data.team_id,p_notes:$('notes').value});if(r.error)return alert(r.error.message);loadAll()}async function copyPlayers(){const u=new URL(`player.html?invite=${encodeURIComponent(data.team.player_invite_token)}`,location.href).href;try{await navigator.clipboard.writeText(u);alert('Link copiato')}catch(e){prompt('Copia',u)}}
async function loadAll(){try{
if(!c?.supabaseUrl||!c?.supabasePublishableKey)throw new Error('Configurazione Supabase non disponibile.');
if(!s)s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);
const session=await s.auth.getSession();
if(session.error)throw session.error;
if(!session.data.session){location.replace('login.html?change=1&v=996');return;}
const r=await s.rpc('get_my_captain_portal');if(r.error)throw r.error;data=Array.isArray(r.data)?r.data[0]:r.data;if(!data?.ok)throw new Error(data?.message);$('teamName').textContent=data.team.name;$('teamMeta').textContent=[data.team.series,data.team.club_name].filter(Boolean).join(' · ');$('heroSub').textContent=data.team.name;if(data.team.logo_url)$('teamLogo').src=data.team.logo_url;$('playersN').textContent=A(data.players).filter(x=>x.status==='approved').length;$('pendingN').textContent=A(data.players).filter(x=>x.status==='pending').length;$('playedN').textContent=A(data.fixtures).filter(sc).length;$('futureN').textContent=A(data.fixtures).filter(x=>!sc(x)).length;$('lineupsN').textContent=A(data.lineups).length;$('secretariesN').textContent=A(data.secretaries).length;$('status').textContent='Accesso capitano attivo.';$('status').className='notice ok';$('app').classList.remove('hidden');render()}catch(e){$('status').textContent='Errore Area Capitano: '+(e.message||e);$('status').className='notice err'}}
async function logout(){try{await s.auth.signOut({scope:'local'})}catch(e){}location.replace('login.html?change=1&v=996')}Object.assign(window,{setView,closeModal,editPlayer,savePlayer,statusPlayer,addPlayer,saveNew,openLineup,saveLineup,openScan,startScan,stopScan,verifyQr,appointSec,revokeSec,saveNotes,copyPlayers,loadAll,logout});loadAll();
</script></body></html>
