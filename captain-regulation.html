<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164a95"><title>Assistente Regolamento</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#009246 33%,#fff 33% 66%,#ce2b37 66%)}.shell{width:min(850px,calc(100% - 20px));margin:auto;padding:20px 0 100px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.notice,.answer{padding:13px;border:1px solid var(--line);border-radius:13px;background:#edf4fb;margin:10px 0;line-height:1.5}.answer{background:#eaf8f0;border-color:#77bd90}.pending{background:#fff7dc;border-color:#dfbf68}.err{background:#fdecef;border-color:#dd7a85}.field{margin:12px 0}label{display:block;font-weight:900;margin-bottom:6px}textarea{width:100%;min-height:125px;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.btn:disabled{opacity:.55}.ref{display:inline-block;padding:5px 8px;margin:3px;border-radius:999px;background:#fff;border:1px solid #77bd90;font-size:12px;font-weight:900}.muted{color:var(--muted)}@media(max-width:650px){.actions{display:grid}.btn{width:100%}}
</style></head><body><main class="shell"><section class="hero"><h1 style="margin:0">Assistente Regolamento</h1><p>Fai una domanda sull’AICS Padel Championship 2027.</p></section><section class="card"><div class="notice"><b>Risposte basate soltanto sul regolamento ufficiale.</b><br>Se la risposta non è espressamente prevista, la domanda sarà inoltrata automaticamente all’amministratore.</div><div class="field"><label for="question">La tua domanda</label><textarea id="question" maxlength="1500" placeholder="Esempio: entro quanto tempo devo inserire la formazione?"></textarea></div><div class="actions"><button id="ask" class="btn primary" onclick="askRule()">Chiedi al regolamento</button><button class="btn secondary" onclick="location.href='captain-home.html?v=9916'">Torna all’Area Capitano</button></div><div id="result"></div></section><section class="card"><h2>Le mie richieste</h2><div id="history" class="notice">Caricamento…</div></section></main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
async function guard(){const q=await sb.auth.getSession();if(!q.data.session)location.replace('login.html');else loadHistory()}
async function askRule(){const text=$('question').value.trim();if(text.length<8){$('result').innerHTML='<div class="notice err">Scrivi una domanda più completa.</div>';return}$('ask').disabled=true;$('result').innerHTML='<div class="notice">Sto consultando il regolamento ufficiale…</div>';try{const {data,error}=await sb.functions.invoke('regulation-assistant',{body:{question:text}});if(error)throw error;if(data.status==='answered')$('result').innerHTML=`<div class="answer"><b>Risposta dal regolamento</b><p>${esc(data.answer)}</p><div>${(data.article_refs||[]).map(x=>`<span class="ref">${esc(x)}</span>`).join('')}</div></div>`;else $('result').innerHTML='<div class="notice pending"><b>Richiesta inviata all’amministratore.</b><br>La risposta non è presente in modo sufficientemente chiaro nel regolamento. Esamineremo la richiesta e risponderemo al più presto.</div>';$('question').value='';await loadHistory()}catch(e){$('result').innerHTML=`<div class="notice err">Impossibile interrogare il regolamento: ${esc(e.message||e)}</div>`}finally{$('ask').disabled=false}}
async function loadHistory(){const {data,error}=await sb.from('regulation_questions').select('id,question,status,automatic_answer,admin_answer,article_refs,created_at,answered_at').order('created_at',{ascending:false}).limit(30);if(error){$('history').textContent='Archivio non disponibile: '+error.message;return}$('history').innerHTML=(data||[]).map(x=>`<div class="notice ${x.status==='pending_admin'?'pending':x.status==='answered'||x.status==='closed'?'answer':''}"><b>${esc(x.question)}</b><div class="muted">${new Date(x.created_at).toLocaleString('it-IT')} · ${x.status==='pending_admin'?'In esame':x.status==='closed'?'Risposta amministratore':'Risposta automatica'}</div>${x.admin_answer?`<p><b>Risposta ufficiale:</b> ${esc(x.admin_answer)}</p>`:x.automatic_answer?`<p>${esc(x.automatic_answer)}</p>`:''}</div>`).join('')||'Nessuna richiesta precedente.'}
guard();
</script><div style="margin:12px auto;width:max-content;padding:5px 8px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui">V9.9.16 ASSISTENTE REGOLAMENTO</div></body></html>
