<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distinte Admin · AICS Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--txt:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--txt)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%);z-index:9}.shell{max-width:1050px;margin:auto;padding:22px 14px 80px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.success{background:var(--g);color:#fff}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;margin:9px 0}.muted{color:var(--muted)}.hidden{display:none!important}.player{display:grid;grid-template-columns:1fr 180px 180px;gap:9px;align-items:center;padding:10px;border-bottom:1px solid #dce7f2}.field{margin:10px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:5px}select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:90px}@media(max-width:700px){.player{grid-template-columns:1fr}.actions .btn{flex:1}}
</style></head><body><main class="shell"><div class="actions"><button class="btn secondary" onclick="location.href='admin-control.html?v=9985'">← Controllo Admin</button><button class="btn secondary" id="resultBtn">Inserisci risultato</button></div><header class="hero"><h1 style="margin:0">Compilazione distinte · Admin</h1><div>Intervento di emergenza sulle distinte ufficiali di entrambe le squadre.</div></header><section id="status" class="card">Caricamento…</section><section id="app" class="card hidden"><h2 id="matchTitle"></h2><div id="meta" class="notice"></div><div class="field"><label>Squadra da gestire</label><select id="team" onchange="render()"></select></div><div id="players"></div><div class="field"><label>Note distinta</label><textarea id="notes"></textarea></div><div class="actions"><button class="btn secondary" onclick="save(false)">Salva bozza</button><button class="btn success" onclick="save(true)">Conferma distinta</button></div></section></main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),fixtureId=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let fixture,teams=[],roster=[],lineups=[],entries=[];
const roleOptions=v=>['','M1','M2','Misto','Femminile','Riserva'].map(x=>`<option value="${x}" ${x===v?'selected':''}>${x||'—'}</option>`).join('');
function render(){const tid=$('team').value,lu=lineups.find(x=>x.team_id===tid),saved=entries.filter(x=>x.lineup_id===lu?.id);$('notes').value=lu?.notes||'';$('players').innerHTML=roster.filter(x=>x.team_id===tid&&String(x.status).toLowerCase()==='approved').map(p=>{const rr=saved.filter(x=>x.player_id===p.id).map(x=>x.position);return `<div class="player" data-player="${p.id}"><div><b>${esc(p.first_name)} ${esc(p.last_name)}</b><div class="muted">${esc(p.fitp_ranking||'NC')}</div></div><div><label>1° incontro</label><select class="r1">${roleOptions(rr[0])}</select></div><div><label>2° incontro</label><select class="r2">${roleOptions(rr[1])}</select></div></div>`}).join('')||'<div class="notice">Nessun giocatore approvato nella rosa.</div>'}
async function save(confirmLineup){const ps=[];for(const row of document.querySelectorAll('.player')){const roles=[row.querySelector('.r1').value,row.querySelector('.r2').value].filter(Boolean);if(roles.length===2&&roles[0]===roles[1])return alert('Lo stesso giocatore non può avere due volte lo stesso incontro.');roles.forEach(position=>ps.push({player_id:row.dataset.player,position}))}const r=await sb.rpc('captain_save_lineup',{p_fixture_id:fixtureId,p_team_id:$('team').value,p_players:ps,p_notes:$('notes').value.trim(),p_confirm:confirmLineup});if(r.error)return alert(r.error.message);alert(confirmLineup?'Distinta confermata.':'Bozza salvata.');await loadData()}
async function loadData(){const keep=$('team').value,r=await sb.rpc('admin_get_match_lineup_data',{p_fixture_id:fixtureId});if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data;fixture=d.fixture;teams=d.teams||[];roster=d.roster||[];lineups=d.lineups||[];entries=d.lineup_players||[];const name=id=>teams.find(x=>x.id===id)?.name||'Squadra';$('matchTitle').textContent=`${name(fixture.home_team_id)} – ${name(fixture.away_team_id)}`;$('meta').textContent=`${fixture.scheduled_at?new Date(fixture.scheduled_at).toLocaleString('it-IT'):''} · ${fixture.venue||''}`;$('team').innerHTML=[fixture.home_team_id,fixture.away_team_id].map(id=>`<option value="${id}">${esc(name(id))}</option>`).join('');if(keep&&[fixture.home_team_id,fixture.away_team_id].includes(keep))$('team').value=keep;render();$('status').classList.add('hidden');$('app').classList.remove('hidden')}
async function init(){if(!fixtureId)return $('status').textContent='Partita non indicata.';const s=await sb.auth.getSession();if(!s.data.session)return location.replace('login.html');const p=await sb.from('profiles').select('role').eq('id',s.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin')return location.replace('account-home.html');$('resultBtn').onclick=()=>location.href=`match-center.html?id=${encodeURIComponent(fixtureId)}&v=9985`;try{await loadData()}catch(e){$('status').textContent='Errore: '+(e.message||String(e))}}
window.render=render;window.save=save;init();
</script></body></html>
