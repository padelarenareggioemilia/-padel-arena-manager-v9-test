<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICS Padel Championship Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#06111f;--panel:#10233b;--panel2:#09182a;--line:#315676;--text:#f8fafc;--muted:#a9bacd;--lime:#9dff25;--blue:#16a8ff;--red:#ef4444;--amber:#f6c453}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#123f61,transparent 34%),linear-gradient(180deg,#06111f,#040b14);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.shell{max-width:1200px;margin:auto;padding:16px 14px 90px}.hero{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:13px}.mark{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--lime),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.muted{color:var(--muted)}
.card,.top{background:rgba(16,35,59,.97);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--lime);color:#07111f}.secondary{background:#17304e;color:#fff;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:#fff}.ghost{background:transparent;color:#fff;border:1px solid #3c5d7d}.blue{background:var(--blue);color:#06111f}.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin:9px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #365474;background:#071523;color:#fff;font:inherit}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.ok{border-color:#4ade80;background:#0b2a20}.err{border-color:#ef4444;background:#351316}
.comp-logo{width:125px;height:125px;object-fit:contain;background:#fff;border-radius:18px;padding:4px}.group{border:1px solid #3b5e80;background:#09182a;border-radius:18px;padding:14px;margin:10px 0}.team-pill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:12px;background:#10233b;border:1px solid #315676;margin:7px 0}.fixture{display:grid;grid-template-columns:130px 1fr 180px 150px auto;gap:10px;align-items:center;padding:11px;border:1px solid #315676;border-radius:14px;background:#09182a;margin:8px 0}.small{font-size:12px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#17304e;border:1px solid #416b91;font-size:12px;font-weight:900}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:850px){.grid2,.grid3{grid-template-columns:1fr}.fixture{grid-template-columns:1fr}.fixture .btn{width:100%}.hero{align-items:flex-start}.comp-logo{width:95px;height:95px}}

.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.comp{text-align:center;background:#10233b;border:1px solid #315676;border-radius:22px;padding:16px}.comp img{width:100%;height:230px;object-fit:contain;background:#fff;border-radius:18px}@media(max-width:900px){.comps{grid-template-columns:1fr 1fr}}@media(max-width:600px){.comps{grid-template-columns:1fr}}
</style><style>
:root{
  --aics-blue:#164a95;
  --aics-blue-dark:#082f68;
  --aics-blue-soft:#2e6fba;
  --italy-green:#009246;
  --italy-red:#ce2b37;
  --bg:#f4f8fc;
  --panel:#ffffff;
  --panel-soft:#edf4fb;
  --text:#0a2e5e;
  --muted:#627b97;
  --line:#b9cde3;
  --shadow:0 14px 34px rgba(8,47,104,.13);
}
html{background:var(--bg)}
body{
  color:var(--text)!important;
  background:
    linear-gradient(90deg,rgba(0,146,70,.05),transparent 23%,transparent 77%,rgba(206,43,55,.05)),
    radial-gradient(circle at 50% 0%,rgba(22,74,149,.12),transparent 34%),
    var(--bg)!important;
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto 0;
  height:6px;
  z-index:9999;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
}
.hero{
  background:linear-gradient(135deg,var(--aics-blue),var(--aics-blue-dark))!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.25)!important;
  border-radius:24px!important;
  padding:18px!important;
  box-shadow:var(--shadow)!important;
}
.hero .muted{color:#d9e6f5!important}
.brand-logo{
  width:132px;
  height:78px;
  object-fit:contain;
  padding:8px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}
.mark{display:none!important}
.top,.card,.comp,.group,.comp-card{
  background:rgba(255,255,255,.98)!important;
  color:var(--text)!important;
  border:1px solid var(--line)!important;
  box-shadow:var(--shadow)!important;
}
.primary{background:linear-gradient(135deg,var(--aics-blue-soft),var(--aics-blue))!important;color:#fff!important}
.secondary{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--aics-blue-soft)!important}
.blue{background:var(--aics-blue)!important;color:#fff!important}
.danger{background:var(--italy-red)!important;color:#fff!important}
.ghost{background:#fff!important;color:var(--aics-blue)!important;border:1px solid var(--line)!important}
input,select,textarea{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
label{color:var(--aics-blue-dark)!important}
.notice{background:var(--panel-soft)!important;color:var(--text)!important;border-color:var(--line)!important}
.ok{background:#eaf8f0!important;border-color:var(--italy-green)!important}
.err{background:#fdecef!important;border-color:var(--italy-red)!important}
.kpi,.team,.fixture,.team-pill,.mini-team,.request{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
  box-shadow:0 8px 20px rgba(8,47,104,.07)!important;
}
.kpi strong{color:var(--aics-blue)!important}
.filter{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--line)!important}
.filter.active{
  color:#fff!important;
  border-color:var(--aics-blue)!important;
  background:linear-gradient(90deg,var(--italy-green),var(--aics-blue),var(--italy-red))!important;
}
.badge{background:#e8f1fb!important;color:var(--aics-blue-dark)!important;border-color:var(--line)!important}
.logo,.big-logo,.mini-logo,.comp-logo,.comp img{background:#fff!important;border-color:#dce6f2!important}
.placeholder{background:linear-gradient(135deg,#e8f1fb,#fff)!important;color:var(--aics-blue)!important}
.more-menu,.dialog-card{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
.more-menu .delete-item{background:#fff4f5!important;color:var(--italy-red)!important}
.tricolore{
  height:5px;
  border-radius:999px;
  margin:10px 0 0;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
  border:1px solid #d7e3ef;
}
.section-ribbon{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  font-weight:900;
  color:var(--aics-blue-dark);
  border:1px solid #d7e3ef;
  background:linear-gradient(90deg,rgba(0,146,70,.12),rgba(255,255,255,.95),rgba(206,43,55,.12));
}
@media(max-width:800px){
  .brand-logo{width:100px;height:62px}
}
</style>

</head><body><main class="shell"><div class="top"><div class="nav"><button class="btn secondary" onclick="history.back()">← Indietro</button><button class="btn secondary" onclick="location.href='index.html'">⌂ Home</button><button class="btn secondary" onclick="location.href='groups.html'">Gestione gironi</button><button class="btn secondary" onclick="location.href='calendar.html'">Calendario</button><button class="btn secondary" onclick="location.href='cup-italia.html'">Coppa Italia 32</button></div></div>
<header class="hero"><div class="brand"><img class="brand-logo" src="assets/aics-logo.png" alt="AICS"><div><h1 style="margin:0">Competizioni ufficiali</h1><div class="muted">AICS Padel Championship 2027</div></div></div></header><div class="tricolore"></div>
<section class="comps">
<div class="comp"><img src="assets/serie-a.png"><h2>Serie A</h2><button class="btn primary" onclick="location.href='groups.html'">Gestisci gironi</button></div>
<div class="comp"><img src="assets/serie-b.png"><h2>Serie B</h2><button class="btn primary" onclick="location.href='groups.html'">Gestisci gironi</button></div>
<div class="comp"><img src="assets/serie-c.png"><h2>Serie C</h2><button class="btn primary" onclick="location.href='groups.html'">Gestisci gironi</button></div>
<div class="comp"><img src="assets/coppa-italia.png"><h2>Coppa Italia</h2><p class="muted">Tutte le squadre delle tre serie.</p><button class="btn primary" onclick="location.href='groups.html'">Gestisci gironi</button></div>
<div class="comp"><img src="assets/supercoppa.png"><h2>Supercoppa</h2><p class="muted">Vincitrice del campionato contro vincitrice della Coppa Italia.</p><button class="btn blue" onclick="location.href='calendar.html'">Programma finale</button></div>
</section></main>
