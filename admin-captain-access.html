<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Accessi Capitani</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
body{margin:0;background:#f4f8fc;font-family:system-ui;color:#0a2e5e}main{width:min(1000px,calc(100% - 24px));margin:20px auto 80px}.card{background:white;border:1px solid #b9cde3;border-radius:18px;padding:16px;margin:10px 0}.team{border:1px solid #b9cde3;border-radius:14px;padding:13px;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:#164a95;color:#fff}.secondary{background:#fff;color:#164a95;border:1px solid #164a95}.danger{background:#ce2b37;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}input{width:100%;padding:11px;border:1px solid #b9cde3;border-radius:10px}.muted{color:#627b97}.notice{padding:10px;border:1px solid #b9cde3;border-radius:10px;background:#edf4fb;margin:8px 0}@media(max-width:650px){.actions{display:grid}.btn{width:100%}}
</style></head><body><main>
<section class="card"><h1>🔐 Gestione accessi Capitani</h1><p class="muted">Recupero password, cambio email e nuovo collegamento senza cancellare squadra o dati.</p><button class="btn secondary" onclick="location.href='admin-control.html'">← Torna all'Admin</button></section>
<section class="card"><input id="search" placeholder="Cerca squadra o email…" oninput="render()"></section>
<section id="list" class="card">Caricamento…</section>
</main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));let teams=[];
async function load(){const sess=(await sb.auth.getSession()).data.session;if(!sess){location.replace('login.html');return}const p=await sb.from('profiles').select('role').eq('id',sess.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin'){location.replace('account-home.html');return}const r=await sb.from('teams').select('id,name,series,captain_name,captain_email,logo_url,captain_access_enabled,captain_invite_token').order('name');if(r.error)throw r.error;teams=r.data||[];render()}
function render(){const q=$('search').value.trim().toLowerCase();const rows=teams.filter(t=>!q||(t.name+' '+(t.captain_email||'')).toLowerCase().includes(q));$('list').innerHTML=rows.map(t=>`<article class="team"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.series||'')} · Capitano: ${esc(t.captain_name||'')}</div><div class="notice">Email collegata: <b>${esc(t.captain_email||'NON IMPOSTATA')}</b></div><div class="actions"><button class="btn primary" onclick="resetPwd('${t.id}')">Invia recupero password</button><button class="btn secondary" onclick="changeEmail('${t.id}')">Cambia email / Ripristina accesso</button>${t.captain_invite_token?`<button class="btn secondary" onclick="copyInvite('${t.captain_invite_token}')">Copia link attivazione</button>`:''}</div><div id="m-${t.id}" class="muted"></div></article>`).join('')||'Nessuna squadra.'}
async function resetPwd(id){const t=teams.find(x=>x.id===id);if(!t?.captain_email)return alert('Email capitano non impostata.');const redirect=new URL('reset-password.html',location.href).href;const r=await sb.auth.resetPasswordForEmail(t.captain_email,{redirectTo:redirect});$('m-'+id).textContent=r.error?'Errore: '+r.error.message:'✅ Email di recupero inviata a '+t.captain_email}
async function changeEmail(id){const t=teams.find(x=>x.id===id),email=prompt('Nuova email del capitano:',t.captain_email||'');if(!email)return;const r=await sb.rpc('admin_reassign_captain_access',{p_team_id:id,p_new_email:email});if(r.error)return alert(r.error.message);const d=Array.isArray(r.data)?r.data[0]:r.data;t.captain_email=d.email;t.captain_invite_token=d.invite_token;render();const url=new URL(d.activation_path,location.href).href;await navigator.clipboard.writeText(url);alert(d.user_already_exists?'Accesso ricollegato all’account già esistente. Link di attivazione copiato.':'Email aggiornata. Nuovo link di attivazione copiato negli appunti.')}
async function copyInvite(token){const u=new URL('captain-activate.html?invite='+encodeURIComponent(token),location.href).href;await navigator.clipboard.writeText(u);alert('Link copiato.')}
load().catch(e=>$('list').textContent='Errore: '+(e.message||e));
</script></body></html>
