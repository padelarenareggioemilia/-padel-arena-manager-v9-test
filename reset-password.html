<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICS Padel Championship · Nuova password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7fb;font-family:system-ui;color:#092d5d}
.card{width:min(560px,calc(100% - 28px));background:#fff;border:1px solid #bfd0e2;border-radius:22px;padding:22px;box-shadow:0 14px 34px rgba(8,47,104,.12)}
h1{text-align:center}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #bfd0e2;border-radius:10px}
.btn{width:100%;border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer;background:#164a95;color:#fff}.notice{padding:11px;border:1px solid #bfd0e2;border-radius:11px;background:#eaf2fb;margin:10px 0}.err{background:#fdecef;border-color:#dd7a85}.ok{background:#ebf8f0;border-color:#79bf90}
</style>
</head>
<body>
<main class="card">
<h1>Crea una nuova password</h1>
<div class="notice">Inserisci una nuova password di almeno 8 caratteri.</div>
<div class="field"><label>Nuova password</label><input id="p1" type="password" autocomplete="new-password"></div>
<div class="field"><label>Ripeti nuova password</label><input id="p2" type="password" autocomplete="new-password"></div>
<button id="saveBtn" class="btn">SALVA NUOVA PASSWORD</button>
<div id="msg" class="notice">In attesa.</div>
</main>
<script>
const cfg=window.PAM_V9_CONFIG;
const s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const msg=document.getElementById('msg');
function show(t,e=false){msg.textContent=t;msg.className='notice '+(e?'err':'ok');}
document.getElementById('saveBtn').onclick=async()=>{
 const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
 if(p1.length<8)return show('La password deve avere almeno 8 caratteri.',true);
 if(p1!==p2)return show('Le due password non coincidono.',true);
 const b=document.getElementById('saveBtn');b.disabled=true;b.textContent='Salvataggio…';
 try{
   const r=await s.auth.updateUser({password:p1});
   if(r.error)throw r.error;
   show('✅ Password aggiornata. Apertura della tua area…');
   setTimeout(()=>location.replace('player-home.html?v=password-reset-1'),700);
 }catch(e){show('Impossibile aggiornare la password: '+(e.message||String(e)),true);b.disabled=false;b.textContent='SALVA NUOVA PASSWORD';}
};
</script>
</body></html>
