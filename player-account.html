<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recupera la mia iscrizione</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--g:#009246;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text);display:grid;place-items:center;min-height:100vh}.card{width:min(620px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.field{margin:10px 0}.field label{display:block;font-weight:900;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:11px;border:1px solid var(--line);border-radius:11px;background:#edf4fb;margin:10px 0}.ok{background:#ebf8f0;border-color:#79bf90}.err{background:#fdecef;border-color:#dd7a85}.hidden{display:none!important}
</style></head><body><main class="card"><h1>Registrati o recupera la tua iscrizione</h1>
<div class="notice">Usa la stessa email comunicata al capitano. Dopo la verifica dell'email, il sistema collegherà automaticamente l'account alla tua anagrafica già approvata.</div>
<section id="signupBox"><h2>Non hai ancora un account?</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Crea password</label><input id="password" type="password" minlength="8"></div><button class="btn primary" onclick="signup()">Crea account</button></section>
<section id="claimBox"><h2>Hai già effettuato l'accesso?</h2><button class="btn primary" onclick="claim()">Collega la mia iscrizione approvata</button></section>
<div id="msg" class="notice">Pronto.</div><div class="actions"><button class="btn secondary" onclick="location.href='login.html'">Vai al login</button><button class="btn secondary" onclick="location.href='account-home.html'">Home del mio account</button></div>
</main><script>
const cfg=window.PAM_V9_CONFIG,s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);
function msg(t,e=false){$('msg').textContent=t;$('msg').className='notice '+(e?'err':'ok')}
async function signup(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||password.length<8)return msg('Inserisci email e una password di almeno 8 caratteri.',true);const r=await s.auth.signUp({email,password,options:{emailRedirectTo:new URL('player-account.html?claim=1',location.href).href}});if(r.error)return msg(r.error.message,true);if(r.data.session){msg('Account creato. Ora collego l’iscrizione…');return claim()}msg('Controlla la tua email, conferma l’account e poi torna su questa pagina.')}
async function claim(){const session=await s.auth.getSession();if(!session.data.session)return msg('Prima accedi o conferma l’email del nuovo account.',true);const r=await s.rpc('claim_approved_player_profile');if(r.error)return msg(r.error.message,true);msg(r.data?.message||'Iscrizione collegata. Ora puoi aprire la tua area giocatore.');setTimeout(()=>location.href='account-home.html',900)}
window.signup=signup;window.claim=claim;
if(new URLSearchParams(location.search).get('claim')==='1')claim();
</script></body></html>
