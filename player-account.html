<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recupera iscrizione</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>body{font-family:system-ui;background:#f4f8fc;color:#0a2e5e;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(620px,calc(100% - 28px));background:#fff;border:1px solid #b9cde3;border-radius:20px;padding:20px}.field{margin:10px 0}input{width:100%;padding:11px;border:1px solid #b9cde3;border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:#164a95;color:#fff}.secondary{background:#fff;color:#164a95;border:1px solid #164a95}.notice{padding:11px;border:1px solid #b9cde3;border-radius:11px;background:#edf4fb;margin:10px 0}.err{background:#fdecef}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head>
<body><main class="card"><h1>Registrati o recupera la tua iscrizione</h1><div class="notice">Usa la stessa email comunicata al capitano.</div>
<div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8"></div>
<button class="btn primary" onclick="signup()">Crea account</button><button class="btn primary" onclick="claim()">Collega iscrizione approvata</button>
<div id="msg" class="notice">Pronto.</div><div class="actions"><button class="btn secondary" onclick="location.href='login.html?v=986'">Login</button><button class="btn secondary" onclick="location.href='account-home.html?v=986'">Home account</button></div></main>
<script>
const cfg=window.PAM_V9_CONFIG,s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);function m(t,e=false){msg.textContent=t;msg.className='notice '+(e?'err':'')}
async function signup(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||password.length<8)return m('Inserisci email e password di almeno 8 caratteri.',true);const r=await s.auth.signUp({email,password,options:{emailRedirectTo:new URL('player-account.html?claim=1&v=986',location.href).href}});if(r.error)return m(r.error.message,true);if(r.data.session)return claim();m('Controlla la tua email e conferma l’account.')}
async function claim(){const q=await s.auth.getSession();if(!q.data.session)return m('Prima effettua l’accesso.',true);const p=await s.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()==='admin')return m('Questo account è amministratore e non può essere convertito in Giocatore.',true);const r=await s.rpc('claim_approved_player_profile');if(r.error)return m(r.error.message,true);m(r.data?.message||'Iscrizione collegata.');setTimeout(()=>location.replace('player-home.html?v=986'),700)}
window.signup=signup;window.claim=claim;if(new URLSearchParams(location.search).get('claim')==='1')claim();
</script></body></html>
