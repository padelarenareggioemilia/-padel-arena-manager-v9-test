<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICS Padel Championship · Accesso giocatore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.33%,#fff 33.33% 66.66%,var(--r) 66.66%)}
.card{width:min(620px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 34px rgba(8,47,104,.13)}
.brand{text-align:center}.brand img{width:120px}.brand h1{margin:8px 0 4px}.muted{color:var(--muted)}
.field{margin:16px 0}label{display:block;font-weight:900;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit}
.btn{width:100%;border:0;border-radius:11px;padding:13px;font-weight:1000;cursor:pointer;margin-top:8px}.primary{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}
.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb;margin:14px 0;line-height:1.45}.ok{background:#eaf8f0;border-color:#79bf90}.err{background:#fdecef;border-color:#dd7a85}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img src="assets/aics-logo.png" alt="AICS">
    <h1>Entra nella tua Area Giocatore</h1>
    <div class="muted">AICS Padel Championship 2027</div>
  </div>

  <div class="notice">
    Inserisci <b>la stessa email usata per l’iscrizione alla squadra</b>.
    Ti invieremo un pulsante personale: ti basterà cliccarlo per entrare.
  </div>

  <div class="field">
    <label for="email">Email del giocatore</label>
    <input id="email" type="email" autocomplete="email" placeholder="nome@email.it">
  </div>

  <button id="sendBtn" class="btn primary" onclick="sendMagicLink()">INVIAMI IL LINK PER ENTRARE</button>
  <div id="msg" class="notice">Nessun link inviato.</div>

  <button class="btn secondary" onclick="location.href='login.html'">Ho già una password</button>
  <button class="btn secondary" onclick="location.href='public.html'">Torna al portale pubblico</button>
</main>

<script>
const cfg=window.PAM_V9_CONFIG;
const s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const $=id=>document.getElementById(id);
const MAGIC_REDIRECT='https://padelarenareggioemilia.github.io/-padel-arena-manager-v9-test/player-magic.html';

function message(text,type=''){
  $('msg').textContent=text;
  $('msg').className='notice '+type;
}
async function sendMagicLink(){
  const email=$('email').value.trim().toLowerCase();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    return message('Inserisci un indirizzo email valido.','err');
  }
  $('sendBtn').disabled=true;
  message('Invio del link in corso…');
  try{
    const check=await s.rpc('player_email_is_approved',{p_email:email});
    if(!check.error && check.data===false){
      return message('Con questa email non risulta ancora un giocatore approvato. Usa la stessa email inserita nella richiesta di iscrizione oppure contatta il capitano.','err');
    }
    const r=await s.auth.signInWithOtp({
      email,
      options:{
        emailRedirectTo:MAGIC_REDIRECT,
        shouldCreateUser:true
      }
    });
    if(r.error) throw r.error;
    message('✅ Email inviata. Apri il messaggio “AICS Padel Championship 2027”, premi “ENTRA NELLA TUA AREA GIOCATORE” e verrai portato direttamente nel portale. Il link è personale e scade dopo poco tempo.','ok');
  }catch(e){
    message('Non è stato possibile inviare il link: '+(e.message||String(e)),'err');
  }finally{
    $('sendBtn').disabled=false;
  }
}
window.sendMagicLink=sendMagicLink;
</script>
</body>
</html>
