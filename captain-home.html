<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Area Capitano</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%)}.shell{width:min(1100px,calc(100% - 24px));margin:auto;padding:22px 0 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.identity{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center}.logo{width:90px;height:90px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:15px}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb}.err{background:#fdecef}.ok{background:#ebf8f0}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{padding:14px;border:1px solid var(--line);border-radius:15px;text-align:center}.kpi strong{display:block;font-size:25px;color:var(--b)}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.primary,.tab.active{background:var(--b);color:#fff}.secondary,.tab{background:#fff;color:var(--b);border:1px solid var(--b)}.danger{background:var(--r);color:#fff}.success{background:var(--g);color:#fff}.player,.fixture{border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0}.player{display:grid;grid-template-columns:65px 1fr auto;gap:12px}.photo{width:62px;height:80px;object-fit:cover;border-radius:10px}.fixture{display:grid;grid-template-columns:130px 1fr auto;gap:12px}.hidden{display:none!important}@media(max-width:750px){.identity{grid-template-columns:75px 1fr}.kpis{grid-template-columns:1fr 1fr}.tabs,.actions{display:grid}.player,.fixture{grid-template-columns:1fr}.btn,.tab{width:100%}}
</style></head><body><main class="shell"><section class="hero"><h1>Area Capitano</h1><div id="heroSub">AICS Padel Championship</div></section><section class="card"><div id="status" class="notice">Caricamento…</div></section><section id="app" class="hidden"><section class="card"><div class="identity"><img id="teamLogo" class="logo"><div><h2 id="teamName"></h2><div id="teamMeta" class="muted"></div></div><button class="btn secondary" onclick="load()">Aggiorna</button></div></section><section class="card"><div class="kpis"><div class="kpi"><strong id="playersN">0</strong>Giocatori</div><div class="kpi"><strong id="pendingN">0</strong>Da approvare</div><div class="kpi"><strong id="playedN">0</strong>Giocate</div><div class="kpi"><strong id="futureN">0</strong>Da giocare</div></div></section><section class="card"><div class="tabs"><button class="tab active" data-v="players" onclick="setView('players')">Rosa e richieste</button><button class="tab" data-v="calendar" onclick="setView('calendar')">Calendario</button><button class="tab" data-v="management" onclick="setView('management')">Gestione squadra</button></div></section><section class="card"><div id="content"></div></section><section class="card"><div class="actions"><button class="btn primary" onclick="copyPlayers()">Copia link giocatori</button><button class="btn secondary" onclick="location.href='matches-view.html?team='+data.team_id">Partite squadra</button><button class="btn danger" onclick="logout()">Logout</button></div></section></section></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);let data,view='players';const a=x=>Array.isArray(x)?x:[];
function teamNameById(id){const t=a(data.teams).find(x=>x.id===id);return t?.name||'Squadra'}function wf(id){return a(data.statuses).find(x=>x.fixture_id===id)?.workflow_data||{}}function score(f){const r=wf(f.id).result_data||wf(f.id).result;if(!r)return null;const h=Number(r.home_score??r.home_matches??r.home),aw=Number(r.away_score??r.away_matches??r.away);return Number.isFinite(h)&&Number.isFinite(aw)?{h,aw}:null}function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?'Da definire':d.toLocaleString('it-IT')}
function player(p){return `<div class="player">${p.photo_url?`<img class="photo" src="${p.photo_url}">`:''}<div><b>${p.first_name||''} ${p.last_name||''}</b><div class="muted">${p.email||''} · ${p.fitp_ranking||''}</div><div class="muted">Stato: ${p.status||''}</div></div><div class="actions">${p.status==='pending'?`<button class="btn success" onclick="setStatus('${p.id}','approved')">Approva</button><button class="btn danger" onclick="setStatus('${p.id}','rejected')">Rifiuta</button>`:''}</div></div>`}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===view));if(view==='players'){content.innerHTML=a(data.players).map(player).join('')||'<div class="notice">Nessun giocatore.</div>';return}if(view==='calendar'){content.innerHTML=a(data.fixtures).map(f=>{const sc=score(f);return `<div class="fixture"><div><b>${date(f.scheduled_at)}</b></div><div><b>${teamNameById(f.home_team_id)}</b><br><b>${teamNameById(f.away_team_id)}</b></div><div>${sc?sc.h+' – '+sc.aw:'Da giocare'}</div></div>`}).join('')||'<div class="notice">Nessuna partita.</div>';return}content.innerHTML=`<h3>Note squadra</h3><textarea id="notes" style="width:100%;min-height:100px">${data.team?.notes||''}</textarea><br><button class="btn primary" onclick="saveNotes()">Salva note</button><div class="notice">Campo, giorno e orario restano modificabili solo dall’amministratore.</div>`}
function setView(v){view=v;render()}async function setStatus(id,status){const r=await s.rpc('captain_set_player_status',{p_team_id:data.team_id,p_player_id:id,p_status:status});if(r.error)return alert(r.error.message);load()}async function saveNotes(){const r=await s.rpc('captain_update_team_notes',{p_team_id:data.team_id,p_notes:notes.value});if(r.error)return alert(r.error.message);alert('Salvato.');load()}async function copyPlayers(){const t=data.team?.player_invite_token;if(!t)return alert('Token non disponibile');const u=new URL(`player.html?invite=${encodeURIComponent(t)}`,location.href).href;try{await navigator.clipboard.writeText(u);alert('Link copiato')}catch(e){prompt('Copia:',u)}}async function load(){try{const q=await s.auth.getSession();if(!q.data.session){location.replace('login.html?v=987');return}const p=await s.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()==='admin'){location.replace('index.html?v=987');return}const r=await s.rpc('get_my_captain_portal');if(r.error)throw r.error;data=Array.isArray(r.data)?r.data[0]:r.data;if(!data?.ok)throw new Error(data?.message||'Squadra non collegata');teamName.textContent=data.team?.name||'';teamMeta.textContent=[data.team?.series,data.team?.club_name].filter(Boolean).join(' · ');heroSub.textContent=data.team?.name||'';teamLogo.src=data.team?.logo_url||'';playersN.textContent=a(data.players).filter(x=>x.status==='approved').length;pendingN.textContent=a(data.players).filter(x=>x.status==='pending').length;playedN.textContent=a(data.fixtures).filter(score).length;futureN.textContent=a(data.fixtures).filter(x=>!score(x)).length;status.textContent='Accesso capitano attivo.';status.className='notice ok';app.classList.remove('hidden');render()}catch(e){status.textContent='Errore: '+(e.message||e);status.className='notice err'}}async function logout(){try{await s.auth.signOut({scope:'local'})}catch(e){}location.replace('login.html?change=1&v=987')}window.setView=setView;window.setStatus=setStatus;window.saveNotes=saveNotes;window.copyPlayers=copyPlayers;window.logout=logout;window.load=load;load();
</script></body></html>
