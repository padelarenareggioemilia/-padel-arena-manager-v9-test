<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V9 Admin Tesseramenti</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{font-family:system-ui;background:#f4f8fc;color:#0a2e5e;margin:0}body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,#009246 33%,#fff 33% 66%,#ce2b37 66%)}main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #b9cde3;border-radius:18px;padding:16px;margin:12px 0}.hero{background:#164a95;color:white}.btn{padding:11px 13px;border-radius:10px;border:0;font-weight:900;cursor:pointer}.primary{background:#164a95;color:white}.secondary{background:white;color:#164a95;border:1px solid #164a95}select,textarea{width:100%;padding:11px;border:1px solid #b9cde3;border-radius:10px}.player{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px;border-bottom:1px solid #b9cde3;align-items:center}.notice{padding:11px;border:1px solid #b9cde3;border-radius:11px;background:#edf4fb;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.badge{font-size:12px;font-weight:800}</style></head><body><main><section class="card hero"><h1>Admin · Tesseramenti V9.9.42</h1><b>MODALITÀ TEST — nessun invio esterno</b></section><section class="card"><button class="btn secondary" onclick="location.href='index.html?v=9942'">← Dashboard Admin</button></section><section class="card"><b>Squadra</b><select id="team"></select><div id="status" class="notice">Caricamento…</div></section><section id="work" class="hidden"><section class="card"><h2 id="title"></h2><div id="meta"></div></section><section class="card"><h2>Giocatori da includere</h2><div class="actions"><button class="btn secondary" onclick="toggleAll(true)">Seleziona tutti</button><button class="btn secondary" onclick="toggleAll(false)">Deseleziona tutti</button></div><div id="players"></div><div class="notice"><b>Selezionati:</b> <span id="count">0</span> · <b>Totale:</b> € <span id="amount">0.00</span></div><textarea id="notes" placeholder="Note facoltative"></textarea><br><br><button class="btn primary" onclick="createRequest()">Genera richiesta pagamento TEST</button></section><section class="card"><h2>Storico</h2><div id="history"></div></section></section></main><script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=x=>document.getElementById(x);let d=null;
async function start(){const s=(await sb.auth.getSession()).data.session;if(!s){location='login.html';return}const p=await sb.from('profiles').select('role').eq('id',s.user.id).maybeSingle();if(p.data?.role!=='admin')throw Error('Accesso riservato Admin');const r=await sb.from('teams').select('id,name,series,club_name').order('name');if(r.error)throw r.error;$('team').innerHTML='<option value="">Seleziona squadra</option>'+r.data.map(t=>`<option value="${t.id}" ${t.name==='EDEN NEXT GEN PADEL CLUB'?'selected':''}>${t.name}</option>`).join('');$('team').onchange=load;if($('team').value)await load();$('status').textContent='Admin riconosciuto.'}
async function load(){const id=$('team').value;if(!id)return;const r=await sb.rpc('admin_get_tesseramento_dashboard',{p_team_id:id});if(r.error)throw r.error;d=r.data;$('title').textContent=d.team.name;$('meta').textContent=[d.team.club_name,d.team.series,'Capitano: '+(d.team.captain_name||''),d.team.captain_email].filter(Boolean).join(' · ');render();$('work').classList.remove('hidden')}
function render(){$('players').innerHTML=(d.players||[]).map(p=>`<div class="player"><input class="pick" type="checkbox" value="${p.id}" ${p.registration_status==='da_tesserare'?'checked':'disabled'} onchange="calc()"><div><b>${p.first_name} ${p.last_name}</b><br><small>${p.email||''}</small></div><span class="badge">${p.registration_status}</span></div>`).join('');$('history').innerHTML=(d.requests||[]).map(q=>`<div class="notice"><b>${q.request_number}</b> · ${q.status} · ${q.player_count} giocatori · € ${Number(q.amount).toFixed(2)} ${q.test_mode?'· TEST':''}</div>`).join('')||'<div class="notice">Nessuna richiesta.</div>';calc()}
function calc(){const n=document.querySelectorAll('.pick:checked').length;$('count').textContent=n;$('amount').textContent=(n*Number(d.settings.fee_per_player||15)).toFixed(2)}
function toggleAll(v){document.querySelectorAll('.pick:not(:disabled)').forEach(x=>x.checked=v);calc()}
async function createRequest(){const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return alert('Seleziona almeno un giocatore.');if(!confirm(`Creare richiesta TEST per ${ids.length} giocatori? Nessuna email verrà inviata.`))return;const r=await sb.rpc('admin_create_tesseramento_request',{p_team_id:$('team').value,p_player_ids:ids,p_notes:$('notes').value.trim()||null,p_test_mode:true});if(r.error)return alert(r.error.message);alert(`Richiesta TEST ${r.data.request_number} creata. Totale € ${Number(r.data.amount).toFixed(2)}.`);await load()}
window.load=load;window.toggleAll=toggleAll;window.createRequest=createRequest;start().catch(e=>$('status').textContent='Errore: '+e.message);
</script></body></html>
