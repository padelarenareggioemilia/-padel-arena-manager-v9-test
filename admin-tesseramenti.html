<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V9 · Admin Tesseramenti</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--t:#0a2e5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--t)}
body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--g) 33%,#fff 33% 66%,var(--r) 66%)}
main{max-width:1050px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.btn{padding:11px 13px;border-radius:10px;border:0;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--b);color:#fff}.success{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}
select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.player{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.notice{padding:11px;border:1px solid var(--line);border-radius:11px;background:#edf4fb;margin:10px 0}.ok{background:#eaf8f0}.warn{background:#fff7dc}.err{background:#fdecef}
.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4fb;font-size:12px;font-weight:900}
.request{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.request a{color:var(--b);font-weight:800}.files a{display:inline-block;margin-right:12px}
@media(max-width:650px){.actions{display:grid}.btn{width:100%}}
</style></head>
<body><main>
<section class="card hero"><h1>Admin · Tesseramenti V9.9.67</h1><b>Flusso definitivo Admin → Capitano → Admin → AICS · SOLO REALE</b></section>
<section class="card"><button class="btn secondary" onclick="location.href='index.html?v=9966'">← Dashboard Admin</button></section>
<section class="card"><b>Squadra</b><select id="team"></select><div id="status" class="notice">Caricamento…</div></section>

<section id="work" class="hidden">
<section class="card"><h2 id="title"></h2><div id="meta"></div></section>

<section class="card">
<h2>Nuova richiesta di pagamento</h2>
<div class="notice ok"><b>Modalità operativa reale.</b> Tutte le nuove richieste vengono create come richieste effettive.</div>
<div class="actions"><button class="btn secondary" onclick="toggleAll(true)">Seleziona tutti</button><button class="btn secondary" onclick="toggleAll(false)">Deseleziona tutti</button></div>
<div id="players"></div>
<div class="notice"><b>Selezionati:</b> <span id="count">0</span> · <b>Totale:</b> € <span id="amount">0.00</span></div>
<textarea id="notes" placeholder="Note facoltative"></textarea><br><br>
<button class="btn primary" onclick="createRequest()">Genera richiesta pagamento</button>
</section>

<section class="card">
<h2>Richieste e verifica Admin</h2>
<div id="history"></div>
</section>
</section>
</main>

<script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=x=>document.getElementById(x);
let d=null;

async function start(){
 const s=(await sb.auth.getSession()).data.session;
 if(!s){location='login.html';return}
 const p=await sb.from('profiles').select('role').eq('id',s.user.id).maybeSingle();
 if(p.data?.role!=='admin')throw Error('Accesso riservato Admin');
 const r=await sb.from('teams').select('id,name,series,club_name').order('name');
 if(r.error)throw r.error;
 $('team').innerHTML='<option value="">Seleziona squadra</option>'+r.data.map(t=>`<option value="${t.id}" ${t.name==='EDEN NEXT GEN PADEL CLUB'?'selected':''}>${t.name}</option>`).join('');
 $('team').onchange=load;
 if($('team').value)await load();
 $('status').textContent='Admin riconosciuto.';
}
async function load(){
 const id=$('team').value;if(!id)return;
 const r=await sb.rpc('admin_get_tesseramento_dashboard',{p_team_id:id});
 if(r.error)throw r.error;
 d=r.data;
 $('title').textContent=d.team.name;
 $('meta').textContent=[d.team.club_name,d.team.series,'Capitano: '+(d.team.captain_name||''),d.team.captain_email].filter(Boolean).join(' · ');
 render();$('work').classList.remove('hidden');
}
function render(){
 $('players').innerHTML=(d.players||[]).map(p=>`<div class="player"><input class="pick" type="checkbox" value="${p.id}" ${p.registration_status==='da_tesserare'?'checked':'disabled'} onchange="calc()"><div><b>${p.first_name} ${p.last_name}</b><br><small>${p.email||''}</small></div><span class="pill">${p.registration_status}</span></div>`).join('');
 $('history').innerHTML=(d.requests||[]).map(q=>{
   const receipt=q.receipt_url?`<div class="notice ok">Ricevuta: <a href="${q.receipt_url}" target="_blank">Apri ricevuta</a></div>`:'';
   const prep=q.status==='receipt_uploaded' && !q.test_mode?`<button class="btn success" onclick="prepare('${q.id}')">Approva e prepara CSV + Excel + PDF</button>`:'';
   const files=(q.csv_file_url||q.xlsx_file_url||q.pdf_file_url)?`<div class="notice ok files"><b>Documenti:</b><br>${q.csv_file_url?`<a href="${q.csv_file_url}" target="_blank">CSV</a>`:''}${q.xlsx_file_url?`<a href="${q.xlsx_file_url}" target="_blank">Excel</a>`:''}${q.pdf_file_url?`<a href="${q.pdf_file_url}" target="_blank">PDF</a>`:''}</div>`:'';
   let send='';
   if(q.test_mode){
      send='<div class="notice warn"><b>Richiesta storica non inviabile.</b> Creata durante la fase di collaudo.</div>';
   } else if(q.status==='admin_approved'){
      send=`<div class="notice warn"><b>Pronta per invio ad AICS Reggio Emilia.</b><br>Destinatario: reggioemilia@aics.it · CC: aicspadeltour@gmail.com</div><button class="btn danger" onclick="sendAics('${q.id}','${q.request_number}')">Conferma e invia ad AICS</button>`;
   } else if(q.status==='submitted'){
      send=`<div class="notice ok"><b>INVIATA AD AICS</b>${q.sent_at?` · ${new Date(q.sent_at).toLocaleString('it-IT')}`:''}<br>I giocatori inclusi risultano ora Tesserati.</div>`;
   }
   return `<div class="request"><b>${q.request_number}</b> <span class="pill">${q.status}</span><div>${q.player_count} giocatori · € ${Number(q.amount).toFixed(2)}</div>${receipt}${prep}${files}${send}</div>`;
 }).join('')||'<div class="notice">Nessuna richiesta.</div>';
 calc();
}
function calc(){const n=document.querySelectorAll('.pick:checked').length;$('count').textContent=n;$('amount').textContent=(n*Number(d.settings.fee_per_player||15)).toFixed(2)}
function toggleAll(v){document.querySelectorAll('.pick:not(:disabled)').forEach(x=>x.checked=v);calc()}
async function createRequest(){
 const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);
 if(!ids.length)return alert('Seleziona almeno un giocatore.');
 const amount=(ids.length*Number(d.settings.fee_per_player||15)).toFixed(2);
 const msg=`ATTENZIONE: stai creando una richiesta REALE per ${ids.length} giocatori (€ ${amount}). Dopo ricevuta e tua approvazione potrà essere inviata ad AICS. Continuare?`;
 if(!confirm(msg))return;
 const r=await sb.rpc('admin_create_tesseramento_request',{p_team_id:$('team').value,p_player_ids:ids,p_notes:$('notes').value.trim()||null,p_test_mode:false});
 if(r.error)return alert(r.error.message);
 alert(`Richiesta ${r.data.request_number} creata. Totale € ${Number(r.data.amount).toFixed(2)}.`);
 await load();
}

function csvEscape(v){const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function rowsFor(detail){return (detail.players||[]).map(p=>({'Club affiliato':detail.team.club_name||'','Nome squadra':detail.team.name||'','Nome':p.first_name||'','Cognome':p.last_name||'','Data di nascita':p.birth_date||'','Luogo di nascita':p.birth_place||'','Comune di residenza':p.residence_town||'','Telefono':p.phone||'','Email':p.email||''}))}
async function uploadBlob(path,blob,type){const up=await sb.storage.from('team-documents').upload(path,blob,{contentType:type,upsert:true});if(up.error)throw up.error;return sb.storage.from('team-documents').getPublicUrl(path).data.publicUrl}
async function prepare(id){
 if(!confirm('Approvi la ricevuta e vuoi preparare CSV, Excel e PDF?'))return;
 try{
   const rr=await sb.rpc('admin_get_tesseramento_request_detail',{p_request_id:id}); if(rr.error)throw rr.error;
   const detail=rr.data,rows=rowsFor(detail),req=detail.request;
   if(req.test_mode)throw Error('Questa richiesta appartiene allo storico di collaudo e non può essere inviata.');
   if(req.status!=='receipt_uploaded')throw Error('La richiesta non è nello stato corretto.');
   const headers=Object.keys(rows[0]||{});
   const csv='\uFEFF'+headers.map(csvEscape).join(';')+'\n'+rows.map(r=>headers.map(h=>csvEscape(r[h])).join(';')).join('\n');
   const csvBlob=new Blob([csv],{type:'text/csv;charset=utf-8'});
   const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tesseramenti');
   const xlsxBlob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
   const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape'});doc.setFontSize(14);doc.text('AICS Padel Championship - Richiesta tesseramenti',14,15);doc.setFontSize(10);doc.text(`Club: ${detail.team.club_name||''}`,14,23);doc.text(`Squadra: ${detail.team.name||''}`,14,29);doc.text(`Richiesta: ${req.request_number||''}`,14,35);doc.text(`Giocatori: ${rows.length} - Importo: EUR ${Number(req.amount||0).toFixed(2)}`,14,41);let y=50;doc.setFontSize(8);rows.forEach((r,i)=>{if(y>190){doc.addPage();y=15}doc.text(`${i+1}. ${r.Nome} ${r.Cognome} | ${r['Data di nascita']} | ${r['Luogo di nascita']} | ${r['Comune di residenza']} | ${r.Telefono} | ${r.Email}`,14,y);y+=6});
   const base=`${detail.team.id}/tesseramenti/${id}`;
   const csvUrl=await uploadBlob(`${base}/${req.request_number}.csv`,csvBlob,'text/csv');
   const xlsxUrl=await uploadBlob(`${base}/${req.request_number}.xlsx`,xlsxBlob,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
   const pdfUrl=await uploadBlob(`${base}/${req.request_number}.pdf`,doc.output('blob'),'application/pdf');
   const save=await sb.rpc('admin_mark_tesseramento_prepared',{p_request_id:id,p_csv_url:csvUrl,p_xlsx_url:xlsxUrl,p_pdf_url:pdfUrl});if(save.error)throw save.error;
   alert('Documenti preparati. La richiesta è pronta per l’invio finale ad AICS.');
   await load();
 }catch(e){alert('Errore: '+(e.message||e))}
}
async function sendAics(id,num){
 const phrase=prompt(`INVIO AD AICS\n\nRichiesta ${num}\n\nPer confermare scrivi esattamente: INVIA AICS`);
 if(phrase!=='INVIA AICS')return alert('Invio annullato.');
 try{
   const r=await sb.functions.invoke('send-tesseramento-aics',{body:{request_id:id}});
   if(r.error)throw r.error;
   if(!r.data?.ok)throw Error(r.data?.error||'Invio non riuscito');
   alert(`Invio riuscito ad AICS Reggio Emilia.\n${r.data.playerCount} giocatori aggiornati a Tesserato.`);
   await load();
 }catch(e){
   // La funzione può avere completato l'invio anche se il browser non riceve la risposta finale.
   // Prima di mostrare un errore, verifichiamo sempre lo stato reale salvato in Supabase.
   try{
     const check=await sb.from('tesseramento_requests').select('status,sent_at').eq('id',id).maybeSingle();
     if(!check.error && check.data?.status==='submitted' && check.data?.sent_at){
       alert('Invio eseguito correttamente ad AICS.\nIl database conferma l’invio; la risposta finale della funzione non è arrivata al browser.');
       await load();
       return;
     }
   }catch(_verifyError){}
   alert('Invio NON eseguito: '+(e.message||e));
 }
}
window.toggleAll=toggleAll;window.createRequest=createRequest;window.prepare=prepare;window.sendAics=sendAics;
start().catch(e=>$('status').textContent='Errore: '+e.message);
</script>
</body></html>
