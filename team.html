<!doctype html><html lang="it"><head><title>Dettaglio squadra</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#06111f;--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25;--blue:#16a8ff;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.shell{max-width:1150px;margin:auto;padding:16px 14px 80px}.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.muted{color:var(--muted)}
.top,.card{background:#10233bf5;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--accent);color:#07111f}.secondary{background:#17304e;color:#fff;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:#fff}.ghost{background:transparent;color:#fff;border:1px solid #3c5d7d}.tiny{padding:7px 9px;font-size:12px}.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:#fff;font:inherit}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.ok{border-color:#4ade80;background:#0b2a20}.err{border-color:#ef4444;background:#351316}.preview{width:120px;height:120px;border-radius:16px;border:1px dashed #5c7f9f;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:#0b1e32;border:1px solid #315676;border-radius:16px;padding:14px}.kpi strong{display:block;font-size:24px;color:var(--accent)}
.filter{background:#142f49;color:#fff;border:1px solid #416b91}.filter.active{background:var(--accent);color:#07111f;border-color:var(--accent)}
.team{position:relative;display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:15px;border:1px solid #315271;border-radius:17px;background:#09182a;margin:10px 0}.logo{width:76px;height:76px;border-radius:15px;object-fit:contain;background:#fff;border:1px solid #40688d;padding:4px}.placeholder{width:76px;height:76px;border-radius:15px;display:grid;place-items:center;background:#17304e;font-size:28px}.meta{font-size:13px;color:var(--muted);line-height:1.55}
.team-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.more-wrap{position:relative}.more-menu{position:absolute;right:0;top:44px;min-width:210px;background:#0b1a2b;border:1px solid #3f6385;border-radius:14px;padding:8px;z-index:15;box-shadow:0 16px 38px rgba(0,0,0,.35)}.more-menu button{width:100%;text-align:left;margin:3px 0}.more-menu .delete-item{font-size:12px;padding:8px 10px;background:transparent;color:#ff9ca6;border:1px solid rgba(239,68,68,.35)}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:100}.dialog-card{width:min(520px,100%);background:#10233b;border:1px solid #4c6b89;border-radius:20px;padding:18px}.dialog-card h2{margin-top:0}
@media(max-width:760px){.grid2,.kpis{grid-template-columns:1fr}.team{grid-template-columns:62px 1fr}.logo,.placeholder{width:58px;height:58px}.team-actions{grid-column:1/-1}.team-actions .btn{flex:1}.hero{align-items:flex-start}.filters .btn{flex:1}}

.detail-grid{display:grid;grid-template-columns:240px 1fr;gap:16px}.big-logo{width:220px;height:220px;border-radius:22px;object-fit:contain;background:#fff;padding:8px}@media(max-width:760px){.detail-grid{grid-template-columns:1fr}.big-logo{width:150px;height:150px}}
</style></head><body><main class="shell"><div class="top"><div class="nav"><button class="btn secondary" onclick="history.back()">← Indietro</button><button class="btn secondary" onclick="location.href='index.html'">⌂ Home</button><button class="btn secondary" onclick="location.href='competitions.html'">Serie e Coppa Italia</button></div></div><section id="teamBox" class="card">Caricamento squadra...</section><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),id=new URLSearchParams(location.search).get('id'),box=document.getElementById('teamBox');
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
async function init(){let q=await s.auth.getSession();if(!q.data.session)return location.href='login.html';let r=await s.from('teams').select('*').eq('id',id).single();if(r.error)return box.innerHTML=`<div class="notice err">${esc(r.error.message)}</div>`;let t=r.data;let rr=await s.from('roster_requests').select('*').eq('team_id',id).order('created_at',{ascending:false});box.innerHTML=`<div class="detail-grid"><div>${t.logo_url?`<img class="big-logo" src="${esc(t.logo_url)}">`:`<div class="big-logo placeholder">🏆</div>`}</div><div><span class="notice">${esc(t.series||'')}</span><h1>${esc(t.name)}</h1><div class="meta"><b>Club:</b> ${esc(t.club_name||'')}<br><b>Indirizzo:</b> ${esc(t.club_address||'')} ${esc(t.club_city||'')} ${esc(t.club_province||'')}<br><b>Campo di casa:</b> ${esc(t.home_court||'')}<br><b>Partite in casa:</b> ${esc(t.home_match_day||'Da definire')}${t.home_match_time?' alle '+esc(String(t.home_match_time).slice(0,5)):''}<br><b>Capitano:</b> ${esc(t.captain_name||'')}<br><b>Email:</b> ${esc(t.captain_email||'')}<br><b>Telefono:</b> ${esc(t.captain_phone||'')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="location.href='index.html?edit=${encodeURIComponent(t.id)}'">Gestisci squadra</button><button class="btn secondary" onclick="copyLink('${new URL(`captain.html?invite=${encodeURIComponent(t.captain_invite_token)}`,location.href).href}')">Copia link capitano</button><button class="btn secondary" onclick="copyLink('${new URL(`player.html?team=${encodeURIComponent(t.player_invite_token)}`,location.href).href}')">Copia link giocatori</button></div></div></div><hr><h2>Richieste giocatori</h2>${(rr.data||[]).map(x=>`<div class="request"><b>${esc(x.first_name)} ${esc(x.last_name)}</b><div class="meta">${esc(x.email)} · ${esc(x.phone)} · ${esc(x.status)}</div></div>`).join('')||'<div class="notice">Nessuna richiesta.</div>'}`}
async function copyLink(u){try{await navigator.clipboard.writeText(u);alert('Link copiato')}catch{prompt('Copia il link:',u)}}
init();
</script></main></body></html>
