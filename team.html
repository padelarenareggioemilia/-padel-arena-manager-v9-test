<style>

:root{--bg:#06111f;--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25;--blue:#16a8ff;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.shell{max-width:1150px;margin:auto;padding:16px 14px 80px}.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.muted{color:var(--muted)}
.top,.card{background:#10233bf5;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--accent);color:#07111f}.secondary{background:#17304e;color:#fff;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:#fff}.ghost{background:transparent;color:#fff;border:1px solid #3c5d7d}.tiny{padding:7px 9px;font-size:12px}.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:#fff;font:inherit}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.ok{border-color:#4ade80;background:#0b2a20}.err{border-color:#ef4444;background:#351316}.preview{width:120px;height:120px;border-radius:16px;border:1px dashed #5c7f9f;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:#0b1e32;border:1px solid #315676;border-radius:16px;padding:14px}.kpi strong{display:block;font-size:24px;color:var(--accent)}
.filter{background:#142f49;color:#fff;border:1px solid #416b91}.filter.active{background:var(--accent);color:#07111f;border-color:var(--accent)}
.team{position:relative;display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:15px;border:1px solid #315271;border-radius:17px;background:#09182a;margin:10px 0}.logo{width:76px;height:76px;border-radius:15px;object-fit:contain;background:#fff;border:1px solid #40688d;padding:4px}.placeholder{width:76px;height:76px;border-radius:15px;display:grid;place-items:center;background:#17304e;font-size:28px}.meta{font-size:13px;color:var(--muted);line-height:1.55}
.team-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.more-wrap{position:relative}.more-menu{position:absolute;right:0;top:44px;min-width:210px;background:#0b1a2b;border:1px solid #3f6385;border-radius:14px;padding:8px;z-index:15;box-shadow:0 16px 38px rgba(0,0,0,.35)}.more-menu button{width:100%;text-align:left;margin:3px 0}.more-menu .delete-item{font-size:12px;padding:8px 10px;background:transparent;color:#ff9ca6;border:1px solid rgba(239,68,68,.35)}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:100}.dialog-card{width:min(520px,100%);background:#10233b;border:1px solid #4c6b89;border-radius:20px;padding:18px}.dialog-card h2{margin-top:0}
@media(max-width:760px){.grid2,.kpis{grid-template-columns:1fr}.team{grid-template-columns:62px 1fr}.logo,.placeholder{width:58px;height:58px}.team-actions{grid-column:1/-1}.team-actions .btn{flex:1}.hero{align-items:flex-start}.filters .btn{flex:1}}

.detail-grid{display:grid;grid-template-columns:240px 1fr;gap:16px}.big-logo{width:220px;height:220px;border-radius:22px;object-fit:contain;background:#fff;padding:8px}@media(max-width:760px){.detail-grid{grid-template-columns:1fr}.big-logo{width:150px;height:150px}}


:root{
  --aics-blue:#164a95;
  --aics-blue-dark:#082f68;
  --aics-blue-soft:#2e6fba;
  --italy-green:#009246;
  --italy-red:#ce2b37;
  --bg:#f4f8fc;
  --panel:#ffffff;
  --panel-soft:#edf4fb;
  --text:#0a2e5e;
  --muted:#627b97;
  --line:#b9cde3;
  --shadow:0 14px 34px rgba(8,47,104,.13);
}
html{background:var(--bg)}
body{
  color:var(--text)!important;
  background:
    linear-gradient(90deg,rgba(0,146,70,.05),transparent 23%,transparent 77%,rgba(206,43,55,.05)),
    radial-gradient(circle at 50% 0%,rgba(22,74,149,.12),transparent 34%),
    var(--bg)!important;
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto 0;
  height:6px;
  z-index:9999;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
}
.hero{
  background:linear-gradient(135deg,var(--aics-blue),var(--aics-blue-dark))!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.25)!important;
  border-radius:24px!important;
  padding:18px!important;
  box-shadow:var(--shadow)!important;
}
.hero .muted{color:#d9e6f5!important}
.brand-logo{
  width:132px;
  height:78px;
  object-fit:contain;
  padding:8px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}
.mark{display:none!important}
.top,.card,.comp,.group,.comp-card{
  background:rgba(255,255,255,.98)!important;
  color:var(--text)!important;
  border:1px solid var(--line)!important;
  box-shadow:var(--shadow)!important;
}
.primary{background:linear-gradient(135deg,var(--aics-blue-soft),var(--aics-blue))!important;color:#fff!important}
.secondary{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--aics-blue-soft)!important}
.blue{background:var(--aics-blue)!important;color:#fff!important}
.danger{background:var(--italy-red)!important;color:#fff!important}
.ghost{background:#fff!important;color:var(--aics-blue)!important;border:1px solid var(--line)!important}
input,select,textarea{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
label{color:var(--aics-blue-dark)!important}
.notice{background:var(--panel-soft)!important;color:var(--text)!important;border-color:var(--line)!important}
.ok{background:#eaf8f0!important;border-color:var(--italy-green)!important}
.err{background:#fdecef!important;border-color:var(--italy-red)!important}
.kpi,.team,.fixture,.team-pill,.mini-team,.request{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
  box-shadow:0 8px 20px rgba(8,47,104,.07)!important;
}
.kpi strong{color:var(--aics-blue)!important}
.filter{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--line)!important}
.filter.active{
  color:#fff!important;
  border-color:var(--aics-blue)!important;
  background:linear-gradient(90deg,var(--italy-green),var(--aics-blue),var(--italy-red))!important;
}
.badge{background:#e8f1fb!important;color:var(--aics-blue-dark)!important;border-color:var(--line)!important}
.logo,.big-logo,.mini-logo,.comp-logo,.comp img{background:#fff!important;border-color:#dce6f2!important}
.placeholder{background:linear-gradient(135deg,#e8f1fb,#fff)!important;color:var(--aics-blue)!important}
.more-menu,.dialog-card{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
.more-menu .delete-item{background:#fff4f5!important;color:var(--italy-red)!important}
.tricolore{
  height:5px;
  border-radius:999px;
  margin:10px 0 0;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
  border:1px solid #d7e3ef;
}
.section-ribbon{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  font-weight:900;
  color:var(--aics-blue-dark);
  border:1px solid #d7e3ef;
  background:linear-gradient(90deg,rgba(0,146,70,.12),rgba(255,255,255,.95),rgba(206,43,55,.12));
}

  .brand-logo{width:100px;height:62px}

.edit-logo-box{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-bottom:14px}
.edit-logo-preview{width:145px;height:145px;border:1px dashed var(--line);border-radius:18px;background:#f8fbff;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;font-weight:900}

.roster-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #dce6f0}

.admin-player-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.player-edit-overlay{position:fixed;inset:0;background:rgba(4,24,50,.62);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
.player-edit-card{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.player-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-mini{padding:7px 9px!important;font-size:12px!important}
@media(max-width:760px){.player-edit-grid{grid-template-columns:1fr}}

<script>
const cfg = window.PAM_V9_CONFIG;
const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);
const params = new URLSearchParams(window.location.search);
const teamId = params.get('id');
const box = document.getElementById('teamBox');
let currentTeam = null;
let newLogoFile = null;
let adminRosterCache=[];

const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[ch]));

function formatDate(value) {
  if (!value) return 'Non indicata';
  const d = new Date(value + 'T12:00:00');
  return Number.isNaN(d.getTime()) ? esc(value) : d.toLocaleDateString('it-IT');
}

function formatTime(value) {
  return value ? String(value).slice(0,5) : 'Da definire';
}


function normalizeDay(value) {
  const raw = String(value || '').trim().toLowerCase();
  const days = {'lunedi':'Lunedì','lunedì':'Lunedì','martedi':'Martedì','martedì':'Martedì','mercoledi':'Mercoledì','mercoledì':'Mercoledì','giovedi':'Giovedì','giovedì':'Giovedì','venerdi':'Venerdì','venerdì':'Venerdì','sabato':'Sabato','domenica':'Domenica'};
  return days[raw] || '';
}
function normalizeTime(value) {
  const match = String(value || '').match(/(\d{1,2}):(\d{2})/);
  if (!match) return '';
  return String(match[1]).padStart(2,'0') + ':' + match[2];
}
function setEditMessage(text, error=false) {
  const el = document.getElementById('editMessage');
  el.textContent = text;
  el.className = 'notice ' + (error ? 'err' : 'ok');
  el.classList.remove('hidden');
}
function openInlineEditor() {
  if (!currentTeam) return;
  const editor = document.getElementById('inlineEditor');
  editor.classList.remove('hidden');
  document.getElementById('editName').value = currentTeam.name || '';
  document.getElementById('editSeries').value = currentTeam.series || 'Serie C';
  document.getElementById('editClub').value = currentTeam.club_name || '';
  document.getElementById('editFiscal').value = currentTeam.club_fiscal_code || '';
  document.getElementById('editAddress').value = currentTeam.club_address || '';
  document.getElementById('editCity').value = currentTeam.club_city || '';
  document.getElementById('editProvince').value = currentTeam.club_province || '';
  document.getElementById('editCourt').value = currentTeam.home_court || '';
  document.getElementById('editCaptain').value = currentTeam.captain_name || '';
  document.getElementById('editCaptainEmail').value = currentTeam.captain_email || '';
  document.getElementById('editCaptainPhone').value = currentTeam.captain_phone || '';
  document.getElementById('editHomeDay').value = normalizeDay(currentTeam.home_match_day);
  document.getElementById('editHomeTime').value = normalizeTime(currentTeam.home_match_time);
  document.getElementById('editMatchSlotMinutes').value = String(currentTeam.match_slot_minutes || 120);
  document.getElementById('editAccess').checked = currentTeam.captain_access_enabled !== false;
  document.getElementById('editNotes').value = currentTeam.notes || '';
  document.getElementById('editMessage').classList.add('hidden');

  newLogoFile = null;
  const logoInput = document.getElementById('editLogoFile');
  if (logoInput) logoInput.value = '';
  const logoPreview = document.getElementById('editLogoPreview');
  const logoFileName = document.getElementById('editLogoFileName');
  if (logoPreview) {
    logoPreview.innerHTML = currentTeam.logo_url
      ? `<img src="${esc(currentTeam.logo_url)}" alt="Logo attuale">`
      : '<span>NESSUN LOGO</span>';
  }
  if (logoFileName) logoFileName.textContent = '';
  const replaceButton = document.getElementById('replaceLogoBtn');
  if (replaceButton) replaceButton.disabled = true;
  const removeButton = document.getElementById('removeLogoBtn');
  if (removeButton) removeButton.disabled = !currentTeam.logo_url;

  editor.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeInlineEditor() { const editor=document.getElementById('inlineEditor'); if(editor) editor.classList.add('hidden'); }

function previewTeamLogo(event) {
  newLogoFile = event.target.files?.[0] || null;
  const preview = document.getElementById('editLogoPreview');
  const fileName = document.getElementById('editLogoFileName');

  if (!newLogoFile) {
    preview.innerHTML = currentTeam?.logo_url
      ? `<img src="${esc(currentTeam.logo_url)}" alt="Logo attuale">`
      : '<span>NESSUN LOGO</span>';
    fileName.textContent = '';
    return;
  }

  const allowed = ['image/jpeg','image/png','image/webp'];
  if (!allowed.includes(newLogoFile.type)) {
    newLogoFile = null;
    event.target.value = '';
    fileName.textContent = '';
    setEditMessage('Formato non valido. Usa JPG, PNG o WEBP.', true);
    return;
  }

  if (newLogoFile.size > 5 * 1024 * 1024) {
    newLogoFile = null;
    event.target.value = '';
    fileName.textContent = '';
    setEditMessage('Il logo non può superare 5 MB.', true);
    return;
  }

  const url = URL.createObjectURL(newLogoFile);
  preview.innerHTML = `<img src="${url}" alt="Anteprima nuovo logo">`;
  fileName.textContent = newLogoFile.name;
  const replaceButton = document.getElementById('replaceLogoBtn');
  if (replaceButton) replaceButton.disabled = false;
}


async function replaceTeamLogoNow() {
  if (!currentTeam) return;
  if (!newLogoFile) {
    setEditMessage('Seleziona prima il nuovo logo.', true);
    return;
  }

  const button = document.getElementById('replaceLogoBtn');
  if (button) {
    button.disabled = true;
    button.textContent = 'Caricamento…';
  }

  try {
    const newUrl = await uploadTeamLogo(currentTeam.id);

    const update = await sb
      .from('teams')
      .update({
        logo_url: newUrl,
        updated_at: new Date().toISOString()
      })
      .eq('id', currentTeam.id)
      .select('id,logo_url')
      .maybeSingle();

    if (update.error) throw update.error;
    if (!update.data?.logo_url) {
      throw new Error('Il nuovo logo è stato caricato ma non è stato collegato alla squadra.');
    }

    currentTeam.logo_url = update.data.logo_url;
    newLogoFile = null;

    const input = document.getElementById('editLogoFile');
    if (input) input.value = '';

    const preview = document.getElementById('editLogoPreview');
    if (preview) {
      preview.innerHTML =
        `<img src="${esc(update.data.logo_url)}?v=${Date.now()}" alt="Nuovo logo">`;
    }

    const fileName = document.getElementById('editLogoFileName');
    if (fileName) fileName.textContent = '';

    const removeButton = document.getElementById('removeLogoBtn');
    if (removeButton) removeButton.disabled = false;

    setEditMessage('Logo sostituito correttamente.');

    setTimeout(() => {
      window.location.replace(
        'team.html?id=' + encodeURIComponent(currentTeam.id) + '&v=' + Date.now()
      );
    }, 700);
  } catch (error) {
    setEditMessage(
      error?.message || 'Errore durante la sostituzione del logo.',
      true
    );
    if (button) button.disabled = false;
  } finally {
    if (button) button.textContent = 'Sostituisci logo adesso';
  }
}

async function removeTeamLogoNow() {
  if (!currentTeam?.logo_url) {
    setEditMessage('La squadra non ha un logo da rimuovere.', true);
    return;
  }

  if (!confirm(
    'Rimuovere il logo attuale della squadra? Potrai inserirne uno nuovo in qualsiasi momento.'
  )) return;

  try {
    const update = await sb
      .from('teams')
      .update({
        logo_url: null,
        updated_at: new Date().toISOString()
      })
      .eq('id', currentTeam.id)
      .select('id')
      .maybeSingle();

    if (update.error) throw update.error;

    currentTeam.logo_url = null;
    newLogoFile = null;

    const input = document.getElementById('editLogoFile');
    if (input) input.value = '';

    const preview = document.getElementById('editLogoPreview');
    if (preview) preview.innerHTML = '<span>NESSUN LOGO</span>';

    const removeButton = document.getElementById('removeLogoBtn');
    if (removeButton) removeButton.disabled = true;

    const replaceButton = document.getElementById('replaceLogoBtn');
    if (replaceButton) replaceButton.disabled = true;

    setEditMessage('Logo rimosso correttamente.');

    setTimeout(() => {
      window.location.replace(
        'team.html?id=' + encodeURIComponent(currentTeam.id) + '&v=' + Date.now()
      );
    }, 700);
  } catch (error) {
    setEditMessage(
      error?.message || 'Errore durante la rimozione del logo.',
      true
    );
  }
}

window.replaceTeamLogoNow = replaceTeamLogoNow;
window.removeTeamLogoNow = removeTeamLogoNow;


async function uploadTeamLogo(teamId) {
  if (!newLogoFile) return currentTeam?.logo_url || null;
  if (!newLogoFile.size) throw new Error('Il file del logo è vuoto.');
  if (!['image/png','image/jpeg','image/webp'].includes(newLogoFile.type)) throw new Error('Usa PNG, JPG o WEBP.');

  const originalExt = (newLogoFile.name.split('.').pop() || 'png').toLowerCase();
  const ext = ['jpg','jpeg','png','webp'].includes(originalExt) ? originalExt : 'png';
  const storagePath = `teams/${teamId}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

  const upload = await sb.storage
    .from('team-logos')
    .upload(storagePath, newLogoFile, {
      cacheControl: '3600',
      upsert: false,
      contentType: newLogoFile.type
    });

  if (upload.error) throw upload.error;

  return sb.storage
    .from('team-logos')
    .getPublicUrl(storagePath)
    .data
    .publicUrl;
}

window.previewTeamLogo = previewTeamLogo;

async function saveInlineEditor() {
  if (!currentTeam) return;
  const payload = {
    name: document.getElementById('editName').value.trim(),
    series: document.getElementById('editSeries').value,
    club_name: document.getElementById('editClub').value.trim(),
    club_fiscal_code: document.getElementById('editFiscal').value.trim(),
    club_address: document.getElementById('editAddress').value.trim(),
    club_city: document.getElementById('editCity').value.trim(),
    club_province: document.getElementById('editProvince').value.trim().toUpperCase(),
    home_court: document.getElementById('editCourt').value.trim(),
    captain_name: document.getElementById('editCaptain').value.trim(),
    captain_email: document.getElementById('editCaptainEmail').value.trim().toLowerCase(),
    captain_phone: document.getElementById('editCaptainPhone').value.trim(),
    home_match_day: document.getElementById('editHomeDay').value || null,
    home_match_time: document.getElementById('editHomeTime').value || null,
    match_slot_minutes: Number(document.getElementById('editMatchSlotMinutes').value || 120),
    captain_access_enabled: document.getElementById('editAccess').checked,
    notes: document.getElementById('editNotes').value.trim(),
    updated_at: new Date().toISOString()
  };
  if (!payload.name || !payload.captain_name || !payload.captain_email) return setEditMessage('Compila nome squadra, capitano ed email.', true);
  try {
    const logoUrl = await uploadTeamLogo(currentTeam.id);
    if (logoUrl) payload.logo_url = logoUrl;

    const result = await sb
      .from('teams')
      .update(payload)
      .eq('id', currentTeam.id);

    if (result.error) throw result.error;

    setEditMessage(
      newLogoFile
        ? 'Squadra e logo aggiornati correttamente.'
        : 'Squadra aggiornata correttamente.'
    );

    currentTeam = {...currentTeam, ...payload};
    newLogoFile = null;

    setTimeout(() => {
      window.location.replace(
        'team.html?id=' + encodeURIComponent(currentTeam.id) + '&v=931'
      );
    }, 600);
  } catch (error) {
    setEditMessage(error?.message || 'Errore durante il salvataggio del logo.', true);
  }
}

window.closeInlineEditor = closeInlineEditor;
window.saveInlineEditor = saveInlineEditor;

async function reloadAdminRoster(){
  if(!currentTeam?.id)return;
  const r=await sb.from('roster_requests').select('*').eq('team_id',currentTeam.id).order('last_name',{ascending:true});
  if(r.error)return adminPlayerMessage(r.error.message,true);
  renderAdminRoster(r.data||[]);
}

async function uploadAdminPlayerPhoto(file){
  if(!file)throw new Error('Carica la foto tessera con sfondo bianco.');
  if(file.size>5*1024*1024)throw new Error('La foto non può superare 5 MB.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const safe=['jpg','jpeg','png','webp'].includes(ext)?ext:'jpg';
  const path=`${currentTeam.id}/${crypto.randomUUID()}.${safe}`;
  const up=await sb.storage.from('player-photos').upload(path,file,{contentType:file.type,upsert:false});
  if(up.error)throw up.error;
  return sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl;
}

async function adminAddPlayer(){
  if(!currentTeam?.id)return adminPlayerMessage('Squadra non caricata.',true);
  const ids=['adminPlayerFirstName','adminPlayerLastName','adminPlayerBirthDate','adminPlayerBirthPlace','adminPlayerResidenceTown','adminPlayerPostalCode','adminPlayerProvince','adminPlayerEmail','adminPlayerPhone','adminPlayerFitp','adminPlayerMedical'];
  const v=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value.trim()]));
  if(ids.some(id=>!v[id]))return adminPlayerMessage('Compila tutti i dati obbligatori.',true);
  if(!/^\d{5}$/.test(v.adminPlayerPostalCode))return adminPlayerMessage('Il CAP deve contenere 5 cifre.',true);
  const button=document.getElementById('adminAddPlayerBtn');
  button.disabled=true;button.textContent='Inserimento in corso…';
  try{
    const photoUrl=await uploadAdminPlayerPhoto(document.getElementById('adminPlayerPhoto').files[0]);
    const payload={
      team_id:currentTeam.id,photo_url:photoUrl,
      first_name:v.adminPlayerFirstName,last_name:v.adminPlayerLastName,
      birth_date:v.adminPlayerBirthDate,birth_place:v.adminPlayerBirthPlace,
      residence_town:v.adminPlayerResidenceTown,residence_postal_code:v.adminPlayerPostalCode,
      residence_province:v.adminPlayerProvince.toUpperCase(),
      email:v.adminPlayerEmail.toLowerCase(),phone:v.adminPlayerPhone,
      fitp_ranking:v.adminPlayerFitp.toUpperCase(),
      medical_certificate_expiry:v.adminPlayerMedical,
      status:'approved',decided_at:new Date().toISOString(),
      created_at:new Date().toISOString()
    };
    const r=await sb.from('roster_requests').insert(payload).select('id').maybeSingle();
    if(r.error)throw r.error;
    if(!r.data?.id)throw new Error('Inserimento non confermato dal database.');
    ids.forEach(id=>document.getElementById(id).value='');
    document.getElementById('adminPlayerPhoto').value='';
    adminPlayerMessage(`${v.adminPlayerFirstName} ${v.adminPlayerLastName} inserito con profilo completo.`);
    await reloadAdminRoster();
  }catch(error){adminPlayerMessage(error.message||String(error),true)}
  finally{button.disabled=false;button.textContent='Inserisci giocatore'}
}

function openAdminPlayerEditor(playerId){
  const p=adminRosterCache.find(x=>x.id===playerId);
  if(!p)return adminPlayerMessage('Giocatore non trovato. Aggiorna la pagina.',true);
  editPlayerId.value=p.id;editPlayerFirstName.value=p.first_name||'';editPlayerLastName.value=p.last_name||'';editPlayerBirthDate.value=p.birth_date||'';editPlayerBirthPlace.value=p.birth_place||'';editPlayerResidenceTown.value=p.residence_town||'';editPlayerPostalCode.value=p.residence_postal_code||'';editPlayerProvince.value=p.residence_province||'';editPlayerEmail.value=p.email||'';editPlayerPhone.value=p.phone||'';editPlayerFitp.value=p.fitp_ranking||'';editPlayerMedical.value=p.medical_certificate_expiry||'';editPlayerStatus.value=p.status||'approved';editPlayerPhoto.value='';editPlayerMsg.classList.add('hidden');adminPlayerEditOverlay.classList.remove('hidden');
}
function closeAdminPlayerEditor(){adminPlayerEditOverlay.classList.add('hidden')}
function editPlayerMessage(text,error=false){editPlayerMsg.textContent=text;editPlayerMsg.className='notice '+(error?'err':'ok');editPlayerMsg.classList.remove('hidden')}
async function saveAdminPlayer(){
  const playerId=editPlayerId.value;
  const required={
    first_name:editPlayerFirstName.value.trim(),
    last_name:editPlayerLastName.value.trim(),
    birth_date:editPlayerBirthDate.value,
    birth_place:editPlayerBirthPlace.value.trim(),
    residence_town:editPlayerResidenceTown.value.trim(),
    residence_postal_code:editPlayerPostalCode.value.trim(),
    residence_province:editPlayerProvince.value.trim().toUpperCase(),
    email:editPlayerEmail.value.trim().toLowerCase(),
    phone:editPlayerPhone.value.trim(),
    fitp_ranking:editPlayerFitp.value.trim().toUpperCase(),
    medical_certificate_expiry:editPlayerMedical.value,
    status:editPlayerStatus.value
  };
  if(!playerId)return editPlayerMessage('Giocatore non selezionato.',true);
  if(Object.values(required).some(v=>!v))return editPlayerMessage('Compila tutti i dati obbligatori.',true);
  if(!/^\d{5}$/.test(required.residence_postal_code))return editPlayerMessage('Il CAP deve contenere 5 cifre.',true);
  saveAdminPlayerBtn.disabled=true;saveAdminPlayerBtn.textContent='Salvataggio…';
  try{
    const payload={...required};
    const photo=editPlayerPhoto.files[0];
    if(photo) payload.photo_url=await uploadAdminPlayerPhoto(photo);
    const r=await sb.from('roster_requests').update(payload).eq('id',playerId).eq('team_id',currentTeam.id).select('*').maybeSingle();
    if(r.error)throw r.error;
    if(!r.data?.id)throw new Error('Il database non ha confermato la modifica.');
    await reloadAdminRoster();
    editPlayerMessage('Giocatore aggiornato correttamente.');
    setTimeout(closeAdminPlayerEditor,450);
  }catch(e){editPlayerMessage(e.message||String(e),true)}
  finally{saveAdminPlayerBtn.disabled=false;saveAdminPlayerBtn.textContent='Salva modifiche'}
}
async function deleteAdminPlayer(playerId,playerName){
  if(!confirm(`Eliminare definitivamente ${playerName} dalla squadra?\n\nL’operazione non può essere annullata.`))return;
  try{
    const r=await sb.rpc('delete_player_safely',{p_player_id:playerId});
    if(r.error)throw r.error;
    adminPlayerMessage(r.data?.message||`${playerName} è stato eliminato dalla squadra.`);
    await reloadAdminRoster();
  }catch(e){adminPlayerMessage(e.message||String(e),true)}
}
window.openAdminPlayerEditor=openAdminPlayerEditor;window.closeAdminPlayerEditor=closeAdminPlayerEditor;window.saveAdminPlayer=saveAdminPlayer;window.deleteAdminPlayer=deleteAdminPlayer;

async function copyLink(url) {
  try {

}
