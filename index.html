<!doctype html><html lang="it"><head><title>V9 Campionato Admin</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#07111f;--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25;--blue:#16a8ff;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
main{max-width:1000px;margin:auto;padding:16px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.card{background:#10233bf5;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}label{display:block;font-size:13px;font-weight:800;margin-bottom:5px;color:#c8d7e6}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:#fff}button,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border:0;border-radius:12px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#07111f}.secondary{background:#17304e;color:#fff;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.success{border-color:#4ade80;background:#0b2a20}.error{border-color:#ef4444;background:#351316}.hidden{display:none!important}.team{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border:1px solid #315271;border-radius:15px;background:#09182a;margin:9px 0}.pill{padding:5px 9px;border-radius:999px;background:#203754;font-size:12px;font-weight:900}.nav{display:flex;gap:8px;margin-bottom:12px}.nav>*{flex:1}.request{padding:13px;border:1px solid #315271;border-radius:14px;background:#09182a;margin:8px 0}.request h3{margin:0 0 6px}.small{font-size:12px}
@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.team{grid-template-columns:1fr}.actions button,.actions a{flex:1}}
</style></head><body><main>
<div class="top"><div class="brand"><div class="logo">V9</div><div><h1 style="margin:0">Campionato · Admin</h1><div class="muted">Ambiente separato dai Tornei V8</div></div></div><span class="pill">TEST</span></div>
<div class="nav"><button class="secondary" onclick="history.back()">← Indietro</button><button class="secondary" onclick="location.href='index.html'">⌂ Home</button></div>
<section id="setup" class="card hidden"><h2>Configurazione mancante</h2><p>Compila <b>config.js</b> con URL e Publishable Key del Supabase V9 Test.</p></section>
<section id="auth" class="card"><h2>Accesso amministratore</h2><div class="row"><div class="field"><label>Email</label><input id="email" type="email" value="padelarenareggioemilia@gmail.com"></div><div class="field"><label>Password</label><input id="password" type="password"></div></div><div class="actions"><button id="login" class="primary">Accedi</button><button id="signup" class="secondary">Crea account admin</button></div><div id="msg" class="notice hidden"></div></section>
<section id="app" class="hidden">
<div class="card"><div class="actions"><button class="primary" id="newTeam">＋ Crea nuova squadra</button><button class="secondary" id="logout">Esci</button></div></div>
<div id="teamForm" class="card hidden"><h2>Nuova squadra</h2>
<div class="row"><div class="field"><label>Nome squadra *</label><input id="teamName"></div><div class="field"><label>Serie *</label><select id="series"><option>Serie A</option><option>Serie B</option><option>Serie C</option></select></div></div>
<div class="row"><div class="field"><label>Club</label><input id="clubName"></div><div class="field"><label>Indirizzo completo</label><input id="clubAddress"></div></div>
<div class="row"><div class="field"><label>Nome e cognome capitano *</label><input id="captainName"></div><div class="field"><label>Email capitano *</label><input id="captainEmail" type="email"></div></div>
<div class="field"><label>Telefono capitano</label><input id="captainPhone"></div>
<div class="actions"><button class="primary" id="saveTeam">Salva squadra</button><button class="secondary" id="cancelTeam">Annulla</button></div><div id="formMsg" class="notice hidden"></div></div>
<div class="card"><h2>Squadre</h2><div id="teams"></div></div>
</section>
<script>
const cfg=window.PAM_V9_CONFIG||{}, configured=cfg.supabaseUrl&&!cfg.supabaseUrl.includes('INCOLLA_QUI')&&cfg.supabasePublishableKey&&!cfg.supabasePublishableKey.includes('INCOLLA_QUI');
let sb=null,profile=null;
const $=id=>document.getElementById(id);
function showMsg(el,text,err=false){el.textContent=text;el.className='notice '+(err?'error':'success');el.classList.remove('hidden')}
if(!configured){$('setup').classList.remove('hidden');$('auth').classList.add('hidden')}else sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
async function enter(user){const r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.error)throw r.error;profile=r.data;if(profile.role!=='admin')throw new Error('Questo accesso è riservato all’amministratore.');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadTeams()}
async function loadTeams(){const r=await sb.from('teams').select('*').order('created_at');if(r.error)throw r.error;$('teams').innerHTML=r.data.length?r.data.map(t=>`<div class="team"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.series||'')} · ${esc(t.club_name||'')}</div><div class="small">${esc(t.captain_name||'')} · ${esc(t.captain_email||'')}</div></div><div class="actions"><button class="secondary" onclick="copyCaptain('${t.captain_invite_token}')">Link capitano</button><button class="secondary" onclick="copyPlayer('${t.player_invite_token}')">Link giocatori</button></div></div>`).join(''):'<div class="muted">Nessuna squadra.</div>'}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function copyText(text){try{await navigator.clipboard.writeText(text);alert('Link copiato')}catch{prompt('Copia il link:',text)}}
function copyCaptain(token){copyText(new URL('captain.html?invite='+encodeURIComponent(token),location.href).href)}
function copyPlayer(token){copyText(new URL('player.html?team='+encodeURIComponent(token),location.href).href)}
if(configured){
$('login').onclick=async()=>{try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await enter(r.data.user)}catch(e){showMsg($('msg'),e.message,true)}};
$('signup').onclick=async()=>{try{const r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{first_name:'Francesco',last_name:'Lignola'}}});if(r.error)throw r.error;showMsg($('msg'),r.data.session?'Account creato.':'Account creato: conferma l’email.');if(r.data.session)await enter(r.data.user)}catch(e){showMsg($('msg'),e.message,true)}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('newTeam').onclick=()=> $('teamForm').classList.remove('hidden');$('cancelTeam').onclick=()=> $('teamForm').classList.add('hidden');
$('saveTeam').onclick=async()=>{try{const payload={name:$('teamName').value.trim(),series:$('series').value,club_name:$('clubName').value.trim(),club_address:$('clubAddress').value.trim(),captain_name:$('captainName').value.trim(),captain_email:$('captainEmail').value.trim().toLowerCase(),captain_phone:$('captainPhone').value.trim(),created_by:profile.id};if(!payload.name||!payload.captain_name||!payload.captain_email)throw new Error('Compila i campi obbligatori.');const r=await sb.from('teams').insert(payload);if(r.error)throw r.error;showMsg($('formMsg'),'Squadra salvata online.');setTimeout(()=>{$('teamForm').classList.add('hidden');loadTeams()},500)}catch(e){showMsg($('formMsg'),e.message,true)}};
sb.auth.getSession().then(async r=>{if(r.data.session)try{await enter(r.data.session.user)}catch(e){showMsg($('msg'),e.message,true)}})
}
</script></main></body></html>
