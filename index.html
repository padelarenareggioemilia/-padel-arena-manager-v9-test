<!doctype html><html lang="it"><head><title>V9.1 Campionato</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111f"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#06111f;--panel:#102842;--line:#315a7d;--text:#f7fafc;--muted:#a9bbce;--lime:#9dff1f;--blue:#1cb5ff;--red:#ff4d5e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06111f,#040b13);color:var(--text);font-family:system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:14px 14px 80px}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 16px}.brand{display:flex;align-items:center;gap:14px}.mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--lime),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.muted{color:var(--muted)}h1{font-size:clamp(30px,5vw,46px);margin:0}.card{background:linear-gradient(180deg,#102842,#091b2d);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0}.top{position:sticky;top:0;z-index:10;background:#06111fed;backdrop-filter:blur(10px);padding:10px;border:1px solid var(--line);border-radius:18px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--lime);color:#07111f}.secondary{background:#193957;color:#fff;border:1px solid #416b91}.danger{background:#7c1f2a;color:#fff;border:1px solid var(--red)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{margin:9px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #416b91;background:#071522;color:#fff}textarea{min-height:85px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:12px;border-radius:13px;background:#071522;border:1px solid var(--line);margin:10px 0}.ok{border-color:#42e58a}.err{border-color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{padding:14px;border-radius:16px;background:#0a1d31;border:1px solid var(--line)}.kpi strong{display:block;font-size:25px;color:var(--lime)}.team{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:17px;background:#091a2b;margin:9px 0}.logo{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:15px;padding:4px}.placeholder{width:76px;height:76px;border-radius:15px;display:grid;place-items:center;background:#173653;font-size:28px}.meta{font-size:13px;color:var(--muted);line-height:1.5}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#1b3b59;font-size:11px;font-weight:900}.preview{width:120px;height:120px;border:1px dashed #5b82a5;border-radius:17px;display:grid;place-items:center;overflow:hidden;background:#071522}.preview img{width:100%;height:100%;object-fit:contain;background:white}@media(max-width:800px){.grid2,.kpis{grid-template-columns:1fr}.team{grid-template-columns:64px 1fr}.team>.actions{grid-column:1/-1}.logo,.placeholder{width:60px;height:60px}.actions .btn{flex:1}}
</style></head><body><main class="shell"><header class="hero"><div class="brand"><div class="mark">V9.1</div><div><h1>Campionato · Admin</h1><div class="muted">Configurazione squadre in stile V8, dati online V9</div></div></div><span class="badge">SUPABASE CONNESSO</span></header><div class="top"><div class="nav"><button class="btn secondary" onclick="history.length>1?history.back():location.href='index.html'">← Indietro</button><button class="btn secondary" onclick="location.href='index.html'">⌂ Home</button><button class="btn secondary" onclick="menu.classList.toggle('hidden')">☰ Menu</button></div><div id="menu" class="actions hidden" style="margin-top:8px"><button class="btn primary" onclick="openForm()">Nuova squadra</button><button class="btn secondary" onclick="loadTeams()">Aggiorna</button><button class="btn danger" onclick="logout()">Esci</button></div></div><section class="kpis"><div class="kpi"><strong id="nTeams">0</strong>Squadre</div><div class="kpi"><strong id="nActive">0</strong>Accessi capitano attivi</div><div class="kpi"><strong id="nReq">0</strong>Richieste in attesa</div></section><section class="card"><div class="actions" style="justify-content:space-between"><div><h2 style="margin:0">Squadre del campionato</h2><div class="muted">Crea, modifica, assegna capitano, logo e link.</div></div><button class="btn primary" onclick="openForm()">＋ Crea nuova squadra</button></div></section><section id="editor" class="card hidden"><div class="actions" style="justify-content:space-between"><h2 id="title">Crea nuova squadra</h2><button class="btn secondary" onclick="closeForm()">Chiudi</button></div><form id="form"><div class="grid2"><div><h3>Dati squadra</h3><div class="field"><label>Nome squadra *</label><input id="name" required></div><div class="grid2"><div class="field"><label>Serie *</label><select id="series"><option>Serie A</option><option>Serie B</option><option selected>Serie C</option><option>Serie D</option></select></div><div class="field"><label>Colori sociali</label><input id="colors"></div></div><div class="field"><label>Club / società</label><input id="club"></div><div class="field"><label>Codice fiscale / P. IVA</label><input id="fiscal"></div><div class="field"><label>Indirizzo club</label><input id="address"></div><div class="grid2"><div class="field"><label>Comune</label><input id="city"></div><div class="field"><label>Provincia</label><input id="province" maxlength="2"></div></div><div class="field"><label>Campo di casa</label><input id="court"></div></div><div><h3>Logo e capitano</h3><div class="actions" style="align-items:center"><div id="preview" class="preview">LOGO</div><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label>Nome capitano *</label><input id="captain" required></div><div class="field"><label>Email capitano *</label><input id="captainEmail" type="email" required></div><div class="field"><label>Telefono capitano</label><input id="phone"></div><div class="grid2"><div class="field"><label>Vice capitano</label><input id="vice"></div><div class="field"><label>Email vice</label><input id="viceEmail" type="email"></div></div><label class="notice"><input id="enabled" type="checkbox" checked style="width:auto"> Abilita accesso capitano</label></div></div><div class="field"><label>Note</label><textarea id="notes"></textarea></div><div id="formMsg" class="notice hidden"></div><div class="actions"><button class="btn primary" type="submit" id="save">Salva squadra</button><button class="btn secondary" type="button" onclick="closeForm()">Annulla</button></div></form></section><section class="card"><div id="teams"></div></section><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=i=>document.getElementById(i);let me,editId=null,file=null;const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));function note(t,e=false){$('formMsg').textContent=t;$('formMsg').className='notice '+(e?'err':'ok');$('formMsg').classList.remove('hidden')}async function guard(){let q=await s.auth.getSession();if(!q.data.session)return location.href='login.html';let r=await s.from('profiles').select('*').eq('id',q.data.session.user.id).single();if(r.error||r.data.role!=='admin'){await s.auth.signOut();return location.href='login.html'}me=r.data}function reset(){editId=null;file=null;$('form').reset();$('enabled').checked=true;$('preview').innerHTML='LOGO';$('title').textContent='Crea nuova squadra';$('save').textContent='Salva squadra';$('formMsg').classList.add('hidden')}function openForm(t=null){reset();$('editor').classList.remove('hidden');if(t){editId=t.id;$('title').textContent='Modifica squadra';$('save').textContent='Salva modifiche';let map={name:'name',series:'series',club:'club_name',address:'club_address',city:'club_city',province:'club_province',fiscal:'club_fiscal_code',court:'home_court',colors:'team_colors',captain:'captain_name',captainEmail:'captain_email',phone:'captain_phone',vice:'vice_captain_name',viceEmail:'vice_captain_email',notes:'notes'};for(let k in map)$(k).value=t[map[k]]||'';$('enabled').checked=t.captain_access_enabled!==false;if(t.logo_url)$('preview').innerHTML=`<img src="${esc(t.logo_url)}">`}$('editor').scrollIntoView({behavior:'smooth'})}function closeForm(){$('editor').classList.add('hidden');reset()}async function upload(id){if(!file)return null;let ext=file.name.split('.').pop();let path=`teams/${id}/${Date.now()}.${ext}`;let r=await s.storage.from('team-logos').upload(path,file,{upsert:true});if(r.error)throw r.error;return s.storage.from('team-logos').getPublicUrl(path).data.publicUrl}async function saveTeam(){let p={name:$('name').value.trim(),series:$('series').value,club_name:$('club').value.trim(),club_address:$('address').value.trim(),club_city:$('city').value.trim(),club_province:$('province').value.trim().toUpperCase(),club_fiscal_code:$('fiscal').value.trim(),home_court:$('court').value.trim(),team_colors:$('colors').value.trim(),captain_name:$('captain').value.trim(),captain_email:$('captainEmail').value.trim().toLowerCase(),captain_phone:$('phone').value.trim(),vice_captain_name:$('vice').value.trim(),vice_captain_email:$('viceEmail').value.trim().toLowerCase(),notes:$('notes').value.trim(),captain_access_enabled:$('enabled').checked,created_by:me.id,updated_at:new Date().toISOString()};if(!p.name||!p.captain_name||!p.captain_email)return note('Compila i campi obbligatori.',true);try{let r=editId?await s.from('teams').update(p).eq('id',editId).select().single():await s.from('teams').insert(p).select().single();if(r.error)throw r.error;let url=await upload(r.data.id);if(url){let u=await s.from('teams').update({logo_url:url}).eq('id',r.data.id);if(u.error)throw u.error}note(editId?'Squadra aggiornata.':'Squadra salvata online.');await loadTeams();setTimeout(closeForm,600)}catch(e){note(e.message,true)}}async function loadTeams(){let r=await s.from('teams').select('*').order('created_at',{ascending:false});if(r.error)return $('teams').innerHTML=`<div class="notice err">${esc(r.error.message)}</div>`;let a=r.data||[];$('nTeams').textContent=a.length;$('nActive').textContent=a.filter(x=>x.captain_access_enabled!==false).length;let q=await s.from('roster_requests').select('id',{count:'exact',head:true}).eq('status','pending');$('nReq').textContent=q.count||0;$('teams').innerHTML=a.length?a.map(t=>{let c=new URL(`captain.html?invite=${encodeURIComponent(t.captain_invite_token)}`,location.href).href,p=new URL(`player.html?team=${encodeURIComponent(t.player_invite_token)}`,location.href).href;return `<article class="team">${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:`<div class="placeholder">🏆</div>`}<div><b style="font-size:20px">${esc(t.name)}</b><div class="meta"><b>${esc(t.series||'')}</b> · ${esc(t.club_name||'')}<br>${esc(t.club_city||'')} ${t.club_province?'('+esc(t.club_province)+')':''}<br>Capitano: <b>${esc(t.captain_name||'')}</b> · ${esc(t.captain_email||'')}<br><span class="badge">${t.captain_access_enabled===false?'Accesso disabilitato':'Accesso attivo'}</span></div></div><div class="actions"><button class="btn secondary" onclick='copy(${JSON.stringify(c)})'>Link capitano</button><button class="btn secondary" onclick='copy(${JSON.stringify(p)})'>Link giocatori</button><button class="btn primary" onclick='edit(${JSON.stringify(t.id)})'>Modifica</button><button class="btn danger" onclick='del(${JSON.stringify(t.id)},${JSON.stringify(t.name)})'>Elimina</button></div></article>`}).join(''):'<div class="notice">Nessuna squadra.</div>'}async function copy(u){try{await navigator.clipboard.writeText(u);alert('Link copiato')}catch{prompt('Copia il link:',u)}}async function edit(id){let r=await s.from('teams').select('*').eq('id',id).single();if(r.error)alert(r.error.message);else openForm(r.data)}async function del(id,n){if(!confirm(`Eliminare definitivamente "${n}"?`))return;let r=await s.from('teams').delete().eq('id',id);if(r.error)alert(r.error.message);else loadTeams()}async function logout(){await s.auth.signOut();location.href='login.html'}$('form').onsubmit=e=>{e.preventDefault();saveTeam()};$('logoFile').onchange=e=>{file=e.target.files[0]||null;if(file)$('preview').innerHTML=`<img src="${URL.createObjectURL(file)}">`};(async()=>{await guard();await loadTeams()})();
</script></main></body></html>
