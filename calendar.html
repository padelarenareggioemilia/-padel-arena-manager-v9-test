<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario automatico</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#06111f;--panel:#10233b;--panel2:#09182a;--line:#315676;--text:#f8fafc;--muted:#a9bacd;--lime:#9dff25;--blue:#16a8ff;--red:#ef4444;--amber:#f6c453}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#123f61,transparent 34%),linear-gradient(180deg,#06111f,#040b14);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.shell{max-width:1200px;margin:auto;padding:16px 14px 90px}.hero{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:13px}.mark{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--lime),var(--blue));display:grid;place-items:center;color:#07111f;font-weight:1000}.muted{color:var(--muted)}
.card,.top{background:rgba(16,35,59,.97);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--lime);color:#07111f}.secondary{background:#17304e;color:#fff;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:#fff}.ghost{background:transparent;color:#fff;border:1px solid #3c5d7d}.blue{background:var(--blue);color:#06111f}.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin:9px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #365474;background:#071523;color:#fff;font:inherit}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.ok{border-color:#4ade80;background:#0b2a20}.err{border-color:#ef4444;background:#351316}
.comp-logo{width:125px;height:125px;object-fit:contain;background:#fff;border-radius:18px;padding:4px}.group{border:1px solid #3b5e80;background:#09182a;border-radius:18px;padding:14px;margin:10px 0}.team-pill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:12px;background:#10233b;border:1px solid #315676;margin:7px 0}.fixture{display:grid;grid-template-columns:130px 1fr 180px 150px auto;gap:10px;align-items:center;padding:11px;border:1px solid #315676;border-radius:14px;background:#09182a;margin:8px 0}.small{font-size:12px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#17304e;border:1px solid #416b91;font-size:12px;font-weight:900}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:850px){.grid2,.grid3{grid-template-columns:1fr}.fixture{grid-template-columns:1fr}.fixture .btn{width:100%}.hero{align-items:flex-start}.comp-logo{width:95px;height:95px}}
</style><style>
:root{
  --aics-blue:#164a95;
  --aics-blue-dark:#082f68;
  --aics-blue-soft:#2e6fba;
  --italy-green:#009246;
  --italy-red:#ce2b37;
  --bg:#f4f8fc;
  --panel:#ffffff;
  --panel-soft:#edf4fb;
  --text:#0a2e5e;
  --muted:#627b97;
  --line:#b9cde3;
  --shadow:0 14px 34px rgba(8,47,104,.13);
}
html{background:var(--bg)}
body{
  color:var(--text)!important;
  background:
    linear-gradient(90deg,rgba(0,146,70,.05),transparent 23%,transparent 77%,rgba(206,43,55,.05)),
    radial-gradient(circle at 50% 0%,rgba(22,74,149,.12),transparent 34%),
    var(--bg)!important;
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto 0;
  height:6px;
  z-index:9999;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
}
.hero{
  background:linear-gradient(135deg,var(--aics-blue),var(--aics-blue-dark))!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.25)!important;
  border-radius:24px!important;
  padding:18px!important;
  box-shadow:var(--shadow)!important;
}
.hero .muted{color:#d9e6f5!important}
.brand-logo{
  width:132px;
  height:78px;
  object-fit:contain;
  padding:8px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}
.mark{display:none!important}
.top,.card,.comp,.group,.comp-card{
  background:rgba(255,255,255,.98)!important;
  color:var(--text)!important;
  border:1px solid var(--line)!important;
  box-shadow:var(--shadow)!important;
}
.primary{background:linear-gradient(135deg,var(--aics-blue-soft),var(--aics-blue))!important;color:#fff!important}
.secondary{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--aics-blue-soft)!important}
.blue{background:var(--aics-blue)!important;color:#fff!important}
.danger{background:var(--italy-red)!important;color:#fff!important}
.ghost{background:#fff!important;color:var(--aics-blue)!important;border:1px solid var(--line)!important}
input,select,textarea{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
label{color:var(--aics-blue-dark)!important}
.notice{background:var(--panel-soft)!important;color:var(--text)!important;border-color:var(--line)!important}
.ok{background:#eaf8f0!important;border-color:var(--italy-green)!important}
.err{background:#fdecef!important;border-color:var(--italy-red)!important}
.kpi,.team,.fixture,.team-pill,.mini-team,.request{
  background:#fff!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
  box-shadow:0 8px 20px rgba(8,47,104,.07)!important;
}
.kpi strong{color:var(--aics-blue)!important}
.filter{background:#fff!important;color:var(--aics-blue-dark)!important;border:1px solid var(--line)!important}
.filter.active{
  color:#fff!important;
  border-color:var(--aics-blue)!important;
  background:linear-gradient(90deg,var(--italy-green),var(--aics-blue),var(--italy-red))!important;
}
.badge{background:#e8f1fb!important;color:var(--aics-blue-dark)!important;border-color:var(--line)!important}
.logo,.big-logo,.mini-logo,.comp-logo,.comp img{background:#fff!important;border-color:#dce6f2!important}
.placeholder{background:linear-gradient(135deg,#e8f1fb,#fff)!important;color:var(--aics-blue)!important}
.more-menu,.dialog-card{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
.more-menu .delete-item{background:#fff4f5!important;color:var(--italy-red)!important}
.tricolore{
  height:5px;
  border-radius:999px;
  margin:10px 0 0;
  background:linear-gradient(90deg,var(--italy-green) 0 33.333%,#fff 33.333% 66.666%,var(--italy-red) 66.666%);
  border:1px solid #d7e3ef;
}
.section-ribbon{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  font-weight:900;
  color:var(--aics-blue-dark);
  border:1px solid #d7e3ef;
  background:linear-gradient(90deg,rgba(0,146,70,.12),rgba(255,255,255,.95),rgba(206,43,55,.12));
}
@media(max-width:800px){
  .brand-logo{width:100px;height:62px}
}
</style></head><body><main class="shell">
<div class="top"><div class="nav"><button class="btn secondary" onclick="history.back()">← Indietro</button><button class="btn secondary" onclick="location.href='index.html'">⌂ Home</button><button class="btn secondary" onclick="location.href='groups.html'">Gironi</button><button class="btn secondary" onclick="location.href='competitions.html'">Competizioni</button></div></div>
<header class="hero"><div class="brand"><img class="brand-logo" src="assets/aics-logo.png" alt="AICS"><div><h1 style="margin:0">Calendario automatico</h1><div class="muted">Generazione automatica e modifica manuale in qualsiasi momento</div></div></div></header><div class="tricolore"></div>
<section class="card"><div class="grid3"><div class="field"><label>Competizione</label><select id="competition"><option value="SERIE_A">Serie A</option><option value="SERIE_B">Serie B</option><option value="SERIE_C">Serie C</option><option value="COPPA_ITALIA">Coppa Italia</option></select></div><div class="field"><label>Data di partenza</label><input id="startDate" type="date"></div><div class="field"><label>Intervallo giornate</label><select id="interval"><option value="1">Ogni settimana</option><option value="2">Ogni 2 settimane</option></select></div></div>
<label class="notice"><input id="returnLeg" type="checkbox" checked style="width:auto"> Genera anche il girone di ritorno</label>
<div class="actions"><button class="btn primary" onclick="generateCalendar()">Genera calendario gironi</button><button class="btn blue" onclick="generateFinals()">Genera playoff/playout e fasi finali Eden</button><button class="btn secondary" onclick="generateSupercup()">Genera Supercoppa</button><button class="btn secondary" onclick="loadFixtures()">Aggiorna</button></div><div id="msg" class="notice hidden"></div></section>
<section class="card"><div class="notice"><b>Regola fasi finali:</b> playoff, playout, semifinali e finali di Coppa Italia vengono programmati all’Eden Padel Club, la domenica dalle ore 10:00 in avanti. Tutte le date restano modificabili dall’amministratore.</div><div id="fixtures"></div></section>
<script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=i=>document.getElementById(i);let teams=[],groups=[],members=[],fixtures=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function msg(t,e=false){$('msg').textContent=t;$('msg').className='notice '+(e?'err':'ok');$('msg').classList.remove('hidden')}
async function guard(){let q=await s.auth.getSession();if(!q.data.session)return location.href='login.html'}
function codeName(c){return c==='SERIE_A'?'Serie A':c==='SERIE_B'?'Serie B':c==='SERIE_C'?'Serie C':c==='COPPA_ITALIA'?'Coppa Italia':'Supercoppa'}
function dayIndex(day){return {'Domenica':0,'Lunedì':1,'Martedì':2,'Mercoledì':3,'Giovedì':4,'Venerdì':5,'Sabato':6}[day]??0}
function nextHomeDate(base,team,weekOffset){let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+weekOffset*7);let target=dayIndex(team.home_match_day||'Domenica');while(d.getDay()!==target)d.setDate(d.getDate()+1);let tm=String(team.home_match_time||'20:30').slice(0,5).split(':');d.setHours(+tm[0],+tm[1],0,0);return d.toISOString()}
function roundRobin(arr){let a=[...arr];if(a.length%2)a.push(null);let n=a.length,rounds=[];for(let r=0;r<n-1;r++){let pairs=[];for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i];if(x&&y)pairs.push(r%2?[y,x]:[x,y])}rounds.push(pairs);a.splice(1,0,a.pop())}return rounds}
async function fetchData(){
 let code=$('competition').value;
 let [tr,gr,mr,fr]=await Promise.all([s.from('teams').select('*'),s.from('competition_groups').select('*').eq('competition_code',code).order('sort_order'),s.from('competition_group_teams').select('*'),s.from('fixtures').select('*').eq('competition_code',code).order('scheduled_at')]);
 teams=tr.data||[];groups=gr.data||[];members=(mr.data||[]).filter(m=>groups.some(g=>g.id===m.group_id));fixtures=fr.data||[]
}
async function generateCalendar(){
 if(!$('startDate').value)return msg('Inserisci la data di partenza.',true);await fetchData();if(!groups.length)return msg('Prima devi creare i gironi.',true);
 if(!confirm('Rigenerare il calendario dei gironi? Le partite di fase Girone della competizione saranno sostituite.'))return;
 await s.from('fixtures').delete().eq('competition_code',$('competition').value).eq('phase','Girone');
 let payload=[],interval=+$('interval').value,returnLeg=$('returnLeg').checked;
 groups.forEach(g=>{let ts=members.filter(m=>m.group_id===g.id).map(m=>teams.find(t=>t.id===m.team_id)).filter(Boolean);let rounds=roundRobin(ts);rounds.forEach((pairs,ri)=>pairs.forEach(([home,away])=>payload.push({competition_code:$('competition').value,phase:'Girone',group_id:g.id,round_number:ri+1,home_team_id:home.id,away_team_id:away.id,scheduled_at:nextHomeDate($('startDate').value,home,ri*interval),venue:home.home_court||home.club_name||'Campo da definire'})));if(returnLeg)rounds.forEach((pairs,ri)=>pairs.forEach(([a,b])=>payload.push({competition_code:$('competition').value,phase:'Girone',group_id:g.id,round_number:rounds.length+ri+1,home_team_id:b.id,away_team_id:a.id,scheduled_at:nextHomeDate($('startDate').value,b,(rounds.length+ri)*interval),venue:b.home_court||b.club_name||'Campo da definire'}))) });
 let r=await s.from('fixtures').insert(payload);if(r.error)return msg(r.error.message,true);msg('Calendario generato.');loadFixtures()
}
function nextSunday(base,offsetWeeks=0){let d=new Date(base+'T10:00:00');while(d.getDay()!==0)d.setDate(d.getDate()+1);d.setDate(d.getDate()+offsetWeeks*7);return d}
async function generateFinals(){
 let code=$('competition').value;if(!['SERIE_A','SERIE_B','SERIE_C','COPPA_ITALIA'].includes(code))return;
 if(!confirm('Creare le fasi finali all’Eden Padel Club?'))return;
 await s.from('fixtures').delete().eq('competition_code',code).in('phase',['Playoff','Playout','Semifinale','Finale']);
 let base=$('startDate').value||new Date().toISOString().slice(0,10),items=[];
 if(code==='COPPA_ITALIA'){let d=nextSunday(base,0);['Semifinale 1','Semifinale 2'].forEach((x,i)=>{let z=new Date(d);z.setHours(10+i*2,0);items.push({competition_code:code,phase:'Semifinale',home_placeholder:x+' - squadra 1',away_placeholder:x+' - squadra 2',scheduled_at:z.toISOString(),venue:'Eden Padel Club'})});let f=nextSunday(base,1);f.setHours(10,0);items.push({competition_code:code,phase:'Finale',home_placeholder:'Vincente Semifinale 1',away_placeholder:'Vincente Semifinale 2',scheduled_at:f.toISOString(),venue:'Eden Padel Club'})}
 else{let d=nextSunday(base,0);[['Playoff','Playoff - squadra 1','Playoff - squadra 2'],['Playout','Playout - squadra 1','Playout - squadra 2']].forEach((x,i)=>{let z=new Date(d);z.setHours(10+i*2,0);items.push({competition_code:code,phase:x[0],home_placeholder:x[1],away_placeholder:x[2],scheduled_at:z.toISOString(),venue:'Eden Padel Club'})});let f=nextSunday(base,1);f.setHours(10,0);items.push({competition_code:code,phase:'Finale',home_placeholder:'Finalista 1',away_placeholder:'Finalista 2',scheduled_at:f.toISOString(),venue:'Eden Padel Club'})}
 let r=await s.from('fixtures').insert(items);if(r.error)return msg(r.error.message,true);msg('Fasi finali create all’Eden.');loadFixtures()
}
async function generateSupercup(){
 let base=$('startDate').value||new Date().toISOString().slice(0,10),d=nextSunday(base,0);d.setHours(10,0);
 await s.from('fixtures').delete().eq('competition_code','SUPERCOPPA');
 let r=await s.from('fixtures').insert({competition_code:'SUPERCOPPA',phase:'Finale',home_placeholder:'Vincitrice Campionato',away_placeholder:'Vincitrice Coppa Italia',scheduled_at:d.toISOString(),venue:'Eden Padel Club'});
 if(r.error)return msg(r.error.message,true);msg('Supercoppa creata.');$('competition').value='SUPERCOPPA';loadFixtures()
}
async function loadFixtures(){
 await fetchData();let byId=Object.fromEntries(teams.map(t=>[t.id,t.name]));$('fixtures').innerHTML=fixtures.map(f=>`<div class="fixture"><span class="badge">${esc(f.phase)}${f.round_number?' · G'+f.round_number:''}</span><div><b>${esc(byId[f.home_team_id]||f.home_placeholder||'Da definire')}</b><br><span class="muted">contro</span><br><b>${esc(byId[f.away_team_id]||f.away_placeholder||'Da definire')}</b></div><input type="datetime-local" value="${f.scheduled_at?new Date(f.scheduled_at).toISOString().slice(0,16):''}" onchange="updateFixture('${f.id}','scheduled_at',this.value)"><input value="${esc(f.venue||'')}" onchange="updateFixture('${f.id}','venue',this.value)"><button class="btn danger" onclick="deleteFixture('${f.id}')">Elimina</button></div>`).join('')||'<div class="notice">Nessuna partita programmata.</div>'
}
async function updateFixture(id,k,v){let p={updated_at:new Date().toISOString()};p[k]=k==='scheduled_at'&&v?new Date(v).toISOString():v;let r=await s.from('fixtures').update(p).eq('id',id);if(r.error)alert(r.error.message)}
async function deleteFixture(id){if(!confirm('Eliminare questa partita?'))return;let r=await s.from('fixtures').delete().eq('id',id);if(r.error)alert(r.error.message);else loadFixtures()}
$('competition').onchange=loadFixtures;guard().then(loadFixtures);
</script></main></body></html>
