<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partite Capitano</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{font-family:system-ui;background:#f4f8fc;color:#0a2e5e}.shell{width:min(1050px,calc(100% - 24px));margin:auto}.hero,.card{background:#fff;border:1px solid #b9cde3;border-radius:20px;padding:18px;margin:12px}.hero{background:#164a95;color:#fff}.fixture{display:grid;grid-template-columns:90px 130px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid #b9cde3;border-radius:14px;margin:8px}.comp{width:84px;height:64px;object-fit:contain}.team{display:flex;gap:8px;align-items:center;margin:5px}.team img{width:38px;height:38px;object-fit:contain}.muted{color:#627b97}.btn{padding:10px;border:1px solid #164a95;background:#fff;color:#164a95;border-radius:10px;font-weight:900}@media(max-width:700px){.fixture{grid-template-columns:1fr}.comp{margin:auto}}</style></head><body><main class="shell"><button class="btn" onclick="history.back()">← Indietro</button><section class="hero"><h1>Partite complete della squadra</h1><div id="teamTitle"></div></section><section class="card"><div id="status">Caricamento…</div><div id="list"></div></section></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),A=x=>Array.isArray(x)?x:[];const labels={SERIE_A:'Serie A',SERIE_B:'Serie B',SERIE_C:'Serie C',COPPA_ITALIA:'Coppa Italia',SUPERCOPPA:'Supercoppa'},logos={SERIE_A:'assets/serie-a.png',SERIE_B:'assets/serie-b.png',SERIE_C:'assets/serie-c.png',COPPA_ITALIA:'assets/coppa-italia.png',SUPERCOPPA:'assets/supercoppa.png'};
(async()=>{try{const r=await s.rpc('get_my_captain_portal');if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data,teams=A(d.teams),sts=A(d.statuses);teamTitle.textContent=d.team?.name||'';const T=id=>teams.find(x=>x.id===id)||{name:'Squadra'},W=id=>sts.find(x=>x.fixture_id===id)?.workflow_data||{},S=f=>{const x=W(f.id).result_data||W(f.id).result;if(!x)return null;const h=Number(x.home_score??x.home_matches??x.home),a=Number(x.away_score??x.away_matches??x.away);return Number.isFinite(h)&&Number.isFinite(a)?{h,a}:null};list.innerHTML=A(d.fixtures).map(f=>{const code=f.competition_code||f.competition||'COMPETIZIONE',h=T(f.home_team_id),a=T(f.away_team_id),sc=S(f);return `<div class="fixture"><img class="comp" src="${logos[code]||'assets/aics-logo.png'}" onerror="this.src='assets/aics-logo.png'"><div><b>${labels[code]||code}</b><div class="muted">${f.stage_name||f.round_name||'Fase'}<br>${new Date(f.scheduled_at).toLocaleString('it-IT')}</div></div><div><div class="team">${h.logo_url?`<img src="${h.logo_url}">`:''}<b>${h.name}</b></div><div class="team">${a.logo_url?`<img src="${a.logo_url}">`:''}<b>${a.name}</b></div></div><b>${sc?sc.h+' – '+sc.a:'Da giocare'}</b></div>`}).join('')||'Nessuna partita';status.textContent='Partite caricate.'}catch(e){status.textContent='Errore: '+(e.message||e)}})();</script></body></html>
