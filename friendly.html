<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partite amichevoli · AICS Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--txt:#0a2e5e;--muted:#627b97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--txt)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%);z-index:5}.shell{max-width:1100px;margin:auto;padding:22px 14px 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:11px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff}.success{background:var(--g);color:#fff}.danger{background:var(--r);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.field{margin:8px 0}.muted{color:var(--muted)}.notice{padding:10px;border-radius:10px;background:#edf4fb;border:1px solid var(--line);margin:8px 0}.match{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.hidden{display:none}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{border-bottom:1px solid var(--line);padding:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.roles{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><h1 style="margin:0">Partite amichevoli</h1><div>Sezione separata dal campionato ufficiale: inviti, rose copiate, distinte, QR e risultati senza effetti su classifiche o fasi finali.</div></section>
<section id="status" class="card">Caricamento…</section>
<section id="app" class="hidden">
<div class="grid">
<section class="card"><h2>Invita una squadra</h2><div class="field"><label>La tua squadra</label><select id="myTeam"></select></div><div class="field"><label>Squadra da invitare</label><select id="otherTeam"></select></div><div class="field"><label>Data e ora</label><input id="when" type="datetime-local"></div><div class="field"><label>Luogo</label><input id="venue" placeholder="Impianto / indirizzo"></div><div class="field"><label>Messaggio</label><textarea id="msg"></textarea></div><button class="btn primary" onclick="sendInvite()">Invia invito</button></section>
<section class="card"><h2>Inviti ricevuti</h2><div id="invites"></div></section>
</div>
<section class="card"><h2>Le mie amichevoli</h2><div id="matches"></div></section>
<section id="detail" class="card hidden"></section>
</section>
</main>
<script>
const cfg=window.PAM_V9_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let hub={};
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function teamName(id){return (hub.teams||[]).find(t=>t.id===id)?.name||'Squadra'}
async function load(){const s=await sb.auth.getSession();if(!s.data.session){location.href='login.html';return}const r=await sb.rpc('friendly_get_hub');if(r.error){status.textContent='Errore: '+r.error.message;return}hub=Array.isArray(r.data)?r.data[0]:r.data||{};render();status.textContent='Sezione amichevoli attiva';app.classList.remove('hidden')}
function render(){myTeam.innerHTML=(hub.my_teams||[]).map(t=>`<option value="${t.id}">${esc(t.name)} · ${esc(t.series||'')} · ${esc(t.role||'')}</option>`).join('');otherTeam.innerHTML=(hub.teams||[]).map(t=>`<option value="${t.id}">${esc(t.name)} · ${esc(t.series||'')}</option>`).join('');const mine=new Set((hub.my_teams||[]).map(t=>t.id));invites.innerHTML=(hub.invitations||[]).filter(i=>i.status==='pending'&&mine.has(i.invited_team_id)).map(i=>`<div class="match"><b>${esc(teamName(i.inviter_team_id))}</b><div>${i.proposed_at?new Date(i.proposed_at).toLocaleString('it-IT'):'Data da definire'}</div><div class="muted">${esc(i.venue||'')}</div><div class="actions"><button class="btn success" onclick="respond('${i.id}',true)">Accetta</button><button class="btn danger" onclick="respond('${i.id}',false)">Rifiuta</button></div></div>`).join('')||'<div class="notice">Nessun invito in attesa.</div>';matches.innerHTML=(hub.matches||[]).map(m=>`<div class="match"><b>${esc(m.home_team_name)} - ${esc(m.away_team_name)}</b><div>${m.scheduled_at?new Date(m.scheduled_at).toLocaleString('it-IT'):'Data da definire'}</div><div class="muted">${esc(m.venue||'')}</div><button class="btn primary" onclick="openMatch('${m.id}')">Gestisci amichevole</button></div>`).join('')||'<div class="notice">Nessuna amichevole creata.</div>'}
async function sendInvite(){if(myTeam.value===otherTeam.value)return alert('Scegli una squadra diversa.');const r=await sb.rpc('friendly_create_invitation',{p_inviter_team_id:myTeam.value,p_invited_team_id:otherTeam.value,p_proposed_at:when.value?new Date(when.value).toISOString():null,p_venue:venue.value.trim(),p_message:msg.value.trim()});if(r.error)return alert(r.error.message);alert('Invito inviato.');await load()}
async function respond(id,ok){const r=await sb.rpc('friendly_respond_invitation',{p_invitation_id:id,p_accept:ok});if(r.error)return alert(r.error.message);alert(ok?'Amichevole creata.':'Invito rifiutato.');await load()}
function opts(sel=''){return ['','M1','M2','Misto','Femminile','Riserva'].map(v=>`<option value="${v}" ${v===sel?'selected':''}>${v||'—'}</option>`).join('')}
async function openMatch(id){const r=await sb.rpc('friendly_get_match_detail',{p_friendly_match_id:id});if(r.error)return alert(r.error.message);const d=Array.isArray(r.data)?r.data[0]:r.data;if(d.error)return alert(d.error);const m=d.match,myIds=new Set((hub.my_teams||[]).map(t=>t.id)),side=myIds.has(m.source_home_team_id)?'home':'away',teamId=side==='home'?m.source_home_team_id:m.source_away_team_id,players=(d.players||[]).filter(p=>p.side===side),lineup=(d.lineups||[]).find(l=>l.side===side),saved=(d.lineup_players||[]).filter(x=>x.lineup_id===lineup?.id);detail.dataset.match=id;detail.dataset.team=teamId;detail.innerHTML=`<h2>${esc(m.home_team_name)} - ${esc(m.away_team_name)}</h2><div class="notice"><b>Ambiente amichevole separato.</b><br>Nessun dato di questa partita modifica classifica o fasi finali del campionato.</div><h3>Distinta</h3>${players.map(p=>{const rs=saved.filter(x=>x.friendly_player_id===p.id).map(x=>x.position);return `<div class="player" data-player="${p.id}"><b>${esc(p.first_name)} ${esc(p.last_name)}</b><div class="muted">${esc(p.fitp_ranking||'')}</div><div class="roles"><div><label>1° incontro</label><select class="role1">${opts(rs[0])}</select></div><div><label>2° incontro</label><select class="role2">${opts(rs[1])}</select></div></div></div>`}).join('')}<div class="field"><label>Note distinta</label><textarea id="lnote">${esc(lineup?.notes||'')}</textarea></div><div class="actions"><button class="btn secondary" onclick="saveLineup(false)">Salva bozza</button><button class="btn success" onclick="saveLineup(true)">Conferma distinta</button></div><h3 style="margin-top:24px">Risultato amichevole</h3><textarea id="resultJson" placeholder='{"matches":[]}'></textarea><button class="btn primary" onclick="saveResult()">Salva risultato amichevole</button>`;detail.classList.remove('hidden');detail.scrollIntoView({behavior:'smooth'})}
async function saveLineup(confirmLineup){const ps=[];for(const row of detail.querySelectorAll('.player')){const id=row.dataset.player,roles=[row.querySelector('.role1').value,row.querySelector('.role2').value].filter(Boolean);if(roles.length===2&&roles[0]===roles[1])return alert('Lo stesso giocatore non può avere due volte lo stesso incontro.');roles.forEach(position=>ps.push({player_id:id,position}))}const r=await sb.rpc('friendly_save_lineup',{p_friendly_match_id:detail.dataset.match,p_team_id:detail.dataset.team,p_players:ps,p_notes:lnote.value.trim(),p_confirm:confirmLineup});if(r.error)return alert(r.error.message);alert(confirmLineup?'Distinta confermata.':'Bozza salvata.');await openMatch(detail.dataset.match)}
async function saveResult(){let j;try{j=JSON.parse(resultJson.value||'{}')}catch(e){return alert('Formato risultato non valido.')}const r=await sb.rpc('friendly_save_result',{p_friendly_match_id:detail.dataset.match,p_result:j});if(r.error)return alert(r.error.message);alert('Risultato amichevole salvato. Nessun effetto sulla classifica.')}
window.sendInvite=sendInvite;window.respond=respond;window.openMatch=openMatch;window.saveLineup=saveLineup;window.saveResult=saveResult;load();
</script>
</body>
</html>
