<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tessera digitale giocatore</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
body{font-family:system-ui;background:#f4f8fc;color:#0a2e5e;margin:0}.shell{width:min(900px,calc(100% - 24px));margin:auto;padding:22px 0}.card{background:#fff;border:1px solid #b9cde3;border-radius:22px;padding:18px}.pass{border:2px solid #164a95;border-radius:24px;padding:20px}.top{display:grid;grid-template-columns:95px 1fr 95px;gap:14px;align-items:center;border-bottom:2px solid #b9cde3;padding-bottom:15px}.logo{width:92px;height:72px;object-fit:contain;background:#fff;border:1px solid #b9cde3;border-radius:13px;padding:6px}.body{display:grid;grid-template-columns:170px 1fr 125px;gap:18px;padding-top:18px}.photo{width:160px;height:205px;object-fit:cover;border-radius:16px;border:1px solid #b9cde3}.name{font-size:29px;font-weight:1000}.row{padding:7px 0;border-bottom:1px solid #b9cde3}.row b{display:block;font-size:11px;color:#627b97}.qr{width:120px;height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:#164a95;color:#fff}.secondary{background:#fff;color:#164a95;border:1px solid #164a95}.comp-logos{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}.comp-logo{width:78px;height:62px;object-fit:contain;background:#fff;border:1px solid #b9cde3;border-radius:12px;padding:5px}.hidden{display:none!important}.notice{padding:12px;background:#edf4fb;border:1px solid #b9cde3;border-radius:12px}.err{background:#fdecef;border-color:#dd7a85}@media(max-width:700px){.body{grid-template-columns:1fr}.photo,.qr{margin:auto}.top{grid-template-columns:72px 1fr 72px}.logo{width:70px;height:58px}.name{font-size:23px}}</style></head><body><main class="shell"><section class="card"><div class="actions"><button class="btn secondary" onclick="location.href='player-home.html?v=9927'">← Torna all’area giocatore</button><button class="btn primary" onclick="location.href='account-home.html?v=9927'">Menu account</button></div><div id="status" class="notice">Caricamento tessera…</div><div id="card" class="pass hidden"></div></section></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.getElementById(x),esc=x=>String(x??'');
async function init(){try{const session=(await s.auth.getSession()).data.session;if(!session){location.replace('login.html?change=1&v=9927');return}const r=await s.rpc('get_my_player_portal');if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data;if(!d||d.ok===false)throw new Error(d?.message||'Profilo giocatore non collegato a questo account.');const p=d.player||{},tm=d.team||{};if(!p.id)throw new Error('Anagrafica giocatore non disponibile.');const raw=String(tm.series||'').toUpperCase().replace(/\s+/g,'_');const code=raw==='A'?'SERIE_A':raw==='B'?'SERIE_B':raw==='C'?'SERIE_C':raw;const logos={SERIE_A:'assets/serie-a.png',SERIE_B:'assets/serie-b.png',SERIE_C:'assets/serie-c.png'};const sLogo=logos[code]||'assets/aics-logo.png';card.innerHTML=`<div class="top"><img class="logo" src="assets/aics-logo.png"><div style="text-align:center"><h2>AICS PADEL CHAMPIONSHIP</h2><strong>${esc(tm.name||'')}</strong><div class="comp-logos"><img class="comp-logo" src="${sLogo}" onerror="this.src='assets/aics-logo.png'"><img class="comp-logo" src="assets/coppa-italia.png" onerror="this.src='assets/aics-logo.png'"></div></div>${tm.logo_url?`<img class="logo" src="${esc(tm.logo_url)}">`:'<img class="logo" src="assets/aics-logo.png">'}</div><div class="body"><div>${p.photo_url?`<img class="photo" src="${esc(p.photo_url)}">`:'<div class="photo"></div>'}</div><div><div class="name">${esc(p.last_name||'')} ${esc(p.first_name||'')}</div><div class="row"><b>Squadra</b>${esc(tm.name||'')}</div><div class="row"><b>Campionato</b>${esc(tm.series||'')}</div><div class="row"><b>Coppa Italia</b>Competizione collegata</div><div class="row"><b>Classifica FITP</b>${esc(p.fitp_ranking||'')}</div><div class="row"><b>Data di nascita</b>${esc(p.birth_date||'')}</div><div class="row"><b>Scadenza certificato</b>${esc(p.medical_certificate_expiry||'')}</div><div class="row"><b>Email</b>${esc(p.email||'')}</div></div><div><div id="qr" class="qr"></div></div></div>`;card.classList.remove('hidden');new QRCode($('qr'),{text:`AICSPLAYER:${p.id}:${tm.id}`,width:108,height:108});status.textContent='Tessera digitale aggiornata.'}catch(e){status.textContent='Impossibile caricare la tessera: '+(e.message||e);status.className='notice err'}}init();
</script><div style="position:fixed;right:8px;bottom:8px;padding:5px 8px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui">V9.9.27 LINK E TESSERA GIOCATORE</div></body></html>
