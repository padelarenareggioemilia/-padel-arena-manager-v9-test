<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS Padel Championship · Tessera digitale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.333%,#fff 33.333% 66.666%,var(--r) 66.666%)}
.shell{width:min(900px,calc(100% - 24px));margin:auto;padding:22px 0 70px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 13px 30px rgba(8,47,104,.11)}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb}.err{background:#fdecef;border-color:#dd7a85}.hidden{display:none!important}
.pass{padding:20px;border-radius:24px;background:linear-gradient(135deg,#fff,#edf4fb);border:2px solid var(--b)}.top{display:grid;grid-template-columns:95px 1fr 95px;gap:14px;align-items:center;padding-bottom:15px;border-bottom:2px solid var(--line)}.aics,.team-logo{width:92px;height:72px;object-fit:contain;background:#fff;padding:6px;border-radius:13px;border:1px solid var(--line)}.title{text-align:center}.title h2{margin:0;color:var(--bd)}.title strong{font-size:20px;color:var(--b)}
.body{display:grid;grid-template-columns:170px 1fr 125px;gap:18px;padding-top:18px}.photo{width:160px;height:205px;object-fit:cover;border-radius:16px;border:1px solid var(--line)}.name{font-size:29px;font-weight:1000;color:var(--bd)}.row{padding:7px 0;border-bottom:1px solid var(--line)}.row b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}.qr{width:120px;height:120px;background:#fff;padding:5px;border:1px solid var(--line);border-radius:12px}.valid{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;background:#ebf8f0;border:1px solid var(--g);font-weight:900}
@media(max-width:700px){.top{grid-template-columns:70px 1fr 70px}.aics,.team-logo{width:68px;height:58px}.body{grid-template-columns:1fr}.photo,.qr{margin:auto}.name{text-align:center}}
</style></head><body><main class="shell">
<button class="btn secondary" onclick="location.href='player-home.html?v=986'">← Area Giocatore</button>
<section class="card"><div id="status" class="notice">Caricamento tessera…</div><div id="card" class="pass hidden"></div></section>
</main>
<div style="position:fixed;right:8px;bottom:8px;padding:4px 7px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui;opacity:.75">V9.8.5 IDENTITY FIX</div>
<script>
const cfg=window.PAM_V9_CONFIG,$=id=>document.getElementById(id),sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function v(o,...k){for(const x of k)if(o?.[x]!=null&&String(o[x]).trim())return o[x];return'—'}function dt(x){if(!x||x==='—')return'—';const d=new Date(x);return Number.isNaN(d.getTime())?x:d.toLocaleDateString('it-IT')}
async function init(){try{const q=await sb.auth.getSession();if(!q.data.session){location.replace('login.html?v=986');return}const p=await sb.from('profiles').select('role').eq('id',q.data.session.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()==='admin'){location.replace('index.html?v=986');return}
const r=await sb.rpc('get_my_player_portal');if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data;if(!d?.ok)throw new Error(d?.message||'Tessera non disponibile');const pl=d.player||{},t=d.team||{},photo=v(pl,'photo_url','profile_photo_url'),tl=v(t,'logo_url');
card.innerHTML=`<div class="top"><img class="aics" src="assets/aics-logo.png"><div class="title"><h2>AICS PADEL CHAMPIONSHIP</h2><strong>${esc(v(t,'name','team_name'))}</strong></div>${tl!=='—'?`<img class="team-logo" src="${esc(tl)}">`:'<div></div>'}</div>
<div class="body"><div>${photo!=='—'?`<img class="photo" src="${esc(photo)}">`:'<div class="photo" style="display:grid;place-items:center">FOTO NON DISPONIBILE</div>'}</div>
<div><div class="name">${esc(v(pl,'last_name'))} ${esc(v(pl,'first_name'))}</div><div class="row"><b>Squadra</b>${esc(v(t,'name','team_name'))}</div><div class="row"><b>Serie</b>${esc(v(t,'series'))}</div><div class="row"><b>Data di nascita</b>${esc(dt(v(pl,'birth_date')))}</div><div class="row"><b>Luogo di nascita</b>${esc(v(pl,'birth_place'))}</div><div class="row"><b>Classifica FITP</b>${esc(v(pl,'fitp_ranking','ranking'))}</div><div class="row"><b>Scadenza certificato medico</b>${esc(dt(v(pl,'medical_certificate_expiry','medical_expiry')))}</div><div class="row"><b>Email</b>${esc(v(pl,'email'))}</div><span class="valid">Giocatore riconosciuto</span></div>
<div><div id="qrCard" class="qr"></div></div></div>`;
card.classList.remove('hidden');new QRCode(document.getElementById('qrCard'),{text:location.href,width:108,height:108});status.textContent='Tessera caricata correttamente.'}catch(e){status.textContent='Errore: '+(e.message||String(e));status.className='notice err'}}
init();
</script></body></html>
