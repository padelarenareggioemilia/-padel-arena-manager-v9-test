<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tessera digitale giocatore</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
body{font-family:system-ui;background:#f4f8fc;color:#0a2e5e;margin:0}.shell{width:min(900px,calc(100% - 24px));margin:auto;padding:22px 0}.card{background:#fff;border:1px solid #b9cde3;border-radius:22px;padding:18px}.pass{border:2px solid #164a95;border-radius:24px;padding:20px}.top{display:grid;grid-template-columns:95px 1fr 95px;gap:14px;align-items:center;border-bottom:2px solid #b9cde3;padding-bottom:15px}.logo{width:92px;height:72px;object-fit:contain;background:#fff;border:1px solid #b9cde3;border-radius:13px;padding:6px}.body{display:grid;grid-template-columns:170px 1fr 125px;gap:18px;padding-top:18px}.photo{width:160px;height:205px;object-fit:cover;border-radius:16px;border:1px solid #b9cde3}.name{font-size:29px;font-weight:1000}.row{padding:7px 0;border-bottom:1px solid #b9cde3}.row b{display:block;font-size:11px;color:#627b97}.qr{width:120px;height:120px}.hidden{display:none!important}.notice{padding:12px;background:#edf4fb;border:1px solid #b9cde3;border-radius:12px}@media(max-width:700px){.body{grid-template-columns:1fr}.photo,.qr{margin:auto}}</style></head><body><main class="shell"><section class="card"><div id="status" class="notice">Caricamento…</div><div id="card" class="pass hidden"></div></section></main><script>
const c=window.PAM_V9_CONFIG,s=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.getElementById(x),esc=x=>String(x??'');
async function init(){try{const r=await s.rpc('get_my_player_portal');if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data,p=d.player||{},t=d.team||{};card.innerHTML=`<div class="top"><img class="logo" src="assets/aics-logo.png"><div style="text-align:center"><h2>AICS PADEL CHAMPIONSHIP</h2><strong>${esc(t.name||'')}</strong></div>${t.logo_url?`<img class="logo" src="${esc(t.logo_url)}">`:''}</div><div class="body"><div>${p.photo_url?`<img class="photo" src="${esc(p.photo_url)}">`:''}</div><div><div class="name">${esc(p.last_name||'')} ${esc(p.first_name||'')}</div><div class="row"><b>Squadra</b>${esc(t.name||'')}</div><div class="row"><b>Serie</b>${esc(t.series||'')}</div><div class="row"><b>Classifica FITP</b>${esc(p.fitp_ranking||'')}</div><div class="row"><b>Scadenza certificato</b>${esc(p.medical_certificate_expiry||'')}</div></div><div><div id="qr" class="qr"></div></div></div>`;card.classList.remove('hidden');new QRCode($('qr'),{text:`AICSPLAYER:${p.id}:${t.id}`,width:108,height:108});status.textContent='Tessera caricata.'}catch(e){status.textContent='Errore: '+(e.message||e)}}init();
</script></body></html>
