<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AICS Padel Championship · Tessera digitale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--b:#164a95;--bd:#082f68;--g:#009246;--r:#ce2b37;--bg:#f4f8fc;--line:#b9cde3;--text:#0a2e5e;--muted:#627b97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--text)}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--g) 0 33.333%,#fff 33.333% 66.666%,var(--r) 66.666%)}
.shell{width:min(850px,calc(100% - 24px));margin:auto;padding:22px 0 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 13px 30px rgba(8,47,104,.11)}.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.hero img{width:105px;height:68px;object-fit:contain;background:#fff;padding:7px;border-radius:14px}.hero h1{margin:0}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.secondary{background:#fff;color:var(--b);border:1px solid var(--b)}.notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#edf4fb}.err{background:#fdecef;border-color:#dd7a85}.hidden{display:none!important}
.pass{display:grid;grid-template-columns:170px 1fr;gap:18px;padding:20px;border-radius:22px;background:linear-gradient(135deg,#fff,#edf4fb);border:2px solid var(--b)}.photo{width:160px;height:205px;object-fit:cover;border-radius:16px;background:#fff;border:1px solid var(--line)}.name{font-size:30px;font-weight:1000;color:var(--bd)}.team{font-size:20px;font-weight:900;color:var(--b);margin:5px 0}.row{padding:8px 0;border-bottom:1px solid var(--line)}.row b{display:block;font-size:12px;text-transform:uppercase;color:var(--muted)}.valid{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;background:#eaf8f0;border:1px solid var(--g);font-weight:900}
@media(max-width:650px){.pass{grid-template-columns:1fr}.photo{margin:auto}.name{text-align:center}.team{text-align:center}}
</style>
</head>
<body><main class="shell">
<button class="btn secondary" onclick="location.href='player-home.html?v=985'">← Area Giocatore</button>
<section class="hero"><img src="assets/aics-logo.png" alt="AICS"><div><h1>AICS PADEL CHAMPIONSHIP</h1><div>Tessera digitale giocatore</div></div></section>
<section class="card"><div id="status" class="notice">Caricamento tessera…</div><div id="card" class="pass hidden"></div></section>
</main>
<div style="position:fixed;right:8px;bottom:8px;padding:4px 7px;border-radius:999px;background:#082f68;color:#fff;font:700 10px system-ui;opacity:.75">V9.8.4 PLAYER COMPLETE</div>
<script>
const cfg=window.PAM_V9_CONFIG,$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
function val(p,...keys){for(const k of keys)if(p?.[k]!=null&&String(p[k]).trim())return p[k];return '—'}
function date(v){if(!v||v==='—')return '—';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('it-IT')}
async function init(){
 try{
  const q=await sb.auth.getSession();if(q.error)throw q.error;if(!q.data.session){location.replace('login.html?v=985');return}
  const r=await sb.rpc('get_my_player_portal');if(r.error)throw r.error;
  const d=Array.isArray(r.data)?r.data[0]:r.data;if(!d?.ok)throw new Error(d?.message||'Tessera non disponibile.');
  const p=d.player||{},t=d.team||{},photo=val(p,'photo_url','photo','profile_photo_url');
  card.innerHTML=`<div>${photo!=='—'?`<img class="photo" src="${esc(photo)}" alt="Foto giocatore">`:`<div class="photo" style="display:grid;place-items:center">FOTO NON DISPONIBILE</div>`}</div>
  <div><div class="name">${esc(val(p,'first_name'))} ${esc(val(p,'last_name'))}</div><div class="team">${esc(val(t,'name','team_name'))}</div>
  <div class="row"><b>Serie</b>${esc(val(t,'series'))}</div>
  <div class="row"><b>Data di nascita</b>${esc(date(val(p,'birth_date')))}</div>
  <div class="row"><b>Luogo di nascita</b>${esc(val(p,'birth_place'))}</div>
  <div class="row"><b>Classifica FITP</b>${esc(val(p,'fitp_ranking','ranking'))}</div>
  <div class="row"><b>Scadenza certificato medico</b>${esc(date(val(p,'medical_certificate_expiry','medical_expiry')))}</div>
  <div class="row"><b>Email</b>${esc(val(p,'email'))}</div>
  <span class="valid">Giocatore riconosciuto</span></div>`;
  status.textContent='Tessera caricata correttamente.';status.className='notice';card.classList.remove('hidden');
 }catch(e){status.textContent='Errore: '+(e.message||String(e));status.className='notice err'}
}
init();
</script></body></html>
